{id:"l1",t:"Leyendas y relatos de los pueblos originarios",a:"Lengua",g:"3.°",w:4,f:"Los relatos orales qom, wichí y pilagá forman parte del patrimonio cultural de Formosa. Leerlos, escucharlos y reescribirlos fortalece la comprensión lectora y la valoración de la diversidad.",o:["Leer y escuchar leyendas de pueblos originarios de la región","Reconocer inicio, nudo y desenlace","Producir una versión escrita colectiva"],ac:["Invitar a un referente comunitario o familiar a contar un relato","Lectura compartida de leyendas","Dibujar y secuenciar la historia","Reescritura colectiva y revisión en parejas","Armado de un libro ilustrado para la biblioteca escolar"],r:"Libros de leyendas, hojas, lápices de colores, grabador del celular",e:"Participación oral, coherencia de la reescritura, respeto por la fuente cultural",p:"Libro ilustrado de leyendas"},
{id:"l2",t:"La feria de mi barrio: dinero y medidas",a:"Matemática",g:"4.°",w:3,f:"La feria es un espacio cotidiano donde se usan el dinero, las medidas y los cálculos. Simularla permite dar sentido a los problemas de suma, resta, multiplicación y medidas.",o:["Resolver problemas con dinero y vuelto","Usar unidades de peso y capacidad","Registrar compras en tablas"],ac:["Relevar precios de productos regionales (mandioca, zapallo, miel, pescado)","Armar puestos de feria en el aula","Compras y ventas con billetes de juguete","Resolución de problemas a partir de tickets","Puesta en común de estrategias de cálculo"],r:"Billetes de juguete, balanza, frascos medidores, folletos de precios",e:"Resolución de problemas, uso de estrategias, registro en tablas",p:"Feria escolar abierta a las familias"},
{id:"l3",t:"El monte formoseño y sus habitantes",a:"Ciencias Naturales",g:"5.°",w:5,f:"Formosa abarca ambientes como el monte chaqueño, los esteros y los ríos. Conocer su fauna y flora ayuda a comprender la biodiversidad y la necesidad de cuidarla.",o:["Identificar seres vivos del monte (yaguareté, tatú carreta, palo borracho, algarrobo)","Reconocer relaciones alimentarias","Analizar amenazas a la biodiversidad"],ac:["Salida al patio o a un monte cercano para observar","Fichas de seres vivos de la región","Armado de redes tróficas","Debate sobre desmonte y conservación","Muestra con maquetas del ambiente"],r:"Lupas, cuaderno de campo, láminas, cartulinas",e:"Observación, uso de vocabulario científico, fichas y maqueta",p:"Muestra «Biodiversidad de mi provincia»"},
{id:"l4",t:"Formosa a través del tiempo",a:"Ciencias Sociales",g:"6.°",w:5,f:"Reconstruir la historia de la provincia, desde los pueblos originarios hasta la fundación de la ciudad en 1879 y la provincialización, permite comprender la identidad local.",o:["Ordenar hechos en líneas de tiempo","Reconocer a los pueblos originarios como protagonistas","Analizar fuentes y testimonios"],ac:["Línea de tiempo del aula","Análisis de fotos antiguas y relatos de abuelos","Entrevistas a vecinos","Mapa del río Paraguay y la frontera","Exposición oral por equipos"],r:"Fotografías, mapas, cartulinas, grabador",e:"Línea de tiempo, entrevistas, exposición",p:"Museo escolar de la historia local"},
{id:"l5",t:"Huerta escolar con riego casero",a:"Educación Tecnológica",g:"4.°",w:6,f:"El clima cálido y seco de gran parte de la provincia exige pensar el uso del agua. Diseñar una huerta con riego simple vincula tecnología, ambiente y alimentación.",o:["Diseñar y construir un sistema de riego con materiales reciclados","Reconocer procesos de producción de alimentos","Registrar el crecimiento de las plantas"],ac:["Diagnóstico del espacio y del sol disponible","Diseño del sistema en un plano","Construcción de riego por goteo con botellas","Siembra de especies de estación","Registro semanal con fotos y medidas"],r:"Botellas, tierra, semillas, herramientas pequeñas",e:"Diseño, funcionamiento del sistema, registro",p:"Huerta funcionando y cosecha compartida"},
{id:"l6",t:"Tramas del chaguar: arte y cultura wichí",a:"Educación Artística",g:"2.°",w:3,f:"El tejido con fibra de chaguar es un arte tradicional del pueblo wichí. Conocer sus técnicas y diseños permite apreciar el arte originario y producir obras propias.",o:["Apreciar artesanías de los pueblos originarios","Experimentar con tramas y patrones","Expresar ideas con color y forma"],ac:["Observación de artesanías reales o en imágenes","Charla con una artesana o un artesano de la comunidad","Tejido simple con lana y cartón","Diseño de patrones geométricos","Exposición con cartelería"],r:"Lana, cartón, tijeras, imágenes de artesanías",e:"Participación, creatividad, respeto por la cultura",p:"Muestra de tejidos del grado"},
{id:"l7",t:"Juegos de ayer y de hoy",a:"Educación Física",g:"3.°",w:3,f:"Los juegos tradicionales de la región transmiten cultura y promueven la cooperación, el movimiento y el disfrute compartido.",o:["Participar en juegos tradicionales y de pueblos originarios","Cooperar y respetar reglas","Mejorar habilidades motoras básicas"],ac:["Relevamiento de juegos con las familias","Aprendizaje de reglas y variantes","Torneos cooperativos","Creación de un juego nuevo por grupo","Festival de juegos"],r:"Soga, pelotas, tizas, aros",e:"Participación, cooperación, cumplimiento de reglas",p:"Festival de juegos para toda la escuela"},
{id:"l8",t:"Convivir entre culturas",a:"Formación Ética y Ciudadana",g:"5.°",w:4,f:"Formosa es una provincia diversa, con comunidades criollas, originarias y migrantes. Trabajar la convivencia intercultural fortalece el respeto y los derechos.",o:["Reconocer la diversidad cultural y lingüística","Analizar situaciones de discriminación","Proponer acuerdos de convivencia"],ac:["Mapa de orígenes de las familias del grado","Aprender palabras en lenguas originarias","Análisis de casos y juego de roles","Redacción de acuerdos de convivencia","Campaña de difusión escolar"],r:"Mapa, afiches, relatos, recursos de EIB",e:"Reflexión, participación, acuerdos construidos",p:"Campaña «Somos muchas culturas»"},
{id:"l9",gs:["1.°","2.°","3.°"],t:"Fauna y flora de Formosa: zona húmeda y zona semiárida",a:"Ciencias Naturales",g:"1.° a 3.°",w:3,src:"Cuaderno de Ciencias Sociales, Primer Ciclo (Gobierno de Formosa), Propuesta 1",f:"La provincia tiene dos grandes zonas según las lluvias: la húmeda (este) y la semiárida (centro y oeste). Conocer los animales y las plantas de cada una permite valorar el ambiente y cuidarlo, y reconocer que un mismo ser vivo puede tener distintos nombres en distintas lenguas.",o:["Reconocer la fauna y la flora de la zona húmeda y de la semiárida","Elaborar fichas técnicas de un animal y una planta de la propia zona","Reflexionar sobre el cuidado del yaguareté y otras especies"],ac:["Lectura compartida sobre fauna y flora de cada zona (carpincho, yacaré, ñandú, tatú carreta, yaguareté, lapacho, algarrobo, quebracho)","Listas de cinco animales y cinco plantas, y juego con palabras cortas y largas","Fichas técnicas: dónde vive, de qué se alimenta, cómo se desplaza, tipo de piel, dato curioso","Dibujar en el mapa un animal y una planta de la zona donde vive cada chico","Leer la ficha del yaguareté y conversar con un adulto sobre por qué cuidarlo","Maqueta de un animal con materiales reutilizables y exposición oral","Fábula «La hormiga y la paloma» y relatos de pueblos originarios (versión en español y en qom)"],r:"Cuaderno de Ciencias Sociales de Primer Ciclo, mapa de Formosa, cartón y materiales descartables, celular con lector de QR",e:"Fichas completas, participación oral, maqueta y explicación de por qué se eligió el animal",p:"Muestra de fichas técnicas y maquetas de la fauna formoseña"},
{id:"l10",gs:["1.°","2.°","3.°"],t:"Lugares que protegen a los animales y las plantas",a:"Ciencias Naturales",g:"1.° a 3.°",w:2,src:"Cuaderno de Ciencias Sociales, Primer Ciclo (Gobierno de Formosa), Propuesta 2",f:"Las reservas naturales y los parques nacionales son áreas protegidas donde se cuidan especies autóctonas. Conocerlas ayuda a entender por qué es importante preservar el ambiente y cómo comportarse al visitarlas.",o:["Diferenciar reserva natural y parque nacional","Conocer el trabajo de los guardaparques","Formular recomendaciones para visitar áreas protegidas"],ac:["Lectura sobre reserva natural y parque nacional","Ubicar en el mapa: Reserva Natural Formosa, Laguna Oca, Bañado La Estrella, El Bagual, Guaycolec y Parque Nacional Río Pilcomayo","Fichas de animales y plantas de cada lugar protegido","Conversación sobre qué hacen los guardaparques y qué pueden hacer las familias en una visita","Escribir y dibujar tres recomendaciones para visitar estos lugares","Lista de palabras nuevas con su significado (autóctonas, biósfera, bañado)"],r:"Cuaderno de Ciencias Sociales, mapa de Formosa, láminas, hojas y lápices",e:"Diferencia reserva y parque, recomendaciones escritas, uso del vocabulario nuevo",p:"Afiche «Cuidemos los lugares protegidos de Formosa»"},
{id:"l11",gs:["1.°","2.°","3.°"],t:"Los símbolos formoseños",a:"Ciencias Sociales",g:"1.° a 3.°",w:3,src:"Cuaderno de Ciencias Sociales, Primer Ciclo (Gobierno de Formosa), Propuesta 3",f:"La bandera, el escudo y el Himno Marcha a Formosa forman parte de la identidad provincial. Conocer su significado y las tradiciones locales, como el chamamé, fortalece el sentido de pertenencia.",o:["Reconocer la bandera, el escudo y el himno de la provincia","Explicar el significado de sus partes","Valorar tradiciones, comidas y música de Formosa"],ac:["Lectura de la información sobre la bandera (aprobada en 1991) y completar el cuadro con lo que simboliza cada parte","Lectura sobre el escudo (ley de 1959) y pintar sus partes con los colores correspondientes","Escuchar el Himno Marcha a Formosa y buscar las palabras que nombran la flora formoseña","Completar oraciones con las palabras bandera, escudo e himno marcha","Listado de tradiciones y comidas típicas","Escuchar la canción «Viento Norte» (chamamé) y completar el estribillo con rimas nuevas"],r:"Cuaderno de Ciencias Sociales, grabación del himno y de la canción, lápices de colores",e:"Reconocimiento de los símbolos, cuadros completos, rimas creadas",p:"Acto escolar con los símbolos provinciales y un chamamé creado por el grado"},
{id:"l12",gs:["1.°","2.°","3.°"],t:"Formosa, multiétnica y pluricultural",a:"Ciencias Sociales",g:"1.° a 3.°",w:3,src:"Cuaderno de Ciencias Sociales, Primer Ciclo (Gobierno de Formosa), Propuesta 4",f:"En Formosa conviven los pueblos wichí, qom y pilagá, otros pueblos originarios, comunidades criollas y la herencia guaraní. Conocer sus lenguas y juegos favorece el respeto y la convivencia.",o:["Reconocer los pueblos originarios presentes en la provincia","Ubicar en un mapa la propia localidad y la comunidad originaria más cercana","Aprender saludos en lenguas originarias y practicar un juego tradicional"],ac:["Lectura sobre el origen del nombre Formosa y sus antiguos habitantes","Observar el mapa de lenguas y culturas y buscar los nombres de los pueblos en una sopa de letras","Ubicar la propia ciudad, pueblo o comunidad y la comunidad indígena más cercana","Aprender saludos en wichí, qom, pilagá y guaraní","Jugar al Polke siguiendo las instrucciones del cuaderno","Lista de palabras nuevas (herencia, subsistencia, denominación)"],r:"Cuaderno de Ciencias Sociales, mapa, palos achatados y pelota pequeña para el Polke",e:"Ubicación en el mapa, uso de saludos, participación y respeto en el juego",p:"Jornada de juegos y saludos en las lenguas de Formosa"},
{id:"l13",gs:["1.°","2.°","3.°"],t:"Los hitos de Formosa y mi propia historia",a:"Ciencias Sociales",g:"1.° a 3.°",w:4,src:"Cuaderno de Ciencias Sociales, Primer Ciclo (Gobierno de Formosa), Propuesta 5",f:"Los hitos son hechos importantes en la historia de una persona o de una comunidad. Partir de la propia historia y de las líneas de tiempo ayuda a comprender los hitos de la provincia: la fundación, la provincialización y el Modelo Formoseño.",o:["Construir una línea de tiempo con hechos de la propia vida","Conocer los tres hitos históricos que presenta el cuaderno","Comparar cómo era y cómo es el lugar donde se vive"],ac:["Responder sobre la fecha de nacimiento, el lugar donde vivo y mi familia","Armar la línea de tiempo personal","Leer sobre la fundación de la ciudad el 8 de abril de 1879 por Luis Jorge Fontana y completar su ficha biográfica","Leer la biografía del autor del himno, Armando De Vita Lacerra, y completar su ficha","Provincialización (ley 14.408, 1955): conversar con un adulto sobre cómo se festeja en la localidad","Modelo Formoseño (10 de diciembre de 1995): dibujar el antes y el ahora del lugar y escribir tres oraciones","Plano sencillo del recorrido de la casa a la escuela, ubicando instituciones cercanas"],r:"Cuaderno de Ciencias Sociales, fotografías familiares, cartulinas, hojas y lápices",e:"Línea de tiempo, fichas biográficas, dibujos y oraciones comparando el antes y el ahora",p:"Línea de tiempo del grado con los hitos formoseños y las historias personales"},
{id:"l14",gs:["4.°","5.°","6.°"],t:"Formosa, pasado y presente",a:"Ciencias Sociales",g:"4.° a 6.°",w:3,src:"Cuaderno de Ciencias Sociales, Segundo Ciclo (Gobierno de Formosa), Propuesta Pasado y presente",f:"Formosa nació como villa y colonia a orillas del río Paraguay y creció con el esfuerzo de colonos e inmigrantes. Comparar el ayer con el hoy permite reconocer cambios y continuidades en la vida cotidiana, el trabajo y la infraestructura.",o:["Distinguir características del pasado y del presente de la provincia","Reconocer cómo el tren, el puerto y los obrajes dieron origen a pueblos","Redactar un texto sobre los cambios observados en la propia localidad"],ac:["Leer el texto y subrayar con un color lo que corresponde al pasado y con otro lo que corresponde al presente","Observar imágenes antiguas y actuales: ex Casa de Gobierno, capilla San Antonio, antigua estación del ferrocarril, hospital, bañado La Estrella","Reconstruir cómo se formó la villa: colonos, chacras, huertas, tambos, puerto y ferrocarril hasta Embarcación (Salta)","Conversar con un adulto sobre los progresos de la localidad (edificios, salud, educación, recreación, rutas, seguridad)","Redactar dos párrafos con el crecimiento observado","Armar un panel de fotos del antes y el ahora"],r:"Cuaderno de Ciencias Sociales de Segundo Ciclo, fotografías antiguas y actuales, cartulinas",e:"Distingue pasado y presente, redacta con claridad, usa la información de la entrevista",p:"Panel «Antes y ahora de mi localidad»"},
{id:"l15",gs:["4.°","5.°","6.°"],t:"La provincialización de Formosa y sus protagonistas",a:"Ciencias Sociales",g:"4.° a 6.°",w:4,src:"Cuaderno de Ciencias Sociales, Segundo Ciclo (Gobierno de Formosa), Propuestas 3 y 4",f:"Durante unos 70 años Formosa fue territorio nacional. En 1955 una comisión de vecinos impulsó la provincialización. Conocer a los protagonistas y las fechas ayuda a comprender cómo se construyó la autonomía provincial.",o:["Reconstruir el proceso de provincialización con sus fechas y protagonistas","Conocer biografías de Luis Jorge Fontana, Francisca Zambonini de Zambrini y Vicente Arcadio Salemi","Expresar emociones y agradecimiento mediante un diálogo escrito"],ac:["Leer sobre el territorio nacional, la comisión pro-provincialización (asamblea del 19 de febrero de 1955), la entrevista del 5 de abril y la ley 14.408 (sancionada el 15 y promulgada el 28 de junio de 1955)","Leer las tres biografías: fundador, primera maestra y presidente de la comisión","Elegir un personaje y escribir un diálogo de diez a doce renglones con emociones y un agradecimiento","Resolver la sopa de letras con los datos históricos del texto","Representar gráficamente la entrega del petitorio en Buenos Aires en 1955","Resolver el acróstico con las referencias de la provincialización","Averiguar qué escuela de la localidad lleva el nombre de alguno de los personajes"],r:"Cuaderno de Ciencias Sociales de Segundo Ciclo, imágenes de la época, hojas y lápices",e:"Ubica hechos y personajes, escribe el diálogo con coherencia, resuelve las actividades",p:"Dramatización de la entrega del petitorio de 1955"},
{id:"l16",gs:["4.°","5.°","6.°"],t:"Símbolos patrios nacionales y provinciales",a:"Ciencias Sociales",g:"4.° a 6.°",w:3,src:"Cuaderno de Ciencias Sociales, Segundo Ciclo (Gobierno de Formosa), Propuestas 2, 5 y 6",f:"Comparar los símbolos nacionales con los provinciales (escudo, bandera e himno) permite reconocer su origen, su significado y lo que tienen en común. La Promesa de Lealtad a la Bandera de Formosa, que prestaron los chicos de cuarto grado cada 8 de abril, es una tradición escolar de la provincia.",o:["Comparar símbolos nacionales y provinciales","Explicar el significado de la bandera y el escudo de Formosa","Reflexionar sobre el compromiso de la Promesa de Lealtad"],ac:["Investigar creadores y fechas de los símbolos nacionales y completar el cuadro comparativo","Releer el Himno Marcha a Formosa (letra de Armando De Vita Lacerra, música de Víctor Rival, estrenado el 8 de abril de 1955) y subrayar las palabras que nombran la naturaleza","Responder por qué el himno no honra héroes ni batallas y qué sentimientos provoca","Completar semejanzas y diferencias entre las banderas y los escudos (paño partido en tres, guirnalda de laureles, nueve estrellas, capullo de algodón)","Entrevistar a un familiar que prometió lealtad a la bandera y escribir tres preguntas","Escribir tres acciones cotidianas para mantener viva la promesa y dibujar el momento más significativo del acto"],r:"Cuaderno de Ciencias Sociales de Segundo Ciclo, imágenes de los símbolos, grabación del himno",e:"Cuadros comparativos completos, entrevista, reflexión personal",p:"Mural comparativo de los símbolos nacionales y provinciales"},
{id:"l17",gs:["4.°","5.°","6.°"],t:"La línea de tiempo de la historia de Formosa",a:"Ciencias Sociales",g:"4.° a 6.°",w:2,src:"Cuaderno de Ciencias Sociales, Segundo Ciclo (Gobierno de Formosa), Propuesta 7",f:"La línea de tiempo ordena los hechos en el orden en que sucedieron y trabaja con una escala que relaciona el tiempo con la medida. Es un recurso que integra Ciencias Sociales y Matemática.",o:["Ordenar cronológicamente hechos de la historia provincial","Construir una línea de tiempo a escala","Usar la escala para calcular distancias entre fechas"],ac:["Explicar qué es y para qué sirve una línea de tiempo","Ordenar los hechos: fundación (1879), provincialización (1955), Modelo Formoseño (1995) y cincuentenario de la provincialización (2005)","Dibujar la línea con la escala 1 centímetro = 10 años","Calcular los centímetros que separan cada hecho","Agregar hechos de la historia de la propia localidad"],r:"Cinta métrica o regla, papel afiche, marcadores",e:"Orden correcto de los hechos, aplicación de la escala, prolijidad",p:"Línea de tiempo a escala en el aula"},
{id:"l18",gs:["4.°","5.°","6.°"],t:"El Preámbulo de la Constitución provincial",a:"Formación Ética y Ciudadana",g:"4.° a 6.°",w:2,src:"Cuaderno de Ciencias Sociales, Segundo Ciclo (Gobierno de Formosa), Propuesta 1",f:"La Constitución provincial es la ley fundamental que establece los deberes y derechos de los habitantes. Leer su preámbulo permite entender para qué existe una constitución y qué valores expresa.",o:["Comprender qué es una constitución y qué es un preámbulo","Identificar los objetivos que el preámbulo se propone","Reconocer la identidad multiétnica y pluricultural"],ac:["Buscar en el diccionario el significado de preámbulo","Leer el preámbulo y completar un cuadro con los verbos plasmar, reafirmar, garantizar y constituir","Identificar la forma de gobierno y la concepción que menciona","Reescribir con palabras propias qué se propone la constitución","Debatir qué derechos y deberes conocemos los chicos"],r:"Cuaderno de Ciencias Sociales de Segundo Ciclo, diccionario",e:"Comprensión del texto, cuadro completo, participación en el debate",p:"Preámbulo ilustrado con palabras propias"},
{id:"l19",t:"El primer mes de primer grado: nos conocemos",a:"Lengua",g:"1.°",w:4,src:"Todos pueden aprender: Lengua en 1.° (UNICEF y Asociación Civil Educación para Todos, 2007), sección 1",f:"El primer mes de clases sirve para que los chicos se conozcan, se ambienten en la escuela y construyan rutinas, mientras empiezan a leer y escribir a partir de sus propios nombres. La alfabetización necesita un clima de confianza y afecto.",o:["Presentarse y conversar respetando los turnos de intercambio","Leer y escribir el propio nombre y el de los compañeros","Reconocer la escuela, sus espacios y las personas que trabajan en ella","Familiarizarse con el cuaderno, el lápiz y la biblioteca"],ac:["Conversación de presentación con tarjetas con los nombres y un póster con el título del grupo","Recorrida por la escuela, lectura de carteles (Dirección, Biblioteca, Baño) y conversación sobre el nombre de la escuela","Uso diario de la lista de asistencia (P de presente y A de ausente)","Exploración del cuaderno y del lápiz","Armado de nombres con letras sueltas por mesa","Lectura de un cuento en voz alta por el docente, cada día","Palabras largas y cortas, principios y finales iguales, y reconocimiento de las vocales con los nombres del grupo","Juegos en el patio (adelante y atrás, el tesoro escondido, el veo-veo) alternados con el trabajo en el aula","Exploración libre de libros en la biblioteca del aula o de la escuela"],r:"Tarjetas, papel afiche, marcadores, letras móviles, cuentos, biblioteca del aula",e:"Observación de la participación oral, lectura y escritura del propio nombre, registro breve de atención y convivencia",p:"Póster del grado con los nombres de todos y el cuaderno de presentación"},
{id:"l20",t:"Coplas, rimas y juegos del lenguaje",a:"Lengua",g:"1.°",w:2,src:"Todos pueden aprender: Lengua en 1.° (UNICEF y Asociación Civil Educación para Todos, 2007), sección 2.1",f:"Las coplas, rimas, trabalenguas y adivinanzas son textos de la tradición oral que los chicos recuerdan fácilmente. Trabajar con ellos permite descubrir las rimas, leer palabras y escribir con ayuda.",o:["Recitar y leer textos de tradición oral","Reconocer rimas y palabras con finales iguales","Escribir palabras y versos nuevos con ayuda del docente"],ac:["Conversar sobre los juegos con palabras, canciones y coplas que conocen y cantarlas o palmearlas","Recitado y lectura en eco, con gestos para cada verso","Pegar el texto en el cuaderno, leerlo de a dos y marcar las rimas con color","Completar los blancos del poema consultando el texto completo","Inventar versos nuevos con palabras que riman y escribirlos en el pizarrón","Palabras largas y cortas, singular y plural con la letra s, y armado de palabras con letras sueltas","Ilustrar los versos inventados y armar un mural para mostrar a otros grados y a las familias","Dictado de palabras sin ayuda y revisión guiada"],r:"Copia del texto elegido, papel afiche, tarjetas con palabras, letras sueltas",e:"Reconoce rimas, completa y escribe palabras, participa en el recitado",p:"Mural de versos ilustrados"},
{id:"l21",t:"La receta de cocina: ensalada de frutas",a:"Lengua",g:"1.°",w:3,src:"Todos pueden aprender: Lengua en 1.° (UNICEF y Asociación Civil Educación para Todos, 2007), sección 2.2",f:"La receta es un texto instruccional cercano a la vida cotidiana. Permite aprender sus partes (título, ingredientes y preparación), leer listas y verbos de acción, y terminar cocinando entre todos. Se puede reemplazar por una receta o frutas de la zona.",o:["Reconocer el formato de una receta y sus partes","Leer y escribir listas de ingredientes y pasos de preparación","Usar la lectura para realizar una tarea real"],ac:["Conversar sobre recetas, comidas típicas y favoritas, y la relación entre el lugar donde se vive y lo que se come","Explorar recetas en diarios, libros y revistas y distinguir ingredientes y preparación","Lectura global de la receta y marcado de sus partes con colores","Escuchar la lectura del docente y recordar ingredientes y pasos","Escribir en tarjetas de colores los nombres de las frutas y los verbos pelar, cortar, separar, poner y mezclar","Armar las frases de la preparación","Palabras largas y cortas, singular y plural, y lectura de palabras entre distractores","Escribir la lista de compras, comprar los ingredientes, preparar la receta y comerla"],r:"Receta escrita en afiche, tarjetas de colores, frutas y utensilios",e:"Reconoce las partes de la receta, lee y escribe la lista, participa en la preparación",p:"Libretita con la receta y fotos de la preparación"},
{id:"l22",t:"El cuento: personajes, conflicto y final",a:"Lengua",g:"1.°",w:3,src:"Todos pueden aprender: Lengua en 1.° (UNICEF y Asociación Civil Educación para Todos, 2007), sección 2.3",f:"En los primeros meses conviene elegir cuentos con repeticiones, que los chicos pueden anticipar. Más adelante se trabaja la estructura de introducción, conflicto y resolución. El libro usa como ejemplo una adaptación del cuento Federico dice no, pero puede reemplazarse por un cuento regional, como los del zorro.",o:["Comprender un cuento leído en voz alta y renarrarlo","Identificar personajes, conflicto y desenlace","Leer y escribir palabras y oraciones del cuento"],ac:["Lectura en voz alta y conversación sobre cómo son los personajes","Renarración y dramatización repartiendo los roles","Conversar sobre el problema inicial, el final y qué hace cambiar al personaje principal","Ponerles nombre a los personajes y dibujarlos","Buscar palabras repetidas y armar el mapa del cuento (lo que le gusta y lo que no le gusta)","Completar y escribir oraciones con los nombres de los personajes","Análisis de palabras del cuento: largas y cortas, finales iguales, vocales","Inventar y escribir una situación nueva para el cuento con ayuda del docente","Lectura a varias voces: cada subgrupo asume un personaje"],r:"Cuento elegido, tarjetas con palabras, cuaderno, hojas de dibujo",e:"Renarra con secuencia, identifica personajes y conflicto, lee y escribe oraciones",p:"Dramatización del cuento y libro de oraciones del grado"},
{id:"l23",t:"Vamos al patio: contamos y justificamos",a:"Matemática",g:"1.°",w:1,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 1",f:"Los chicos llegan a primer grado con muchos saberes sobre los números. Contar para resolver una necesidad real, como repartir el material de cada uno, permite reflexionar sobre cómo se cuenta y explicar por qué se obtiene un resultado.",o:["Contar colecciones hasta 10 usando distintas estrategias","Explicar cómo contaron y por qué obtuvieron ese resultado","Organizar el material para entregarlo una sola vez"],ac:["Salir al patio y buscar el material necesario para que cada compañero tenga el suyo","Contar la cantidad de presentes del día y anotarla","Comparar las formas de contar de distintos chicos","Puesta en común: qué hizo cada uno para no equivocarse","Conteo diario del grupo como actividad permanente"],r:"Tarjetas, objetos pequeños del patio o del aula (palitos, tapitas, piedritas), cuaderno",e:"Cuenta colecciones pequeñas, explica su estrategia, registra la cantidad",p:"Registro del conteo diario del grupo"},
{id:"l24",t:"¿Para qué sirven los números? La banda numérica",a:"Matemática",g:"1.°",w:2,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 1",f:"Los números están en todas partes: sirven para indicar cantidades, para identificar y para ordenar. La banda numérica es un recurso para ver cómo se escriben y se ordenan.",o:["Identificar dónde hay números y qué función cumplen","Usar la banda numérica como apoyo para leer, escribir y comparar números","Ordenar números de menor a mayor"],ac:["Buscar números en imágenes (precios, teléfonos, líneas de colectivo, fechas) y conversar para qué sirven","Armar la banda numérica del aula y explorar su organización","Juego de cartas con un compañero para armar la serie numérica","Recortar números y ordenarlos de menor a mayor en el cuaderno","Comparar cantidades iguales distribuidas de distinta manera (conservación de la cantidad)","Juego de dados o cartas: gana quien saca más, anotando con porotos por cuánto ganó"],r:"Banda numérica, cartas, dados, porotos, recortes con números",e:"Identifica funciones de los números, ordena series, justifica comparaciones",p:"Banda numérica del aula y cartel «Los números que encontramos»"},
{id:"l25",t:"Elegimos qué podemos comprar",a:"Matemática",g:"1.°",w:2,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 1",f:"Los precios de los productos permiten leer, comparar y escribir números de una, dos, tres y cuatro cifras en una situación cotidiana, y justificar las decisiones.",o:["Leer y comparar números de distinta cantidad de cifras","Justificar por qué un número es mayor o menor","Escribir números de dos, tres y cuatro cifras"],ac:["Con una suma de dinero dada, elegir qué producto se puede comprar","Con folletos de precios, elegir los productos más baratos y explicar cómo se dieron cuenta","Comparar números con igual y con distinta cantidad de cifras","Usar la banda numérica como apoyo para comparar","Leer y escribir números redondos (dieces, cienes y miles)","Debate coordinado por el docente sobre las estrategias usadas"],r:"Folletos de supermercados y almacenes, billetes de juguete, banda numérica",e:"Compara precios, justifica con argumentos, lee y escribe números",p:"Cartel de precios del almacén del aula"},
{id:"l26",t:"El pic-nic y el calendario de cumpleaños",a:"Matemática",g:"1.°",w:2,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 1",f:"Organizar un pic-nic plantea problemas de agregar y sacar cantidades, y el calendario permite explorar la serie numérica hasta 31 y leer y escribir fechas, uniendo Matemática con la vida del grupo.",o:["Resolver problemas de suma y resta con números hasta 10","Explorar la serie numérica y sus regularidades hasta 31","Ubicar y escribir fechas en el calendario"],ac:["Problematizar qué se necesita para el pic-nic (platos, vasos, frutas) y cuánto de cada cosa","Resolver problemas en los que se agrega o se saca una cantidad, usando conteo","Armar el calendario del mes y encontrar regularidades","Anotar los cumpleaños de cada chico y aprender a escribir fechas","Ubicar fechas en almanaques y calendarios"],r:"Calendario, tarjetas, material para contar, hojas para el registro",e:"Resuelve problemas con conteo, lee y escribe números hasta 31, ubica fechas",p:"Calendario de cumpleaños del grado"},
{id:"l27",t:"Organizamos una kermés: sumas y restas hasta 20",a:"Matemática",g:"1.°",w:3,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 2",f:"Preparar una kermés para juntar fondos para la escuela plantea problemas reales de juntar y sacar cantidades. Permite que los chicos empiecen a representar con símbolos las sumas y las restas que ya resuelven contando, y a memorizar un repertorio de cálculos.",o:["Resolver problemas de juntar cantidades menores o iguales a 20 con estrategias de conteo","Leer y escribir números del 1 al 20, incluido el 0","Usar los conceptos de siguiente y anterior","Representar con símbolos las sumas y las restas sencillas"],ac:["Organizar la kermés: cuántos platos, vasos, cucharas y tenedores hacen falta","Problemas de composición con enunciados verbales (juntar cantidades)","Juego de cartones del 1 al 20: decir el siguiente o el anterior del número sacado","Escribir en el cuaderno el cálculo que representa lo que se resolvió (a + b = c)","Cantar la serie numérica y completar la que falta","Sumas de números de una cifra para empezar a memorizar resultados","Juego del bingo para leer números"],r:"Cartones numerados, material de conteo, vasos y platos de juguete o reales, cuaderno",e:"Resuelve problemas de juntar, lee y escribe números hasta 20, comunica sus cálculos",p:"Mini kermés del aula"},
{id:"l28",t:"Bingo, rifas y la banda numérica hasta 100",a:"Matemática",g:"1.°",w:4,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 2",f:"Las rifas y el bingo de la kermés sirven para que los chicos frecuenten los números del 1 al 100, descubran sus regularidades y aprendan a leerlos y escribirlos. La banda numérica ayuda a ver los nudos de los dieces y los números intermedios.",o:["Leer y escribir los números del 1 al 100","Reconocer los nudos de los dieces y sus siguientes","Detectar regularidades en las series de los treinti, cuarenti y ochenti"],ac:["Jugar al bingo para reconocer y leer números","Ordenar tarjetas con los nudos de los dieces","Completar 10 huecos de una grilla del 1 al 100 usando las regularidades","Pintar las series de números terminados en 4 y los siguientes","Armar una banda numérica hasta 100 con cartones: unos con los nudos y otros en blanco para completar","Preparar rifas y numerarlas, y juntarlas al final de la kermés","Armar rompecabezas con la grilla del 1 al 100"],r:"Cartones de bingo, tarjetas, grilla del 1 al 100, marcadores, papel para las rifas",e:"Lee y escribe números hasta 100, completa grillas usando regularidades",p:"Banda numérica hasta 100 y bingo del grado"},
{id:"l29",t:"El armario del aula: contar y agrupar de a diez",a:"Matemática",g:"1.°",w:3,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 3",f:"Ordenar los materiales del armario obliga a contar cantidades grandes. Cuando la cantidad es muy grande, aparece la necesidad de agrupar y se introduce el valor posicional.",o:["Contar cantidades grandes agrupándolas de a 10","Comprender el valor posicional (dieces y unidades sueltas)","Resolver problemas de comparación y de composición con estas cantidades"],ac:["Contar cuántos hay de cada material del armario y anotarlo","Agrupar de a 10 y contar los grupos más las unidades sueltas","Juego de compra de baldosas y análisis de regularidades en los resultados según las cantidades","Contar las figuritas de cada animal y comparar cantidades","Verificar los resultados con la calculadora","Estimar primero cuántos creen que hay y comprobar después"],r:"Materiales del armario (lápices, tizas, tapitas), cajas, baldosas de juguete, figuritas, calculadora",e:"Cuenta y agrupa de a 10, explica cuántos dieces y cuántas unidades hay, compara cantidades",p:"Inventario ilustrado de los materiales del aula"},
{id:"l30",t:"La oca, las cartas y la heladería: cálculo mental y problemas",a:"Matemática",g:"1.°",w:4,src:"Todos pueden aprender: Matemática en 1.° (Asociación Civil Educación para Todos y Ministerio de Cultura y Educación de Formosa, 2012), Secuencia 3",f:"Los juegos con saltos hacia adelante y hacia atrás, las cartas y las compras en una heladería permiten a los chicos practicar cálculo mental, sumar y restar dieces, resolver problemas de varios sumandos e iniciarse en la calculadora.",o:["Sumar y restar números terminados igual y dieces, con sus inversas","Resolver problemas de suma y resta con avances, retrocesos y transformaciones","Iniciarse en la estimación y en el uso de la calculadora"],ac:["Juego de la oca con saltos hacia adelante y hacia atrás y análisis de las regularidades","Juego de cartas preparadas con nudos y dieces","Completar el enunciado de un problema a partir de un cálculo dado","Elaborar preguntas a partir de dibujos o fotografías","Problemas de heladería: comprar varios helados y averiguar cuánto se gasta","Explorar el teclado de la calculadora y verificar resultados","Preparar una fiesta de fin de año resolviendo problemas de cantidades"],r:"Tablero de la oca, dados, cartas, calculadora, precios de heladería",e:"Cálculo mental con sumas y restas, resolución de problemas, uso de la calculadora",p:"Juego de la oca del grado"}
];
const DC={"Primer Ciclo":{e:[
{n:"Comprensión y producción oral",g:{"1.°":["Participar en conversaciones sobre experiencias personales y lo leído, ajustándose al contenido y al propósito (pedir aclaraciones, narrar, describir, pedir).","Escuchar con comprensión narraciones, descripciones y consignas leídas por el docente u otros adultos.","Renarrar relatos de tradición oral y de autores locales, regionales, nacionales y universales.","Participar en situaciones comunicativas cotidianas (saludos, familia, escuela) y en enseñanza explícita de palabras y expresiones de uso cotidiano."],"2.°":["Conversar sobre experiencias personales y lo leído, y para acordar tareas en equipo (narrar, describir, pedir, opinar, justificar).","Escuchar con comprensión textos leídos o expresados oralmente por el docente.","Renarrar con distintos propósitos relatos de tradición oral y de autores locales, regionales y nacionales."],"3.°":["Conversar para planificar tareas, ampliar, refutar o aportar, con nuevas justificaciones a lo dicho por otro.","Escuchar con comprensión narraciones, descripciones e instrucciones (por ejemplo, consignas de tarea escolar).","Renarrar con distintos propósitos textos de tradición oral y de autores locales, regionales, nacionales y universales."]}},
{n:"Lectura",g:{"1.°":["Explorar con asiduidad materiales escritos en la biblioteca áulica, escolar y popular y en ferias del libro.","Leer y disfrutar cuentos, fábulas, leyendas, poesías, coplas y adivinanzas.","Leer palabras, oraciones y fragmentos de textos con abundantes ilustraciones (títulos de textos).","Comprender textos no literarios (notas de enciclopedia) leídos por el docente."],"2.°":["Explorar materiales escritos en bibliotecas y ferias del libro.","Participar en lectura compartida de cuentos, fábulas, leyendas, poesías, coplas y adivinanzas.","Leer y comprender textos no literarios (descubrimientos, historias de vida, notas de enciclopedia).","Comprender textos instruccionales accesibles (recetas, instrucciones, consignas escolares)."],"3.°":["Explorar materiales escritos y localizar lecturas usando los índices de los libros.","Leer con frecuencia, en silencio o en voz alta, cuentos, fábulas, leyendas, poesías, coplas y adivinanzas.","Leer textos no literarios (descripciones, historias de vida, enciclopedia) y comprender textos explicativos con el docente.","Comprender textos instruccionales accesibles."]}},
{n:"Escritura",g:{"1.°":["Escribir textos con fuerte colaboración del docente, planificando lo que se desea comunicar (experiencias, descripciones, recetas, instrucciones, cuentos, rimas, coplas, adivinanzas).","Releer borradores y participar en revisiones colectivas.","Escribir palabras y oraciones que conforman textos: afiches, epígrafes, mensajes, invitaciones, respuestas, adivinanzas."],"2.°":["Escribir con frecuencia, de forma autónoma o conjunta, planificando destinatarios y propósito (incluye mensajes de texto, email, cartas y esquelas).","Participar en la revisión individual y grupal para detectar inadecuaciones y proponer modificaciones.","Escribir de forma autónoma palabras y oraciones respetando convenciones ortográficas y de puntuación."],"3.°":["Escribir con frecuencia y autonomía narraciones con descripciones y diálogos, cartas, mensajes, agenda personal, poemas, notas de enciclopedia y textos instructivos.","Atender pautas de organización textual, ortografía y puntuación (punto y mayúscula, margen, títulos).","Revisar los propios escritos: suprimir, agregar, sustituir, recolocar y desplazar, con orientación del docente."]}},
{n:"Reflexión sobre la lengua y los textos",g:{"1.°":[],"2.°":["Reconocer la red semántica de los textos leídos y escuchados.","Formar familias de palabras con ayuda del docente.","Usar signos de puntuación: punto y mayúscula, coma en enumeración, interrogación y exclamación.","Aplicar convenciones ortográficas (bl, mp, que/qui, gue/gui)."],"3.°":["Reconocer la red semántica de los textos, incluidas sinonimia y antonimia.","Formar familias de palabras; reconocer sustantivos comunes y propios, adjetivos y verbos de acción.","Usar signos de puntuación y aplicar convenciones ortográficas (mb, nr) y reglas sin excepciones.","Identificar la sílaba tónica de las palabras."]}}]},
"Segundo Ciclo":{e:[
{n:"Comprensión y producción oral",g:{"4.°":["Participar en conversaciones sobre temas de estudio, interés general y lo leído (narrar, describir, pedir, opinar, preguntar y responder).","Escuchar con comprensión narraciones, descripciones, instrucciones seriadas y reglas de juego.","Comprender exposiciones orales identificando tema, subtemas, ejemplos y comparaciones."],"5.°":["Conversar sobre temas de estudio justificando opiniones, ejemplificando y solicitando aclaraciones.","Participar en entrevistas para profundizar un tema de estudio."],"6.°":["Conversar sobre temas de estudio con ejemplos y explicaciones, recuperando al final la información más relevante.","Participar en entrevistas tomando notas y, si es posible, grabándolas.","Exponer oralmente ordenando la información y administrando subtemas y tiempo, con vocabulario específico."]}},
{n:"Lectura y producción escrita",g:{"4.°":["Leer con frecuencia con distintos objetivos (informarse, averiguar un dato, compartir lo leído, confrontar datos, goce estético) en diversos portadores y circuitos.","Usar estrategias de lectura según el tipo de texto: consultar el paratexto, relacionar datos con conocimientos previos, realizar inferencias, detectar información relevante.","Escribir textos no ficcionales con propósito comunicativo, planificando, redactando borradores y corrigiendo."],"5.°":["Leer con distintos objetivos y estrategias ajustadas al tipo de texto; deducir el significado de palabras desconocidas por pistas del texto, familias de palabras y uso del diccionario.","Reconocer procedimientos propios del texto leído (ejemplos, definiciones y comparaciones en el expositivo; secuencia en el narrativo; partes y características en el descriptivo; sucesión del proceso en el instructivo).","Monitorear la propia comprensión con la guía del docente y leer en voz alta con fluidez.","Buscar información en bibliotecas usando índice y paratexto.","Escribir textos no ficcionales con planificación, borradores y revisión: narraciones, descripciones, exposiciones y cartas personales."],"6.°":["Leer con distintos objetivos y estrategias; deducir significados con pistas del texto y el diccionario.","Reconocer procedimientos propios del texto leído y recuperar la información relevante.","Buscar información con criterios básicos de clasificación y fichas bibliográficas.","Escribir con propósito específico consultando material bibliográfico, tomando notas jerarquizadas e identificando las fuentes.","Escribir narraciones, descripciones, exposiciones de más de tres párrafos y cartas formales, integrando cuadros, esquemas y organizadores gráficos."]}},
{n:"Literatura",g:{"4.°":["Comprender y disfrutar obras de tradición oral (relatos, cuentos, fábulas, leyendas, coplas, rondas) y de autor (novela breve, cuentos, poesías, canciones, teatro, títeres).","Producir textos orales y escritos: relatos ficcionales, versiones distintas de narraciones leídas y textos de invención que juegan con palabras y sonidos."],"5.°":["Comprender y disfrutar obras de tradición oral (incluidos romances) y de autor, atendiendo a los indicios del texto y a las características del género.","Producir relatos y versiones nuevas, modificando la línea argumental, los personajes, el tiempo o el espacio."],"6.°":["Comprender y disfrutar obras de tradición oral (incluidos mitos, parábolas y romances) y de autor, vinculándolas con otros textos del mismo autor, género o temática y con adaptaciones en otros códigos (historietas, cine).","Producir relatos y versiones nuevas, y textos de invención que juegan con palabras y sonidos."]}},
{n:"Reflexión sobre la lengua y los textos",g:{"4.°":["Reconocer las lenguas y variedades lingüísticas que se hablan en la comunidad.","Identificar, con ayuda del docente, el párrafo, la oración con estructura interna, y sustantivos, adjetivos y verbos (género, número, tiempo); sustantivos comunes y propios; verbos de acción y conectores temporales y causales.","Usar familias de palabras (sufijación y prefijación), sinónimos, antónimos e hiperónimos para ampliar el vocabulario.","Conocer la ortografía de uso, las reglas generales de acentuación (separar sílabas, identificar la sílaba tónica) y algunos signos de puntuación."],"5.°":["Reconocer las lenguas y variedades presentes en la comunidad, la literatura y los medios de comunicación.","Reconocer sujeto expreso y tácito y su uso como recurso de estilo.","Aplicar procedimientos de reformulación oracional (eliminación, expansión, desplazamiento, reemplazo) para lograr cohesión.","Reconocer los tiempos verbales de la narración y la estructura de las definiciones."],"6.°":["Reconocer las lenguas y variedades presentes en la comunidad, la literatura y los medios.","Distinguir oración bimembre y unimembre; sujeto expreso y tácito.","Aplicar procedimientos de reformulación oracional y reconocer variaciones morfológicas (género, número, tiempo, modo indicativo e imperativo, persona).","Reconocer tiempos verbales de la narración (incluido el pretérito pluscuamperfecto), conectores y pronombres personales como elementos de cohesión."]}}]}};
const CAL={"Formación Ética y Ciudadana":{"1.°":{"p":[["Marzo",["Reflexión ética: participación en reflexiones sobre situaciones conflictivas de la vida escolar o cotidiana, reales o factibles (fotografías, relatos, historietas), para construir nociones como justicia, solidaridad, libertad y responsabilidad."]],["Abril",["Reflexión ética: ejercicio del diálogo como instrumento para resolver conflictos y construir acuerdos en el ámbito familiar y en el aula."]],["Mayo",["Reflexión ética: exploración y reconocimiento de diferentes modos de resolución de conflictos en la familia y en el aula.","Identidades: indagación y observación de la realidad cercana, con énfasis en los roles de los integrantes de la familia, respetando la diversidad de conformaciones familiares que existen en la actualidad."]],["Junio",["Identidades: reconocimiento de las diferencias personales y respeto de las mismas en la interacción con los otros, para promover la aceptación y el respeto hacia la diversidad."]],["Julio",["Identidades: conocimiento de la existencia de símbolos (Bandera Nacional, Escarapela, cantos patrios) y de festividades y celebraciones de ámbitos cercanos (Día del Maestro, del Amigo, del Niño, del Animal, entre otras), resaltando sentimientos de pertenencia social y cultural."]],["Agosto",["Identidades: registro, mediante escritura mediatizada o autónoma, de fechas conmemorativas, de hechos de la experiencia vivida u observada y de las vivencias compartidas en la escuela, en articulación con Lengua y Ciencias Sociales."]],["Septiembre",["Ciudadanía, derechos y participación: iniciación en la diferenciación de acciones personales que facilitan la convivencia en diferentes contextos (relatos de experiencia de los niños; escucha atenta de relatos ficcionales)."]],["Octubre",["Ciudadanía, derechos y participación: escritura de murales, afiches u otros dispositivos con listas de acuerdos asumidos por el grupo, con mediación del docente y de manera autónoma.","Iniciación en el conocimiento de las normas y señales de tránsito básicas para la circulación del peatón."]],["Noviembre",["Ciudadanía, derechos y participación: trabajo sistemático de normas de convivencia que promuevan relaciones saludables entre pares (escuchar, tratarse con cortesía, evitar la violencia física y los sobrenombres peyorativos).","Iniciación en el conocimiento de los derechos del niño a partir de experiencias áulicas y extraáulicas."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Primer Ciclo 2026 (1.°). Cada mes muestra el saber propuesto; diciembre es repaso. Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."},"2.°":{"p":[["Marzo",["Reflexión ética: participación en reflexiones sobre situaciones conflictivas de la vida escolar y social, reales o factibles, para construir nociones como justicia, solidaridad, libertad y responsabilidad."]],["Abril",["Reflexión ética: ejercicio del diálogo como instrumento para resolver conflictos y lograr acuerdos en el ámbito familiar y escolar."]],["Mayo",["Reflexión ética: exploración y reconocimiento de diferentes modos de resolución de conflictos en el contexto familiar y escolar.","Identidades: reconocimiento de semejanzas y diferencias en los principios que rigen su accionar en las relaciones interpersonales."]],["Junio",["Identidades: diferenciación de símbolos que expresan experiencias históricas compartidas e identidades propias y de otros (Bandera, Escudo, Himno Nacional y Provincial), en articulación con Educación Artística (Música y Artes Visuales), Lengua y Sociales."]],["Julio",["Identidades: producción escrita de carteleras y murales; descripción de símbolos; análisis de manifestaciones culturales y de los sentidos y valores de conmemoraciones relevantes para la provincia, en articulación con Lengua y Ciencias Sociales."]],["Agosto",["Ciudadanía, derechos y participación: reconocimiento y reflexión acerca de acciones personales y grupales que facilitan la convivencia (escuchar, solidarizarse, establecer acuerdos, respetar pautas de participación), a partir de crónicas, relatos ficcionales, películas o series."]],["Septiembre",["Ciudadanía, derechos y participación: iniciación en la valoración progresiva de las normas y de la participación en su elaboración, para organizar el trabajo, el juego y otras actividades escolares."]],["Octubre",["Ciudadanía, derechos y participación: conocimiento de las normas y señales de tránsito básicas para la circulación segura como peatones y como usuarios de medios de transporte."]],["Noviembre",["Ciudadanía, derechos y participación: identificación y diferenciación de situaciones cotidianas donde se manifiesta la vigencia de los derechos del niño y de otras donde no se los respeta."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Primer Ciclo 2026 (2.°). Cada mes muestra el saber propuesto; diciembre es repaso. Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."},"3.°":{"p":[["Marzo",["Reflexión ética: análisis y reflexión acerca de los conceptos de libertad, paz, solidaridad, igualdad, justicia, responsabilidad y respeto a la diversidad, en contraste con situaciones de injusticia, desigualdad o violencia, a partir de vivencias personales y de textos periodísticos, películas y mensajes de las TIC (videojuegos, series, dibujos animados)."]],["Abril",["Reflexión ética: reflexión acerca de contenidos violentos y estereotipos discriminatorios en los mensajes.","Construcción y escritura de normas de convivencia y acuerdos como pautas orientadoras de las acciones y decisiones."]],["Mayo",["Reflexión ética: ejercicio del diálogo como modo de conocimiento subjetivo e intersubjetivo para caracterizar e identificar conflictos en la vida personal y en la relación con otros, en el ámbito escolar y extraescolar."]],["Junio",["Reflexión ética: conocimiento y comparación de diferentes modos de resolver conflictos en el contexto familiar, escolar y extraescolar.","Identidades: respeto, valoración y comparación de las diferencias personales, atendiendo a la diversidad de identidades y proyectos de vida que coexisten en contextos escolares y extraescolares."]],["Julio",["Identidades: indagación y observación de la realidad cercana (roles de los miembros de la comunidad escolar), con reflexión en las asociaciones, comisiones y clubes (Cooperadora, Asociación de padres, Clubes de niños cuidadores del medio ambiente, entre otros)."]],["Agosto",["Identidades: reconocimiento y comparación de símbolos que expresan experiencias históricas compartidas e identidades grupales propias y de otros.","Análisis, interpretación y comparación de los sentidos y valores implícitos en conmemoraciones relevantes para la nación y la humanidad, en articulación con Lengua y Ciencias Sociales."]],["Septiembre",["Identidades: manifestación y exteriorización de emociones y sentimientos en el marco del respeto y su valoración con diferentes propósitos: darles visibilidad, consolidar el conocimiento de sí mismos y de los otros, promover la escucha atenta, el intercambio y la reflexión acerca del reconocimiento y del respeto sobre lo que otros manifiestan, piensan y sienten, para integrar la diversidad y favorecer la convivencia armónica a través del diálogo y la reflexión."]],["Octubre",["Ciudadanía, derechos y participación: reconocimiento y análisis de las normas de convivencia en la escuela y de las consecuencias de su cumplimiento o incumplimiento."]],["Noviembre",["Ciudadanía, derechos y participación: conocimiento y comprensión de la importancia del respeto por las normas y señales de tránsito para la circulación segura en la vía pública, diferenciando actitudes prudentes e imprudentes.","Reconocimiento y valoración de los Derechos Humanos y los Derechos del Niño, su cumplimiento y vulneración en diferentes contextos."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Primer Ciclo 2026 (3.°). Cada mes muestra el saber propuesto; diciembre es repaso. Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."},"4.°":{"p":[["Marzo",["Reflexión ética: participación en reflexiones sobre situaciones conflictivas de la vida escolar y cotidianas, reales o factibles (relatos, cuentos, leyendas, historietas), para construir y problematizar nociones como justicia, solidaridad, libertad y responsabilidad, considerando la diversidad de opiniones y puntos de vista."]],["Abril",["Reflexión ética: identificación de conflictos en situaciones vividas en el contexto escolar y otros ámbitos públicos, distinguiendo deberes, valores, intereses y sentimientos, y reconociendo posibles formas de resolución."]],["Mayo",["Reflexión ética: ejercicio del diálogo argumentativo y su progresiva valoración como herramienta para la construcción de acuerdos y la resolución de conflictos."]],["Junio",["Reflexión ética: reconocimiento de los efectos que produce la acción humana, a través de relatos con problemas reales o posibles, historias de vida y personajes públicos del contexto local (deportistas, músicos, escultores, teatreros, pintores), identificando valores, estereotipos y formas de vida."]],["Julio",["Identidades: conocimiento de sí mismo y de los otros a partir de la expresión y comunicación de sentimientos, ideas, valoraciones y la escucha respetuosa.","Reconocimiento de las diversas formas de familias y sus vinculaciones en diferentes escenarios sociales, y de la importancia del respeto de esas diferencias."]],["Agosto",["Identidades: reconocimiento, respeto y valoración de las expresiones culturales, cosmovisiones y sistemas valorativos de los pueblos originarios de la provincia de Formosa."]],["Septiembre",["Identidades: comprensión de la construcción histórica de los símbolos y conmemoraciones que expresan identidades y valores grupales (Escudo y Bandera Nacional y Provincial, canciones patrias)."]],["Octubre",["Ciudadanía, derechos y participación: reconocimiento de las características básicas de la vida en democracia.","Valoración de la vida en democracia a partir de ejemplos de la vida cotidiana (ejercicio de reclamo y otras formas de protesta)."]],["Noviembre",["Ciudadanía, derechos y participación: aproximación al conocimiento del sistema político institucional (forma republicana de gobierno, representación democrática en el nivel local).","Comprensión crítica de normas y criterios de tránsito para la circulación autónoma y segura por la vía pública como peatones y usuarios de medios de transporte."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Segundo Ciclo 2026 (4.°). Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."},"5.°":{"p":[["Marzo",["Reflexión ética: participación en reflexiones sobre situaciones conflictivas de la vida escolar y cotidianas, reales o factibles (textos ficcionales y periodísticos en papel y digital), para construir y problematizar nociones como justicia, solidaridad, libertad y responsabilidad."]],["Abril",["Reflexión ética: identificación de conflictos (entre deberes, valores e intereses) en los textos trabajados y en el contexto escolar; reflexión sobre posibles formas de resolución mediante el ejercicio del diálogo argumentativo como recurso para construir acuerdos."]],["Mayo",["Identidades: reconocimiento, respeto y valoración de la diversidad de identidades personales y proyectos de vida a partir de encuentros con actores sociales jóvenes y adultos."]],["Junio",["Identidades: reconocimiento, respeto y valoración de las expresiones culturales, cosmovisiones y sistemas valorativos de los pueblos originarios de las regiones de la Argentina.","Reconocimiento, análisis y sensibilización ante formas de prejuicio, maltrato o discriminación en situaciones reales, distinguiendo su dimensión socio-histórica a través de la indagación y el establecimiento de relaciones a partir de producciones orales y escritas."]],["Julio",["Identidades: reconocimiento, problematización y respeto acerca de diferentes dimensiones de la sexualidad, relativos al cuidado personal y de otros, el amor, el placer y la responsabilidad."]],["Agosto",["Identidades: comprensión de la construcción histórica de los símbolos y conmemoraciones que expresan identidades y valores grupales (Escudo y Bandera Nacional y Provincial).","Creación de símbolos que representan al grupo y análisis del sentido y la resignificación de los símbolos."]],["Septiembre",["Identidades: reconocimiento y participación de las perspectivas de género en la construcción de identidades a través de la historia y en la actualidad, tomando conciencia de las miradas estereotipadas y reflexionando sobre situaciones de igualdad o de falta de equidad de trato y de oportunidades."]],["Octubre",["Ciudadanía, derechos y participación: valoración de la vida en democracia, que permita comparar la relación entre democracia e igualdad ante la ley a partir de ejemplos del contexto cotidiano y su posterior comparación a escala nacional e internacional.","Elaboración de proyectos grupales con incidencia institucional que impliquen prácticas democráticas (participación, búsqueda de consenso en la toma de decisiones colectivas, votación)."]],["Noviembre",["Ciudadanía, derechos y participación: elaboración de proyectos grupales con incidencia institucional (periódico escolar, buzones con propuestas de los niños para mejorar la convivencia, jornadas de integración con actividades recreativas) que favorezcan el protagonismo de los niños y las niñas.","Aproximación al conocimiento de derechos, deberes y garantías constitucionales."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Segundo Ciclo 2026 (5.°). Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."},"6.°":{"p":[["Marzo",["Reflexión ética: identificación de conflictos (entre deberes, valores e intereses) en los textos trabajados y en el contexto escolar y extraescolar; reflexión sobre formas de resolución mediante el diálogo argumentativo, la apertura a puntos de vista diversos y la explicitación de desacuerdos."]],["Abril",["Reflexión ética: reconocimiento de los efectos que produce la acción humana a través de relatos con problemas reales o posibles, historias de vida y personajes de la historia, científicos y pensadores; distinción de motivaciones, fines y medios que orientan la conducta humana; comparación de situaciones donde primen relaciones de injusticia, desigualdad o violencia con otras donde estén vigentes la justicia, la igualdad y la paz."]],["Mayo",["Reflexión ética: análisis crítico de los discursos que circulan en los medios de comunicación, redes sociales, videojuegos, publicidades, series y dibujos animados, para identificar valores vigentes, concepciones de la felicidad, relaciones de poder, contenidos violentos y estereotipos."]],["Junio",["Identidades: puesta en juego en espacios de confianza y libertad, organizados en colaboración con el docente, mediante cuentos, relatos, películas y otros recursos."]],["Julio",["Identidades: reconocimiento de que nuestros modos de sentir y pensar se modifican a partir de diferentes situaciones, relaciones y contextos."]],["Agosto",["Identidades: reconocimiento, respeto y valoración de la diversidad de identidades personales y proyectos de vida, individuales o colectivos, que coexisten en diferentes contextos sociales, históricos y culturales, a partir de entrevistas con actores sociales jóvenes y adultos."]],["Septiembre",["Ciudadanía, derechos y participación: conocimiento de derechos, deberes y garantías constitucionales desde la práctica cotidiana y la importancia de su respeto (análisis de casos argentinos y latinoamericanos).","Conocimiento y comprensión de casos contextualizados de vulneración de derechos en la historia reciente a través de testimonios orales y visuales; tipificación de los crímenes de lesa humanidad en el caso argentino y analogías con casos internacionales (genocidios u otros)."]],["Octubre",["Ciudadanía, derechos y participación: aproximación a las normas y criterios de tránsito para la circulación autónoma y segura por la vía pública como conductores de vehículos (por ejemplo, bicicletas y otros rodados)."]],["Noviembre",["Ciudadanía, derechos y participación: identificación y concientización del grado de responsabilidad y de los factores que influyen en la problemática del tránsito, a través del análisis de situaciones del ámbito cercano y lejano."]],["Diciembre",["Repaso."]]],"extra":["Ejes del año",["En relación con la reflexión ética; con la construcción histórica de las identidades; con la ciudadanía, los derechos y la participación."]],"nota":"Fuente: Calendarización de saberes de Formación Ética y Ciudadana, Segundo Ciclo 2026 (6.°). Es la calendarización 2026 de la Delegación; está agrupada por mes, tal como figura en el original."}},"Educación Artística":{"1.°":{p:[["Marzo, abril y mayo",["Música, identidad y cultura: participación en audiciones de obras musicales locales (directas o mediante TIC); valoración inicial del patrimonio musical de Formosa.","Canciones patrias."]],["Junio, julio y agosto",["Música, elementos del lenguaje musical: participación en audiciones de obras musicales locales (directas o mediante TIC); valoración inicial del patrimonio musical de Formosa."]],["Septiembre, octubre y noviembre",["Música, práctica del lenguaje musical: ejecución de ritmos sencillos con percusión corporal; exploración vocal (susurros, glissandos)."]]],extra:["Ejes del año",["Música. Ejes del año: construcción de la identidad y la cultura; elementos del lenguaje musical; práctica del lenguaje musical."]],nota:"Fuente: Calendarización de saberes de Música, 1.° grado. Falta sumar los otros lenguajes de Educación Artística (artes visuales, artes del movimiento y teatro)."},
"2.°":{p:[["Marzo, abril y mayo",["Música, identidad y cultura: experimentación con audiciones en vivo de artistas formoseños; identificación de la música en los medios masivos y las TIC.","Canciones patrias."]],["Junio, julio y agosto",["Música, elementos del lenguaje musical: reconocimiento de estructuras musicales simples; diferenciación de texturas monódicas y polifónicas."]],["Septiembre, octubre y noviembre",["Música, práctica del lenguaje musical: interpretación de canciones con acompañamiento armónico; uso de instrumentos no convencionales con fines expresivos."]]],extra:["Ejes del año",["Música. Ejes del año: construcción de la identidad y la cultura; elementos del lenguaje musical; práctica del lenguaje musical."]],nota:"Fuente: Calendarización de saberes de Música, 2.° grado. Falta sumar los otros lenguajes de Educación Artística (artes visuales, artes del movimiento y teatro)."},
"3.°":{p:[["Marzo, abril y mayo",["Música, identidad y cultura: reconocimiento de ámbitos de espectáculos musicales (festivales, salas); construcción de opiniones propias sobre obras musicales.","Canciones patrias."]],["Junio, julio y agosto",["Música, elementos del lenguaje musical: representación gráfica de elementos musicales mediante analogías; organización de sonidos en series de sucesión y simultaneidad."]],["Septiembre, octubre y noviembre",["Música, práctica del lenguaje musical: improvisación de motivos rítmicos y melódicos; participación en proyectos grupales con roles diferenciados."]]],extra:["Ejes del año",["Música. Ejes del año: construcción de la identidad y la cultura; elementos del lenguaje musical; práctica del lenguaje musical."]],nota:"Fuente: Calendarización de saberes de Música, 3.° grado. Falta sumar los otros lenguajes de Educación Artística (artes visuales, artes del movimiento y teatro)."},
"4.°":{p:[["Marzo, abril y mayo",["Música, contextualización sociocultural: reconocimiento de músicas de pueblos originarios (wichí, qom y pilagá); identificación de instrumentos y danzas típicas de Formosa.","Música, práctica: improvisación de composiciones con métrica binaria o ternaria.","Canciones patrias."]],["Junio, julio y agosto",["Música, contextualización sociocultural: identificación de instrumentos y danzas típicas de Formosa.","Música, práctica: ejecución de repertorio vocal con variaciones de tempo."]],["Septiembre, octubre y noviembre",["Música, contextualización sociocultural: identificación de instrumentos y danzas típicas de Formosa.","Música, práctica: ejecución de repertorio vocal con variaciones de tempo."]]],extra:["Ejes del año",["Música. Ejes del año: contextualización sociocultural; prácticas del lenguaje musical."]],more:[["Artes Visuales · Marzo y abril",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; relación entre imágenes, contextos culturales (barrio, entorno urbano y rural, provincia, país, región) y circuitos de circulación (museos, clubes, teatros, plazas, calles, televisión, cine, revistas, Internet)."]],["Artes Visuales · Mayo y junio",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Organización en la composición: forma figurativa y no figurativa; espacios llenos y vacíos; relaciones entre figura y fondo; posición y dirección de las figuras en el campo; relaciones de tamaño.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; relación entre imágenes, contextos culturales (barrio, entorno urbano y rural, provincia, país, región) y circuitos de circulación (museos, clubes, teatros, plazas, calles, televisión, cine, revistas, Internet)."]],["Artes Visuales · Julio y agosto",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Organización en la composición: forma figurativa y no figurativa; espacios llenos y vacíos; relaciones entre figura y fondo; posición y dirección de las figuras en el campo; relaciones de tamaño.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; relación entre imágenes, contextos culturales (barrio, entorno urbano y rural, provincia, país, región) y circuitos de circulación (museos, clubes, teatros, plazas, calles, televisión, cine, revistas, Internet).","Frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros)."]],["Artes Visuales · Septiembre y octubre",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Organización en la composición: forma figurativa y no figurativa; espacios llenos y vacíos; relaciones entre figura y fondo; posición y dirección de las figuras en el campo; relaciones de tamaño.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; relación entre imágenes, contextos culturales (barrio, entorno urbano y rural, provincia, país, región) y circuitos de circulación (museos, clubes, teatros, plazas, calles, televisión, cine, revistas, Internet).","Frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros)."]],["Artes Visuales · Noviembre y diciembre",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Organización en la composición: forma figurativa y no figurativa; espacios llenos y vacíos; relaciones entre figura y fondo; posición y dirección de las figuras en el campo; relaciones de tamaño.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; relación entre imágenes, contextos culturales (barrio, entorno urbano y rural, provincia, país, región) y circuitos de circulación (museos, clubes, teatros, plazas, calles, televisión, cine, revistas, Internet).","Frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros)."]],["Artes del Movimiento (Danza) · todo el año",["Contextualización sociocultural: interpretación de danzas folklóricas argentinas (zamba, chacarera); reconocimiento de coreografías en festivales locales.","Práctica de la danza: experimentación con equilibrio, giros y saltos; creación de secuencias con objetos (pañuelos, sogas)."]]],nota:"Fuente: Calendarizaciones de saberes de Música, Artes Visuales y Artes del Movimiento (Danza), 4.° grado. Falta sumar Teatro. En Artes Visuales y Danza el documento repite los saberes por período; aquí se resumen."},
"5.°":{p:[["Marzo, abril y mayo",["Música, contextualización sociocultural: análisis de estilos musicales (tango, folklore) y su contexto histórico; reflexión sobre la música en los medios masivos; géneros y estilos.","Canciones patrias."]],["Junio, julio y agosto",["Música, contextualización sociocultural: reflexión sobre la música en los medios masivos.","Música, práctica: creación de arreglos musicales con herramientas digitales."]],["Septiembre, octubre y noviembre",["Música, contextualización sociocultural: reflexión sobre la música en los medios masivos.","Música, práctica: uso de técnicas vocales e instrumentales en proceso de afianzamiento."]]],extra:["Ejes del año",["Música. Ejes del año: contextualización sociocultural; prácticas del lenguaje musical."]],more:[["Artes Visuales · Marzo y abril",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; conocimiento y valoración de las producciones artísticas que integran el patrimonio cultural local, provincial, nacional y latinoamericano."]],["Artes Visuales · Mayo y junio",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; conocimiento y valoración de las producciones artísticas que integran el patrimonio cultural local, provinc
