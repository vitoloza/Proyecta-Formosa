contextos históricos y sociales, advirtiendo la relación entre las formas artísticas y los modos de percibir y representar según las coordenadas témporo-espaciales."]],["Artes Visuales · Noviembre y diciembre",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Generación de sensación de profundidad en la bidimensión mediante indicadores espaciales (imbricación, luz y sombra, textura, horizontalidad, repetición, relaciones de tamaño), por fuera del sistema de la perspectiva clásica.","Eje contextualización de la imagen visual: la imagen como proceso situado en un contexto cultural; conocimiento y valoración de las producciones artísticas que integran el patrimonio cultural local, provincial, nacional y latinoamericano.","Análisis de obras visuales de variados contextos históricos y sociales, advirtiendo la relación entre las formas artísticas y los modos de percibir y representar según las coordenadas témporo-espaciales."]],["Artes del Movimiento (Danza) · todo el año",["Contextualización sociocultural: análisis de estereotipos corporales en medios masivos; vinculación de danzas con corrientes migratorias.","Práctica de la danza: recreación de bailes cotidianos desde una perspectiva coreográfica; uso de diseños espaciales complejos en producciones grupales."]]],nota:"Fuente: Calendarizaciones de saberes de Música, Artes Visuales y Artes del Movimiento (Danza), 5.° grado. Falta sumar Teatro. En Artes Visuales y Danza el documento repite los saberes por período; aquí se resumen."},
"6.°":{p:[["Marzo, abril y mayo",["Música, contextualización sociocultural: crítica al consumo musical dirigido por las industrias culturales; reconocimiento de combinaciones entre estilos musicales actuales.","Canciones patrias."]],["Junio, julio y agosto",["Música, práctica: producción colectiva de obras con roles diferenciados."]],["Septiembre, octubre y noviembre",["Música, práctica: interpretación de piezas con acompañamiento en vivo o grabado."]]],extra:["Ejes del año",["Música. Ejes del año: contextualización sociocultural; prácticas del lenguaje musical."]],more:[["Artes Visuales · Marzo y abril",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Conocimiento, utilización y conceptualización con sentido estético de la línea en el espacio bidimensional y tridimensional."]],["Artes Visuales · Mayo y junio",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Conocimiento, utilización y conceptualización con sentido estético de la línea en el espacio bidimensional y tridimensional."]],["Artes Visuales · Julio y agosto",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Conocimiento, utilización y conceptualización con sentido estético de la línea en el espacio bidimensional y tridimensional.","Textura visual y táctil, regular y orgánica; las tramas; distinción entre texturas propias de la materia, del soporte y de la manera.","Eje contextualización de la imagen visual: frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros). Comprensión del entorno natural y artificial/cultural como espacio susceptible de ser interpretado estéticamente o intervenido."]],["Artes Visuales · Septiembre y octubre",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Conocimiento, utilización y conceptualización con sentido estético de la línea en el espacio bidimensional y tridimensional.","Textura visual y táctil, regular y orgánica; las tramas; distinción entre texturas propias de la materia, del soporte y de la manera.","Eje contextualización de la imagen visual: frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros). Comprensión del entorno natural y artificial/cultural como espacio susceptible de ser interpretado estéticamente o intervenido."]],["Artes Visuales · Noviembre y diciembre",["Eje práctica del lenguaje visual: realización de producciones visuales (pinturas, dibujos, impresos, objetos, instalaciones, construcciones) a partir del conocimiento de elementos, materiales, soportes, técnicas y procedimientos; elección de materiales y soportes en el plano y en el volumen, convencionales y no convencionales, y de herramientas.","Conocimiento, utilización y conceptualización con sentido estético de la línea en el espacio bidimensional y tridimensional.","Textura visual y táctil, regular y orgánica; las tramas; distinción entre texturas propias de la materia, del soporte y de la manera.","Eje contextualización de la imagen visual: frecuentación de encuentros, muestras y espectáculos dentro y fuera de la escuela y contacto con artistas de diversas especialidades de las artes visuales (plateros, fotógrafos, ceramistas, pintores, tejedores, escultores, ilustradores, entre otros). Comprensión del entorno natural y artificial/cultural como espacio susceptible de ser interpretado estéticamente o intervenido."]],["Artes del Movimiento (Danza) · todo el año",["Contextualización sociocultural: reflexión sobre danza y patrimonio cultural universal; participación en proyectos que integren danza y nuevas tecnologías.","Práctica de la danza: elaboración de coreografías con elementos técnicos (tiempo, energía); integración de canon y unísono en montajes colectivos."]]],nota:"Fuente: Calendarizaciones de saberes de Música, Artes Visuales y Artes del Movimiento (Danza), 6.° grado. Falta sumar Teatro. En Artes Visuales y Danza el documento repite los saberes por período; aquí se resumen."}},
"Educación Tecnológica":{"1.°":{p:[["Marzo y abril",["Procesos: explorar maneras de dar forma a los materiales para elaborar productos artesanales (modelado, estampado, embutido, corte).","Medios técnicos: analizar y reproducir tareas de base manual y reconocer la necesidad de medios técnicos que ayuden a realizarlas.","Tecnología y sociedad: reconocer distintos modos de hacer las cosas en distintas épocas, oficios y relatos."]],["Mayo y junio",["Procesos: transformar materiales extraídos de la naturaleza (separar, batir, exprimir, moler, prensar; harinas, jugos, aserrín).","Medios técnicos: describir con gestos y palabras cómo se hace una tarea sin herramientas y con ellas.","Tecnología y sociedad: un mismo proceso con tecnologías diferentes (hacer pan en casa, en la panadería o en la fábrica; comunicarse por carta, teléfono o internet)."]],["Julio y agosto",["Procesos: posibilidades y limitaciones de los materiales (doblar, romper, deformar, mezclar, filtrar, mojar, secar).","Medios técnicos: uso adecuado de una variedad de medios técnicos sobre distintos materiales.","Tecnología y sociedad: identificar problemas que se originan en el uso de ciertas tecnologías."]],["Septiembre y octubre",["Procesos: observar procesos destinados a elaborar productos e identificar las operaciones técnicas y su orden.","Medios técnicos: describir las herramientas con textos orales, escritos y dibujos."]],["Noviembre y diciembre",["Procesos: características de los lugares donde se realizan los procesos y relación entre la ubicación de los recursos y la secuencia de operaciones.","Medios técnicos: relacionar las partes de las herramientas (forma y materiales) con las tareas que realizan."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 1.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."},
"2.°":{p:[["Marzo y abril",["Procesos: construir estructuras por encastrado, unión, anudado o apilado; diferenciar conformación de un material y ensamblado de partes.","Medios técnicos: explorar y reproducir tareas de base manual; las herramientas prolongan o modifican las posibilidades del cuerpo.","Tecnología y sociedad: cambios que se producen en un oficio en distintas épocas."]],["Mayo y junio",["Procesos: problemas para obtener muchos productos iguales mediante reproducción de formas.","Medios técnicos: describir y comparar tareas sin herramientas y con herramientas que copian y prolongan el cuerpo.","Tecnología y sociedad: nuevas actividades, oficios y profesiones del lugar donde viven."]],["Julio y agosto",["Procesos: relación entre las características de los materiales y las operaciones para fabricar objetos del entorno.","Medios técnicos: usar medios para tomar, sujetar, contener, fijar o mover materiales y para modificarlos.","Tecnología y sociedad: un mismo proceso con tecnologías diferentes según los intereses."]],["Septiembre y octubre",["Procesos: observar procesos para elaborar muchos productos iguales e identificar operaciones y orden.","Medios técnicos: diferenciar las zonas de las herramientas (con el cuerpo, sobre el material y de unión); asignar nombres según forma o función.","Tecnología y sociedad: familias de herramientas de un mismo medio sociocultural."]],["Noviembre y diciembre",["Procesos: lugares y espacios donde se realizan los procesos y secuencia de operaciones.","Medios técnicos: cambios en la forma o el material de las partes de la herramienta según el material o la escala de la tarea."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 2.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."},
"3.°":{p:[["Marzo y abril",["Procesos: operaciones de transporte y almacenamiento de materiales, productos y personas.","Medios técnicos: reproducir una operación con diversas herramientas y reconocer las que simplifican el trabajo.","Tecnología y sociedad: cada nueva manera de hacer cosas se apoya en las anteriores (qué cambia y qué se conserva)."]],["Mayo y junio",["Procesos: alternativas para elevar, transportar y almacenar cargas según el material, la trayectoria y la superficie.","Medios técnicos: tareas con medios que transforman los gestos (girar una manivela, usar un pelapapas).","Tecnología y sociedad: cada nueva tecnología abre nuevos oficios y puede desplazar a otra."]],["Julio y agosto",["Procesos: elaborar productos eligiendo materiales y modos de hacer; diferenciar insumos, operaciones y medios técnicos.","Medios técnicos: medios para tomar, sujetar, mover, modificar, producir formas y medir.","Tecnología y sociedad: convivimos con tecnologías que se transformaron y otras que no."]],["Septiembre y octubre",["Procesos: comparar secuencias de operaciones para elaborar distintos productos (pan y ladrillos).","Medios técnicos: similitudes y diferencias entre partes de herramientas que realizan tareas semejantes (coladores, cedazos, pinceles y rodillos).","Tecnología y sociedad: familias de herramientas de un mismo medio sociocultural."]],["Noviembre y diciembre",["Procesos: alternativas para organizar la secuencia de operaciones (en paralelo o en sucesión) y los espacios.","Medios técnicos: partes de herramientas con uniones móviles y tipo de movimiento (entra y sale, sube y baja, gira, abre y cierra)."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 3.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."},
"4.°":{p:[["Marzo y abril",["Procesos: dar forma a materiales duros, deformables y flexibles con técnicas semejantes según sus propiedades.","Medios técnicos: comparar actividades con herramientas simples y con mecanismos (batidor o rallador manual y con manivela); observar gestos técnicos, esfuerzo, tiempo y seguridad.","Tecnología y sociedad: importancia del dominio de los materiales en las culturas tradicionales y en la actualidad."]],["Mayo y junio",["Procesos: explorar propiedades mecánicas de los materiales (dureza, plasticidad, flexibilidad) y cómo cambiar su resistencia.","Medios técnicos: describir con gestos, palabras y dibujos las acciones al manejar herramientas (girar una manivela, subir una palanca, tirar de una soga).","Tecnología y sociedad: implicancias de la innovación de materiales en objetos de uso cotidiano."]],["Julio y agosto",["Procesos: analizar procesos de fabricación de varios pasos sucesivos y los medios técnicos empleados.","Medios técnicos: diferenciar acciones de ejecución (empujar, tirar, apretar) y de control (regular la fuerza, mantener la dirección).","Tecnología y sociedad: cambios sociotécnicos por el uso de herramientas complejas en la vida cotidiana y el trabajo."]],["Septiembre y octubre",["Procesos: construir artefactos sencillos anticipando y ordenando las operaciones.","Medios técnicos: analizar artefactos y sus partes (las que los accionan, los mecanismos que transmiten el movimiento y las que actúan sobre insumos).","Tecnología y sociedad: criterios de selección de materiales en distintas sociedades o culturas."]],["Noviembre y diciembre",["Procesos: experiencias grupales organizando tareas y asignando roles.","Medios técnicos: relación entre la forma y el tamaño de los mecanismos y la transformación del movimiento (velocidad, fuerza, sentido).","Tecnología y sociedad: un mismo proceso con tecnologías diferentes según el contexto (producir en la casa, el campo o la fábrica)."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 4.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."},
"5.°":{p:[["Marzo y abril",["Procesos: operaciones de recolección, transporte y distribución (provisión de agua, recolección de residuos, correo, transporte de granos).","Medios técnicos: comparar el uso de herramientas con máquinas accionadas por energía (animales, combustibles, agua, aire, electricidad).","Tecnología y sociedad: implicancias de los cambios sociotécnicos en la vida cotidiana y en el trabajo."]],["Mayo y junio",["Procesos: la energía para calentar, enfriar, batir o mezclar (molienda, forja).","Medios técnicos: tareas manuales con medios técnicos de control (guías, topes, plantillas, moldes) y con control sensorial.","Tecnología y sociedad: el paso del uso de herramientas al uso de máquinas."]],["Julio y agosto",["Procesos: relaciones de dependencia entre operaciones (sucesivas y simultáneas) en la fabricación por ensamble.","Medios técnicos: analizar máquinas e identificar las partes que producen el movimiento (motores), lo transmiten (mecanismos) y actúan sobre el medio (efectores).","Tecnología y sociedad: cambios en los modos de producción cuando se fabrica en grandes volúmenes."]],["Septiembre y octubre",["Procesos: relación entre la secuencia de operaciones y su distribución espacial en la manufactura.","Medios técnicos: artefactos con partes fijas y móviles y dispositivos para limitar el movimiento (frenos, trabas, topes, guías).","Tecnología y sociedad: coexistencia de tecnologías diferentes (máquinas y herramientas) con resultados equivalentes."]],["Noviembre y diciembre",["Procesos: experiencias grupales al pasar de elaborar productos unitarios a muchos productos iguales.","Medios técnicos: relación de los mecanismos (bielas, manivelas, cigüeñales, levas) con la transformación del movimiento.","Tecnología y sociedad: maneras de recoger, guardar y transportar materiales (agua, alimentos, madera, minerales) en distintos contextos."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 5.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."},
"6.°":{p:[["Marzo y abril",["Procesos: animales, ruedas hidráulicas o eólicas (molinos) y motores cumplen la función de motorizar las máquinas transformando un recurso energético.","Medios técnicos: acciones al usar artefactos eléctricos hogareños con control manual (encendido, apagado, variación de velocidad, dirección o temperatura).","Tecnología y sociedad: el paso del control manual al control mediante instrumentos."]],["Mayo y junio",["Procesos: formas de aprovechar la energía en distintas épocas y contextos históricos.","Medios técnicos: comparar con artefactos que producen cambios sin intervención directa de las personas (se apagan solos).","Tecnología y sociedad: continuidades y cambios en el transporte de energía y de materiales (agua, gas, mercaderías)."]],["Julio y agosto",["Procesos: analizar procesos sobre materiales o energía e identificar el rol de las operaciones de control (cómo, cuánto, cuándo).","Medios técnicos: artefactos con movimientos programados mediante levas o tarjetas perforadas.","Tecnología y sociedad: características y usos de las tecnologías de la comunicación y la información a lo largo del tiempo."]],["Septiembre y octubre",["Procesos: relaciones de dependencia entre operaciones y su impacto en la duración de los procesos.","Medios técnicos: analizar problemas de diseño (especificaciones, restricciones, variables); planificar y construir artefactos o sistemas de circulación de flujo.","Tecnología y sociedad: formas de uso de la energía en distintos contextos y sus implicancias sociales y culturales."]],["Noviembre y diciembre",["Procesos: planificar y simular líneas de producción decidiendo la distribución de máquinas y recursos.","Medios técnicos: comunicar ideas técnicas con dibujos y bocetos y compararlos con los modelos terminados.","Tecnología y sociedad: coexistencia de distintas formas de controlar un proceso en la vida cotidiana y en el trabajo."]]],extra:["Ejes del año",["En relación con los procesos tecnológicos; con los medios técnicos; con la tecnología como proceso sociocultural (diversidad, cambios y continuidad)."]],nota:"Fuente: Calendarización de Educación Tecnológica, 6.° grado. Es la calendarización de 2025 (los saberes están seleccionados del Diseño Curricular y el documento aclara que incluye solo algunos y está abierto a cambios); se toma como referencia para 2026."}},
"Educación Física":{"1.°":{p:[["Marzo, abril y mayo",["Cuerpo: identificar las partes del cuerpo mediante situaciones lúdicas; experimentar las posibilidades de movimiento de los segmentos (subir, bajar, acercar, separar, girar, doblar, estirar); reconocer el espacio corporal personal.","Interacción: juegos cooperativos cuidando de sí mismo, de los otros y del ambiente; reconocer al otro como compañero de juego; reflexionar sobre los conflictos y aceptar los resultados; acordar reglas que favorezcan la participación y la inclusión.","Ambiente natural: respetar a los seres vivos de los espacios naturales y conocer los riesgos que pueden presentar."]],["Junio, julio y agosto",["Cuerpo: nociones de ubicación, direccionalidad, lateralidad, velocidad y trayectoria; adentro-fuera, delante-detrás, arriba-abajo; agrupación y dispersión; fuerza, resistencia, flexibilidad y velocidad.","Interacción: juegos en parejas y en pequeños grupos, de bando y reglados; roles y actitudes básicas; jornadas recreativas de juegos sociomotores.","Ambiente natural: experiencias grupales de convivencia acordando normas de interacción y seguridad."]],["Septiembre, octubre y noviembre",["Cuerpo: contrastes rítmico-temporales (rápido, lento, antes, después, más largo, más corto); capacidades condicionales.","Interacción: la noción de regla de juego; jornadas recreativas; juegos tradicionales de la cultura propia y de otras culturas de la región.","Ambiente natural: exploración y disfrute del ambiente natural con actitudes de cuidado."]]],extra:["Ejes del año",["En relación con las prácticas corporales y ludomotrices (conocimiento, expresión, dominio y cuidado del cuerpo); en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 1.° grado, año 2026."},
"2.°":{p:[["Marzo, abril y mayo",["Cuerpo: características y funcionalidad de las articulaciones; prácticas motrices con ambos lados; pautas de higiene personal y normas de seguridad.","Interacción: estrategias básicas del juego (cooperación y oposición); acuerdos de reglas que favorezcan la participación y la inclusión; el otro como compañero necesario para jugar.","Ambiente natural: respeto a los seres vivos de los espacios naturales y sus riesgos; normas de seguridad personal."]],["Junio, julio y agosto",["Cuerpo: lateralidad y uso del lado dominante en habilidades motrices básicas; confianza y perseverancia ante situaciones problemáticas; habilidades locomotrices, no locomotrices y manipulativas.","Interacción: distintos roles en los juegos; juegos cooperativos; resolución compartida de conflictos cotidianos y de los producidos en el juego.","Ambiente natural: convivencia grupal acordando normas básicas de interacción y seguridad."]],["Septiembre, octubre y noviembre",["Cuerpo: derecha e izquierda en desplazamientos y habilidades; nociones espacio-temporales; capacidades condicionales (fuerza, resistencia, flexibilidad y velocidad).","Interacción: juegos tradicionales de la cultura propia y de otras culturas; jornadas recreativas de juegos sociomotores.","Ambiente natural: acciones simples que contribuyan a la preservación del medio natural."]]],extra:["Ejes del año",["En relación con las prácticas corporales y ludomotrices (conocimiento, expresión, dominio y cuidado del cuerpo); en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 2.° grado, año 2026."},
"3.°":{p:[["Marzo, abril y mayo",["Cuerpo: características y funcionalidad de las articulaciones; higiene personal y seguridad; uso del lado más hábil y del menos hábil.","Interacción: juegos cooperativos y de oposición con sentido solidario e inclusivo; estrategias básicas del juego; reglas que favorezcan la participación y la inclusión.","Ambiente natural: respeto a los seres vivos de los espacios naturales y sus riesgos; seguridad personal."]],["Junio, julio y agosto",["Cuerpo: nociones espacio-tiempo en habilidades motrices; ajustes a la trayectoria de un objeto (interceptación, recepción, esquive); confianza en sí mismo; derecha e izquierda en habilidades motrices.","Interacción: distintos roles y funciones; resolución participativa de situaciones conflictivas; juegos sociomotores cooperativos.","Ambiente natural: experiencias grupales de convivencia."]],["Septiembre, octubre y noviembre",["Cuerpo: acciones expresivas y comunicativas; capacidades condicionales y coordinativas; habilidades motrices básicas locomotrices, no locomotrices y manipulativas.","Interacción: práctica y valoración de juegos tradicionales; jornadas recreativas de juegos sociomotores.","Ambiente natural: convivencia acordando normas de interacción y seguridad."]]],extra:["Ejes del año",["En relación con las prácticas corporales y ludomotrices (conocimiento, expresión, dominio y cuidado del cuerpo); en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 3.° grado, año 2026."},
"4.°":{p:[["Marzo, abril y mayo",["Disponibilidad de sí mismo: principales grupos musculares, huesos y articulaciones; aspectos saludables de las prácticas corporales; espacios, zonas y límites del juego.","Interacción: juegos de cooperación, de oposición y atléticos; estructura lógica de los juegos (finalidad, reglas, estrategias, roles, funciones, espacios y tiempos); la regla de juego.","Ambiente natural: normas básicas de interacción, higiene y seguridad."]],["Junio, julio y agosto",["Disponibilidad de sí mismo: confianza y perseverancia ante situaciones motrices problemáticas; situarse respecto de un objeto o de los demás; esquivar obstáculos.","Interacción: uso cooperativo de las habilidades motrices básicas y combinadas; reconocer al oponente como compañero de juego.","Ambiente natural: desplazamientos grupales (caminatas, recorridos, bicicleteadas)."]],["Septiembre, octubre y noviembre",["Disponibilidad de sí mismo: capacidades condicionales (fuerza, resistencia, flexibilidad y velocidad); habilidades motrices combinadas y específicas.","Interacción: prácticas de integración en juegos colectivos, tradicionales, autóctonos y de otras culturas; uso del tiempo libre como actividad recreativa.","Ambiente natural: experiencias de convivencia en un ambiente natural o poco habitual (paseos, excursiones, campamento educativo)."]]],extra:["Ejes del año",["En relación con las prácticas corporales, motrices y ludomotrices referidas a la disponibilidad de sí mismo; en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 4.° grado, año 2026."},
"5.°":{p:[["Marzo, abril y mayo",["Disponibilidad de sí mismo: tensión y relajación de los segmentos del cuerpo; aspectos saludables; izquierda y derecha propias y de los demás; respeto de las posibilidades y limitaciones propias y de los compañeros.","Interacción: juegos de cooperación y de oposición, atléticos y deportivos modificados; estructura lógica de los juegos; análisis, modificación y acuerdo de reglas; elaboración de estrategias.","Ambiente natural: desplazamientos grupales con formas de orientación adecuadas al terreno."]],["Junio, julio y agosto",["Disponibilidad de sí mismo: análisis crítico de los modelos y prácticas corporales de los medios de comunicación y del entorno sociocultural; lado hábil; derecha e izquierda en habilidades combinadas.","Interacción: situaciones del campo de juego; habilidades motrices combinadas y específicas; encuentros con finalidad educativa.","Ambiente natural: técnicas campamentiles, juegos recreativos, de búsqueda y de orientación."]],["Septiembre, octubre y noviembre",["Disponibilidad de sí mismo: espacios libres en función del juego; posibilidades expresivas y comunicativas; capacidades condicionales (fuerza rápida, resistencia aeróbica, flexibilidad, velocidad cíclica y acíclica); equilibrio estático y dinámico.","Interacción: juegos colectivos, tradicionales, autóctonos y de otras culturas; uso del tiempo libre.","Ambiente natural: organización de experiencias de convivencia en un ambiente natural (paseos, excursiones, campamento educativo)."]]],extra:["Ejes del año",["En relación con las prácticas corporales, motrices y ludomotrices referidas a la disponibilidad de sí mismo; en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 5.° grado, año 2026."},
"6.°":{p:[["Marzo, abril y mayo",["Disponibilidad de sí mismo: percepción del propio cuerpo; cambios del organismo antes, durante y después del esfuerzo; modos saludables de realizar prácticas corporales; incidencia de la alimentación, el sueño, el descanso y la actividad física en la salud.","Interacción: juegos de cooperación y de oposición, atléticos, deportivos modificados y minideporte escolar; estructura lógica de los juegos; reglas y estrategias.","Ambiente natural: normas de interacción, higiene y seguridad; desplazamientos grupales con instrumentos de orientación."]],["Junio, julio y agosto",["Disponibilidad de sí mismo: análisis crítico de los modelos corporales de los medios; esquivar obstáculos; espacios libres; equilibrio estático y dinámico en situaciones complejas; habilidades combinadas y específicas.","Interacción: prácticas de integración en juegos, minideporte y encuentros, y participación en su organización con finalidad recreativa.","Ambiente natural: experiencias de convivencia en un ambiente natural; valoración del ambiente y conciencia crítica sobre el cuidado del medio natural."]],["Septiembre, octubre y noviembre",["Disponibilidad de sí mismo: acciones expresivas y comunicativas; prácticas para mejorar la fuerza rápida, la resistencia aeróbica, la flexibilidad y la velocidad; habilidades en juegos deportivos.","Interacción: juegos colectivos, tradicionales, autóctonos y de otras culturas; uso del tiempo libre.","Ambiente natural: creación de actividades ludomotrices (técnicas campamentiles, juegos recreativos, de búsqueda y de orientación)."]]],extra:["Ejes del año",["En relación con las prácticas corporales, motrices y ludomotrices referidas a la disponibilidad de sí mismo; en interacción con otros; en el ambiente natural y otros."]],nota:"Fuente: Calendarización de saberes de Educación Física, 6.° grado, año 2026."}},
"Ciencias Sociales":{
"4.°":{p:[["Marzo",["Espacios geográficos: localización y representación cartográfica de Formosa en el contexto nacional; división política de la República Argentina.","Recursos naturales de Formosa y modos de aprovechamiento y conservación; principales problemas ambientales a escala local y provincial y cómo afectan a la población."]],["Abril",["Espacios geográficos: áreas naturales protegidas como patrimonio de Formosa y su relación con el turismo.","Espacios rurales de la provincia: recursos naturales, actividades económicas, actores sociales y condiciones de vida y de trabajo; regiones y anillos productivos."]],["Mayo",["Espacios geográficos: distribución de la población de Formosa en relación con los recursos naturales y las actividades productivas; paisajes urbanos y rurales a escala local y regional.","Espacios urbanos de Formosa: usos del suelo, actividades económicas, tecnología aplicada y actores sociales.","Lectura y construcción de croquis y mapas con simbología convencional y escala cromática; escritura de textos continuos y discontinuos para comunicar lo aprendido."]],["Junio",["Sociedades a través del tiempo: sistema de organización colonial (espacial, política, productiva y comercial); intereses de los actores sociales en el período colonial, con énfasis en Formosa y la región.","Hechos y procesos previos a la provincialización de Formosa y motivaciones de su fundación; bienes patrimoniales materiales y simbólicos de la provincia."]],["Julio",["Sociedades a través del tiempo: impacto de la dominación europea sobre los pueblos originarios del actual territorio de Formosa, en sus sistemas de organización y de creencias."]],["Agosto",["Sociedades a través del tiempo: formas de relación con la naturaleza de las sociedades cazadoras, recolectoras y agricultoras (se sugiere profundizar un pueblo originario de Formosa y uno de otra región para compararlos).","Formas de autoridad, distribución de bienes y sistemas de creencias anteriores a la llegada de los españoles; motivaciones de los europeos desde el siglo XV para conquistar América."]],["Septiembre",["Sociedades a través del tiempo: nociones temporales; huellas materiales del pasado en el presente en Formosa; búsqueda y registro de información en fuentes primarias y secundarias; escritura y revisión de textos."]],["Octubre",["Actividades humanas y organización social: organización política de Formosa y niveles político-administrativos (departamento, municipio, comisión de fomento, junta vecinal); división de poderes en la provincia, funciones y atribuciones.","Relación entre las instituciones sociales y políticas locales, provinciales y nacionales; conflictos entre grupos sociales y modos de resolverlos en una sociedad democrática; factores que originan un acceso desigual a los bienes."]],["Noviembre",["Actividades humanas y organización social: costumbres, creencias, valores y tradiciones de la propia comunidad y de otras, para favorecer el respeto; planificación y revisión de textos."]]],extra:["Ejes del año",["En relación con las sociedades y los espacios geográficos; con las sociedades a través del tiempo; con las actividades humanas y la organización social."]],nota:"Fuente: Calendarización de saberes de Ciencias Sociales, Segundo Ciclo, 4.° grado, año 2026. Según el documento, es un modelo para llevar a la práctica y se enriquece con el cuadernillo de Ciencias Sociales para el Segundo Ciclo, El género de la Patria y los libros de la biblioteca."},
"5.°":{p:[["Marzo",["Espacios geográficos: organización y delimitación política del territorio argentino (municipio, provincia y país); representación cartográfica del país en el contexto latinoamericano; importancia socioeconómica de los recursos naturales de la Argentina, desde Formosa.","Organización social: división de poderes en el sistema político argentino, funciones y atribuciones."]],["Abril",["Espacios geográficos: problemas ambientales a escala nacional y cómo afectan a la población y a la economía; áreas naturales y culturales protegidas como patrimonio y su relación con el turismo, desde Formosa.","Organización social: carácter republicano y federal de la Argentina."]],["Mayo",["Espacios geográficos: espacios rurales de la Argentina (aspecto socioeconómico); circuitos productivos agroindustriales, forestal e hidrocarburífero; modos de satisfacer necesidades sociales (trabajo, salud, educación, vivienda).","Organización social: derechos y obligaciones del ciudadano; nuevas formas de organización social y política en una sociedad democrática."]],["Junio",["Espacios geográficos: paisajes urbanos y rurales a escala nacional; espacios urbanos de la Argentina y sus funciones; representación cartográfica del espacio nacional.","Organización social: Convención Internacional de los Derechos del Niño y del Adolescente y su vigencia en la Argentina."]],["Julio",["Espacios geográficos: lectura y construcción de mapas de distintos tipos y escalas con simbología convencional y escala cromática; escritura de textos.","Organización social: factores que originan un acceso desigual a los bienes materiales, simbólicos y culturales en la Argentina."]],["Agosto",["Sociedades a través del tiempo: ruptura del sistema colonial en América y los conflictos derivados, con énfasis en la Revolución de Mayo de 1810; impacto de las guerras de la independencia en la vida cotidiana; intereses de los actores sociales entre 1810 y 1853.","Organización social: organizaciones sociales y estatales que promueven la solidaridad, la convivencia y la ayuda mutua (centros culturales, mutuales, cooperativas)."]],["Septiembre",["Sociedades a través del tiempo: formas de producir y comerciar de los grupos sociales en la sociedad criolla entre 1820 y 1850; confrontaciones por distintos proyectos de país y su impacto en las realidades regionales.","Hechos y procesos previos a la provincialización de Formosa (colonización, territorialización y conformación del Estado provincial)."]],["Octubre",["Sociedades a través del tiempo: nociones temporales, unidades cronológicas y periodizaciones; huellas materiales del pasado en el presente; búsqueda de información en fuentes primarias y secundarias; bienes patrimoniales; escritura de textos."]],["Diciembre",["Repaso."]]],extra:["Ejes del año",["En relación con las sociedades y los espacios geográficos; con las sociedades a través del tiempo; con las actividades humanas y la organización social."]],nota:"Fuente: Calendarización de saberes de Ciencias Sociales, Segundo Ciclo, 5.° grado, año 2026. Según el documento, es un modelo para llevar a la práctica y se enriquece con el cuadernillo de Ciencias Sociales para el Segundo Ciclo, El género de la Patria y los libros de la biblioteca. La asignación de algunos contenidos a su mes se interpretó de un cuadro con texto superpuesto; conviene revisarla con la docente del grado."},
"6.°":{p:[["Marzo",["Espacios geográficos: mapa político de América Latina; procesos de integración regional (MERCOSUR, UNASUR y PARLASUR); localización y representación cartográfica del país en el contexto latinoamericano y mundial."]],["Abril",["Espacios geográficos: áreas naturales y culturales protegidas en Latinoamérica y su relación con el turismo; problemas ambientales latinoamericanos; composición y dinámica demográfica de la población argentina."]],["Mayo",["Espacios geográficos: indicadores demográficos; paisajes urbanos y rurales latinoamericanos (aspecto sociocultural); espacios urbanos de la Argentina y de Latinoamérica."]],["Junio",["Espacios geográficos: representación cartográfica del espacio latinoamericano y construcción de mapas con simbología convencional.","Sociedades a través del tiempo: conflictos y acuerdos que llevaron a la organización del Estado nacional argentino entre 1853 y 1880."]],["Julio",["Sociedades a través del tiempo: políticas de la segunda mitad del siglo XIX y comienzos del XX para una economía agraria de exportación (apropiación territorial, inmigración e importación de capitales), con su impacto local y regional."]],["Agosto",["Sociedades a través del tiempo: cambios sociales, políticos y demográficos entre 1860 y 1930, con énfasis en Formosa; producción agropecuaria, transporte, comunicaciones y urbanización del modelo agroexportador; intereses de los actores sociales; nociones temporales y periodizaciones."]],["Septiembre",["Sociedades a través del tiempo: huellas materiales del pasado en el presente; fuentes primarias y secundarias; bienes patrimoniales en la Argentina y Latinoamérica; escritura de textos."]],["Octubre",["Organización social: relaciones entre los niveles político-administrativos (nacional, provincial y municipal) y conflictos interjurisdiccionales; vínculos entre Estados nacionales (MERCOSUR, UNASUR y PARLASUR).","Modos de participación ciudadana y nuevas formas de organización social y política; manifestaciones culturales de sociedades latinoamericanas y respeto por la diversidad."]],["Noviembre",["Organización social: Constituciones Nacional y Provincial (estructura, principios, derechos y garantías) y su vigencia; derechos de las minorías; discriminación y vulneración de derechos y responsabilidad del Estado; Declaración Universal de los Derechos Humanos; escritura de textos."]],["Diciembre",["Repaso."]]],extra:["Ejes del año",["En relación con las sociedades y los espacios geográficos; con las sociedades a través del tiempo; con las actividades humanas y la organización social."]],nota:"Fuente: Calendarización de saberes de Ciencias Sociales, Segundo Ciclo, 6.° grado, año 2026. Según el documento, es un modelo para llevar a la práctica y se enriquece con el cuadernillo de Ciencias Sociales para el Segundo Ciclo, El género de la Patria y los libros de la biblioteca. La asignación de algunos contenidos a su mes se interpretó de un cuadro con texto superpuesto; conviene revisarla con la docente del grado."}},
"Ciencias Naturales":{
"4.°":{p:[["Marzo y abril",["Seres vivos: caracterización de los ambientes aeroterrestres cercanos de la provincia de Formosa, comparados con ambientes lejanos y de otras épocas; ambientes acuáticos y de transición; flora y fauna autóctona de Formosa.","Fenómenos del mundo físico: fenómenos causados por fuerzas que actúan a distancia; interpretación de la fuerza gravitatoria.","Materiales: materiales naturales y producidos por el hombre.","Tierra y Universo: la Tierra como cuerpo cósmico, su forma y su movimiento de rotación."]],["Mayo y junio",["Seres vivos: características que diferencian a plantas, animales, hongos y microorganismos; características climáticas y del suelo, y sus interacciones.","Fenómenos: propiedades de los materiales metálicos (brillo, ductilidad, maleabilidad, conductividad); materiales térmicos y eléctricos.","Materiales: características macroscópicas de los estados sólido, líquido y gaseoso.","Tierra y Universo: el movimiento aparente del Sol como consecuencia de la rotación del planeta y los horarios en distintos lugares."]],["Julio y agosto",["Seres vivos: identificación y clasificación de las principales adaptaciones morfo-fisiológicas (absorción, sostén y locomoción, cubiertas corporales, comportamiento social y reproducción).","Fenómenos: los metales como mejores conductores del calor y la electricidad que otros materiales.","Materiales: cambios de estado de los materiales y su relación con el calor.","Tierra y Universo: acercamiento a la noción de las dimensiones del planeta."]],["Septiembre y octubre",["Seres vivos: el hombre como ser vivo y sus funciones de sostén y locomoción; identificación y descripción de huesos, músculos y articulaciones.","Fenómenos: materiales conductores y aislantes de la corriente eléctrica; exploración de imanes y sus efectos sobre distintos materiales.","Materiales: cómo las propiedades condicionan el uso, considerando la conductividad del calor (conductores y aislantes).","Tierra y Universo: subsistemas terrestres (hidrósfera, atmósfera, geósfera y biósfera)."]],["Noviembre y diciembre",["Seres vivos: importancia del sistema osteo-artro-muscular humano y prevención de enfermedades; particularidades anátomo-fisiológicas de mujeres y varones.","Fenómenos: los polos magnéticos y el campo magnético de la Tierra.","Materiales: uso correcto del material de laboratorio.","Tierra y Universo: características principales de la geósfera."]]],extra:["Ejes del año",["En relación con los seres vivos; con los fenómenos del mundo físico; con los materiales y sus cambios; con la Tierra, el Universo y sus cambios."]],nota:"Fuente: Calendarización de Ciencias Naturales de 4.° grado, año 2026. Los saberes son una selección sugerida, extraída del Diseño Curricular jurisdiccional y sujeta a modificaciones, según indica el documento."},
"5.°":{p:[["Marzo y abril",["Seres vivos: ambientes acuáticos (oceánicos, lacustres y fluviales) y características adaptativas morfológicas de los organismos acuáticos.","Fenómenos: sonidos graves y agudos, fuertes y débiles, y las características de la fuente que los produce.","Materiales: diferentes tipos de mezclas, identificadas por homogeneidad y transparencia, y los métodos para separar sus componentes.","Tierra y Universo: aproximación al concepto de hidrósfera y sus relaciones con los otros subsistemas terrestres."]],["Mayo y junio",["Seres vivos: estructuras de sostén en plantas y animales acuáticos; flora y fauna acuática autóctona de Formosa.","Fenómenos: etapas por las cuales oímos (producción, propagación y recepción del sonido).","Materiales: experimentación con distintos materiales y comunicación de resultados en informes sencillos.","Tierra y Universo: principales fenómenos de la hidrósfera (corrientes y mareas)."]],["Julio y agosto",["Seres vivos: funciones de nutrición en el hombre (digestión, respiración, circulación y excreción); la nutrición como función común a todos los seres vivos.","Fenómenos: comportamiento de distintos cuerpos en caída libre; efecto del peso, la resistencia del aire y la rapidez de la caída.","Materiales: acción disolvente del agua y de otros líquidos y factores que influyen en la disolución.","Tierra y Universo: formas en que se presenta el agua (salada, dulce, sólida, líquida, vapor) y su ubicación (napas, lagos, ríos, glaciares)."]],["Septiembre y octubre",["Seres vivos: importancia de la alimentación para la salud según la composición de los alimentos y sus funciones; mejoramiento de la dieta atendiendo al contexto sociocultural.","Fenómenos: flotación de algunos cuerpos y elaboración de hipótesis explicativas.","Materiales: las soluciones como tipo de mezcla en la que no se distinguen los componentes ni a simple vista ni con el microscopio.","Tierra y Universo: recursos hídricos de la provincia de Formosa y el ciclo del agua."]],["Noviembre y diciembre",["Seres vivos: implicancias afectivas de los cambios en la infancia y la pubertad; valoración de los cambios en los sentimientos de mujeres y varones.","Fenómenos: la fuerza de empuje en la flotación y su variación según el fluido (densidad y volumen del cuerpo).","Materiales: comparación entre distintos tipos de soluciones según sus componentes (líquido en líquido, sólido en líquido, gas en líquido).","Tierra y Universo: importancia del agua potable para la salud."]]],extra:["Ejes del año",["En relación con los seres vivos; con los fenómenos del mundo físico; con los materiales y sus cambios; con la Tierra, el Universo y sus cambios."]],nota:"Fuente: Calendarización de Ciencias Naturales de 5.° grado, año 2026. Los saberes son una selección sugerida, extraída del Diseño Curricular jurisdiccional y sujeta a modificaciones, según indica el documento."},
"6.°":{p:[["Marzo y abril",["Seres vivos: relaciones entre los organismos representativos de cada comunidad; los seres vivos como sistemas abiertos y sus relaciones con el medio.","Fenómenos: noción de corriente eléctrica a través de circuitos eléctricos simples y su vinculación con las instalaciones domiciliarias.","Materiales: transformaciones de los materiales, en particular la combustión y la corrosión.","Tierra y Universo: aproximación al concepto de atmósfera."]],["Mayo y junio",["Seres vivos: relaciones entre organismos de la misma región que se alimentan de formas diferentes; cadenas y redes tróficas; modelos de nutrición en un ecosistema.","Fenómenos: reconocimiento de materiales conductores eléctricos.","Materiales: comparación de los materiales de partida con los productos de las transformaciones químicas.","Tierra y Universo: capas de la atmósfera (tropósfera, estratósfera, ionósfera y exósfera) y sus características."]],["Julio y agosto",["Seres vivos: noción de célula como unidad estructural y funcional; funciones de relación y reproducción del hombre.","Fenómenos: funcionamiento de aparatos eléctricos simples.","Materiales: la combustión como transformación química entre el oxígeno y un material combustible.","Tierra y Universo: cuidado de la atmósfera y contaminación atmosférica."]],["Septiembre y octubre",["Seres vivos: enfermedades relacionadas con los sistemas circulatorio, digestivo, respiratorio y urinario; sistema de defensa (barreras primarias, glóbulos blancos y anticuerpos).","Fenómenos: utilización de la energía en el ambiente familiar y en la comunidad para satisfacer necesidades concretas.","Materiales: vocabulario específico (comburente y combustible).","Tierra y Universo: fenómenos de la atmósfera como la lluvia, el viento, la nieve y los meteoros."]],["Noviembre y diciembre",["Seres vivos: procesos humanos de crecimiento, desarrollo y maduración; la procreación desde la dimensión biológica (reproducción humana, embarazo, parto, puerperio, maternidad y paternidad).","Fenómenos: producción de energía eléctrica a partir de paneles solares y su aplicación en procesos productivos y domésticos en la provincia.","Materiales: las transformaciones de los alimentos como transformación química.","Tierra y Universo: fenómenos naturales característicos de la región (sequías, desbordes y otros)."]]],extra:["Ejes del año",["En relación con los seres vivos; con los fenómenos del mundo físico; con los materiales y sus cambios; con la Tierra, el Universo y sus cambios."]],nota:"Fuente: Calendarización de Ciencias Naturales de 6.° grado, año 2026. Los saberes son una selección sugerida, extraída del Diseño Curricular jurisdiccional y sujeta a modificaciones, según indica el documento."}},
"Lengua":{"1.°":{p:[["Marzo",["Se inicia con la secuencia «El nombre» o con una propuesta de repaso.","Presentación oral personal (nombre, apellido, edad, domicilio, datos familiares) y participación en conversaciones.","Exploración asidua de materiales escritos y del ambiente alfabetizador del salón (calendario, horarios, agendas de lectura).","Escritura autónoma de palabras (nombres propios, días de la semana, meses, títulos, personajes) y de palabras de dos sílabas trabajadas, con letra legible."]],["Abril",["Presentación oral personal y conversaciones ajustadas al propósito.","Escucha atenta de consignas y de relatos simples con elementos repetidos; renarración de relatos de tradición oral y de autores locales, regionales, nacionales y universales.","Lectura de rastreo: título, autor, palabras y frases repetidas.","Escritura frecuente con fuerte ayuda del docente (experiencias, descripciones, recetas, instrucciones, cuentos, rimas, coplas, adivinanzas) y revisión de borradores."]],["Mayo",["Presentación oral y conversaciones.","Exploración del ambiente alfabetizador y reflexión sobre el uso de mayúsculas y la concordancia de género y número.","Lectura autónoma de palabras para reconocer los tipos de fonemas y convertir grafemas en fonemas; reconocer oraciones (separadas por el punto) y palabras (separadas por espacios).","Escritura autónoma de palabras y escritura al dictado de palabras y frases breves de textos trabajados."]],["Junio y julio",["Presentación oral y conversaciones.","Lectura de palabras de dos sílabas de uso cotidiano con correspondencia uno a uno entre sonido y letra (por ejemplo P, M, T, D).","Revisión colectiva de la escritura de palabras y frases: correspondencia entre sonidos y letras, cantidad, orden y dirección de las letras, y tipos de letra (mayúscula, minúscula, cursiva, imprenta)."]],["Agosto",["Presentación oral y conversaciones.","Lectura para reconocer oraciones y palabras.","Escritura frecuente con fuerte ayuda del docente y revisión de borradores."]],["Septiembre",["Lectura para reconocer oraciones separadas por el punto.","Escritura frecuente con ayuda del docente y escritura al dictado de palabras y frases breves."]],["Octubre",["Conversaciones y presentación oral.","Revisión colectiva de la escritura de palabras y frases.","Lectura para reconocer oraciones y palabras.","Escritura frecuente con ayuda del docente."]],["Noviembre y diciembre",["Mes de repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Coplas, adivinanzas, poesías (rimas), cuentos tradicionales, fábulas, leyendas e instructivo (receta)."]],nota:"Fuente: Calendarización de saberes de Primer Ciclo, área Lengua, 1.° grado. Bibliografía sugerida en el documento: El Pollo Goyo 1 (Kapelusz, 2024) y A la Plaza 1 (Logseller, 2022)."},
"2.°":{p:[["Marzo",["Repaso del año anterior."]],["Abril",["Presentación oral personal; conversaciones para planificar tareas y opinar sobre lecturas compartidas.","Lectura de rastreo: título, autor, palabras y frases repetidas y vocabulario.","Reflexión: red semántica de los textos (palabras que nombran y que califican)."]],["Mayo",["Conversaciones sobre experiencias, lo leído y para acordar tareas (pedir aclaraciones, narrar, describir, opinar, justificar).","Exploración del ambiente alfabetizador; mayúsculas, concordancia y familias de palabras.","Lectura de rastreo."]],["Junio",["Conversaciones y renarración de textos de tradición oral y de autores locales, regionales, nacionales y universales.","Lectura autónoma de palabras que forman textos (epígrafes, respuestas, descripciones breves).","Escritura frecuente con ayuda: invitaciones, cartas, registros de observación y otros; revisión de borradores.","Puntuación (punto y mayúscula, coma en enumeración, interrogación y exclamación) y ortografía (bl, mp, que/qui, gue/gui)."]],["Julio",["Conversaciones.","Lectura asidua de textos literarios (cuentos, fábulas, leyendas, poesías, coplas, adivinanzas) y no literarios (recetas, instrucciones, consignas, notas de enciclopedia).","Escritura al dictado de oraciones simples de al menos cinco palabras, con letra legible, mayúscula inicial y punto final.","Puntuación y ortografía."]],["Agosto",["Presentación oral; exploración del ambiente alfabetizador; lectura de rastreo.","Escritura frecuente (invitaciones, cartas, registros) y escritura autónoma de palabras y oraciones que forman textos (epígrafes, mensajes, invitaciones, respuestas).","Puntuación y ortografía."]],["Septiembre",["Escucha de consignas y relatos simples; renarración de textos literarios de tradición oral y de autor.","Lectura autónoma de palabras que forman textos.","Escritura al dictado de oraciones simples.","Reflexión: red semántica y familias de palabras."]],["Octubre",["Renarración con diversos propósitos.","Lectura asidua de textos literarios y no literarios.","Revisión colectiva de la escritura de palabras, frases y textos.","Puntuación, ortografía, red semántica y familias de palabras."]],["Noviembre y diciembre",["Mes de repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Coplas, poesías (rimas), cuentos, fábulas, leyendas, instructivo y notas enciclopédicas."]],nota:"Fuente: Calendarización de saberes de Primer Ciclo, área Lengua, 2.° grado. Bibliografía sugerida en el documento: El Pollo Goyo 2 (Kapelusz, 2024) y A la Plaza 2 (Logseller, 2022)."},
"3.°":{p:[["Marzo",["Repaso del año anterior."]],["Abril",["Presentación oral completa (datos personales, domicilio, localidad, familia).","Conversaciones para acordar tareas: pedir aclaraciones, narrar, describir, opinar, justificar, complementar, ampliar y refutar.","Exploración de la biblioteca áulica y de ferias del libro; uso de índices.","Escritura frecuente y autónoma: narraciones, descripciones, recetas, instrucciones, cuentos, poemas, notas de enciclopedia, invitaciones, cartas y registros de observación.","Reflexión: red semántica, palabras que indican acciones, lugar y paso del tiempo, sinonimia y antonimia."]],["Mayo",["Presentación oral; relatos y descripciones de experiencias personales.","Lectura de rastreo y lectura autónoma en silencio y en voz alta.","Revisión gradual de los propios escritos (suprimir, agregar, sustituir, recolocar, desplazar).","Reflexión sobre el vocabulario: familias de palabras."]],["Junio",["Escucha comprensiva de narraciones: personajes, dónde, cuándo, qué sucede y cómo termina.","Lectura asidua de textos literarios y no literarios (biografías, textos expositivos, descripciones, notas de enciclopedia, instructivos).","Escritura al dictado de oraciones de al menos cinco palabras.","Puntuación (incluye los dos puntos) e identificación de la sílaba tónica."]],["Julio",["Escucha comprensiva de narraciones; participación oral en tareas escolares pidiendo aclaraciones y haciendo aportes.","Lectura autónoma en silencio y en voz alta.","Escritura al dictado de oraciones.","Puntuación."]],["Agosto",["Escucha comprensiva de narraciones.","Revisión gradual de los propios escritos y escritura al dictado.","Lectura autónoma.","Puntuación e identificación de la sílaba tónica."]],["Septiembre",["Presentación oral y escucha comprensiva de narraciones.","Lectura autónoma y exploración de materiales con uso de índices.","Escritura al dictado de oraciones.","Puntuación, sílaba tónica, ortografía (mb, mp, nr) y reglas sin excepciones; sustantivos comunes y propios, adjetivos y verbos de acción."]],["Octubre",["Presentación oral y escucha comprensiva de narraciones.","Lectura autónoma y lectura de rastreo.","Revisión gradual de los escritos.","Familias de palabras, ortografía (mb, mp, nr), sustantivos, adjetivos y verbos, sílaba tónica y red semántica."]],["Noviembre y diciembre",["Mes de repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Coplas, poesías (rimas), cuentos, fábulas, leyendas, novelas, instructivo, expositivo y notas enciclopédicas."]],nota:"Fuente: Calendarización de saberes de Primer Ciclo, área Lengua, 3.° grado. Bibliografía sugerida en el documento: El Pollo Goyo 3 (Kapelusz, 2024) y A la Plaza 3 (Logseller, 2022)."},
"4.°":{p:[["Marzo",["Mes de repaso."]],["Abril",["Conversaciones sobre temas de estudio y lo leído (narrar, describir, pedir, opinar, preguntar y responder); escucha atenta de consignas y de exposiciones (tema, subtemas, ejemplos y comparaciones).","Lectura con distintos objetivos y en distintos circuitos (bibliotecas áulicas y escolares, maratón de lectura).","Obras literarias de tradición oral y de autor: interpretar en comunidad lectora.","Reflexión: organización textual, párrafo, oración, sustantivos, adjetivos y verbos, sustantivos comunes y propios."]],["Mayo",["Renarración de textos leídos o escuchados (tiempo, espacio, personajes, conflicto, acciones y desenlace).","Estrategias de lectura: paratexto, inferencias, información relevante, palabras desconocidas y uso del diccionario.","Producción de relatos y versiones nuevas; textos de invención con juego de palabras y sonidos.","Reflexión: verbos de acción en pasado y conectores temporales y causales (narrativos), presente en los expositivos, infinitivo e imperativo en los instructivos."]],["Junio",["Exposiciones individuales con orientación del docente (presentación, desarrollo y cierre, con material de apoyo).","Lectura autónoma de una consigna escrita de un paso.","Reflexión: sustantivos comunes y propios, verbos y conectores, sinónimos, antónimos e hiperónimos."]],["Julio",["Exposiciones individuales; lectura autónoma de textos literarios y no literarios y monitoreo de la propia comprensión.","Ortografía: acentuación regular, punto y coma, punto y aparte, paréntesis, dos puntos y raya de diálogo, y mayúsculas."]],["Agosto",["Exposiciones individuales.","Escritura planificada de textos con consulta bibliográfica: borradores y revisión.","Renarraciones; ortografía de diminutivos y plurales, y mayúsculas."]],["Septiembre",["Renarraciones de textos.","Escritura de textos no ficcionales: respuestas, presentación personal, síntesis de noticias y narraciones con diálogos y descripciones.","Producción de relatos; acentuación y puntuación."]],["Octubre",["Renarraciones; lectura autónoma y monitoreo de la comprensión.","Literatura de tradición oral y de autor.","Ortografía, reglas de escritura y puntuación."]],["Noviembre y diciembre",["Repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Coplas, poesías (rimas), cuentos, fábulas, leyendas, novelas, teatro, noticia, instructivo, expositivo, carta y correo electrónico."]],nota:"Fuente: Calendarización de saberes de Segundo Ciclo, área Lengua, 4.° grado. Calendarización elaborada por las docentes Carril Mabel y Cáneva Micaela, Delegación Zonal El Colorado. Bibliografía sugerida: Viceversa Prácticas del Lenguaje 4 (Estación Mandioca, 2022) y Ronda de palabras 4 (Estación Mandioca, 2024)."},
"5.°":{p:[["Marzo",["Repaso del año anterior."]],["Abril",["Conversaciones con ejemplos, explicaciones y léxico adecuado a la situación; lectura con distintos objetivos y en distintos circuitos.","Obras literarias de tradición oral y de autor.","Reflexión: organización textual, párrafo, oración, sujeto expreso y tácito, y morfología flexiva (género, número, persona, tiempo)."]],["Mayo",["Escucha de consignas de tres datos y de procesos explicados (relacionados con Ciencias Naturales).","Lectura autónoma de consignas de tres o más pasos, de textos de manuales y de narraciones con distintos puntos de vista.","Producción de relatos y versiones nuevas.","Tiempos verbales de la narración, estructura de las definiciones, presente en los expositivos y adjetivos calificativos."]],["Junio",["Estrategias de lectura según el tipo de texto y procedimientos propios del texto leído (expositivo, narrativo, descriptivo, instructivo).","Reflexión: familias de palabras, pronombres personales y posesivos, y relaciones de significado (sinónimos, antónimos, hiperónimos e hipónimos)."]],["Julio",["Exposiciones individuales y grupales con definición, comparación, ejemplos y materiales de apoyo.","Lectura autónoma y producción de relatos.","Ortografía: tildación de pronombres interrogativos y exclamativos, y homófonos (haber/a ver, hay/ay, hacer/a ser)."]],["Agosto",["Escucha de consignas y procesos.","Escritura planificada con consulta bibliográfica: borradores y revisión.","Morfología flexiva de sustantivos, adjetivos, artículos y verbos."]],["Septiembre",["Exposiciones individuales y grupales.","Escritura de textos no ficcionales: narraciones, diálogos, descripciones, exposiciones y cartas personales.","Lectura autónoma, producción de relatos y familias de palabras."]],["Octubre",["Renarraciones orales; escritura de textos no ficcionales; producción de relatos.","Ortografía: tildación de pronombres y homófonos."]],["Noviembre y diciembre",["Repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Poesías, cuentos, leyendas, novelas, teatro, historieta, entrevista y biografía, crónica periodística y expositivo."]],nota:"Fuente: Calendarización de saberes de Segundo Ciclo, área Lengua, 5.° grado. Calendarización elaborada por las docentes Carril Mabel y Cáneva Micaela, Delegación Zonal El Colorado. Bibliografía sugerida: Viceversa Prácticas del Lenguaje 5 (Estación Mandioca, 2022) y Prácticas del Lenguaje 5 (Aique, 2024)."},
"6.°":{p:[["Marzo",["Mes de repaso."]],["Abril",["Conversaciones con justificación, ejemplos y explicaciones; lectura con distintos propósitos y circuitos.","Obras literarias de tradición oral y de autor.","Reflexión: organización textual, párrafo, oración bimembre y unimembre, sujeto expreso y tácito, y reformulación oracional."]],["Mayo",["Escucha de consignas de cuatro o más datos, de procesos y de instrucciones seriadas.","Estrategias de lectura según el tipo de texto; producción de relatos y versiones nuevas.","Variaciones morfológicas: género, número, tiempo, modos (indicativo e imperativo) y persona."]],["Junio",["Narraciones y renarraciones de historias no ficcionales con diálogos directos e indirectos; exposiciones individuales y grupales con vocabulario específico.","Lectura autónoma de consignas de al menos cuatro datos y de textos expositivos (acontecimientos históricos y Ciencias Naturales).","Tiempos verbales de la narración (incluido el pluscuamperfecto), conectores, comparaciones, adjetivos descriptivos, pronombres y relaciones de significado."]],["Julio y agosto",["Entrevista para profundizar un tema de estudio: tomar notas y, si es posible, grabarla.","Escritura de textos no ficcionales: narraciones, descripciones, exposiciones de más de tres párrafos con cuadros y organizadores gráficos, y cartas formales.","Ortografía: adverbios terminados en «mente», afijos del vocabulario especializado (hiper-, hipo-, hidro-, geo-, hema-, -logía) y homófonos."]],["Septiembre",["Escucha de consignas de cuatro o más datos y de instrucciones seriadas.","Escritura de textos no ficcionales y producción de relatos.","Puntuación (coma para aclaración y aposición), palabras de uso frecuente del vocabulario especializado, y mayúsculas en tratamientos y abreviaturas."]],["Octubre",["Entrevista; lectura con distintos objetivos.","Reconocimiento de las lenguas y variedades lingüísticas que se hablan en la comunidad y están presentes en la literatura y los medios.","Puntuación y abreviaturas."]],["Noviembre y diciembre",["Repaso y aplicación de secuencias para recuperar alumnos."]]],extra:["Tipologías textuales a trabajar",["Poesías, cuentos, mitos, leyendas, novelas (policial), teatro, entrevista y biografía, textos argumentativos (artículo de divulgación científica, publicidad y propaganda, notas de opinión), expositivo, cartas formales e informales."]],nota:"Fuente: Calendarización de saberes de Segundo Ciclo, área Lengua, 6.° grado. Calendarización elaborada por las docentes Carril Mabel y Cáneva Micaela, Delegación Zonal El Colorado. Bibliografía sugerida: Viceversa Prácticas del Lenguaje 6 (Estación Mandioca, 2022), Buenas Palabras 6 (Letra Impresa, 2022), Prácticas del lenguaje 6 (Longseller, 2022) y Lengua 6 (SM, 2019)."}},
"Matemática":{"4.°":{p:[["Marzo",["Diagnóstico y dos semanas de repaso."]],["Marzo, abril y mayo",["Números naturales, sistema de numeración posicional: recta numérica con series ascendentes y descendentes de 100, 200, 500, 1.000, 5.000 y 10.000; lectura, escritura, comparación, composición y descomposición de números hasta 100.000.","Fracciones y expresiones decimales usuales: reconocimiento y uso como resultado de una medición, un reparto o una partición.","Cálculos exactos y aproximados de números hasta cinco cifras, analizando su pertinencia.","Divisibilidad: análisis de relaciones entre cantidades para describir regularidades.","Relaciones espaciales de posición, dirección y orientación; representaciones del espacio próximo.","Unidades de longitud, capacidad, masa y tiempo: comprensión del proceso de medir."]],["Junio y julio",["Sistema de numeración posicional: uso de la organización decimal y explicación de sus características al comparar cantidades.","Fracciones y expresiones decimales usuales: interpretar y comparar el resultado de una medición, un reparto o una partición con distintas escrituras.","Procedimientos de cálculo exacto, aproximado, mental, escrito y con calculadora de sumas, restas, multiplicaciones y divisiones hasta dos cifras.","Divisibilidad: reconocimiento y clasificación de números primos y compuestos.","Figuras: describir, reconocer y comparar triángulos, cuadriláteros y otras figuras.","Equivalencias de unidades: longitud (km, m, dm, cm) y capacidad (l, dl, cl, ml)."]],["Agosto",["Números naturales: encuadramiento entre números próximos, decenas, centenas y unidad de mil.","Fracciones y expresiones decimales: algoritmos que permiten establecer equivalencias.","Multiplicación y división de cantidades proporcionales (dobles, triples, mitades).","Divisibilidad: tablas, diagramas de árbol y otras estrategias para hallar múltiplos y divisores.","Reproducción y construcción de figuras con regla, escuadra y compás; equivalencias entre monedas y billetes.","Estadística y probabilidad: lectura e interpretación de información en tablas y gráficos (pictograma, barras, circular)."]],["Septiembre y octubre",["Fracciones y expresiones decimales: equivalencias con material concreto o semiconcreto y estrategias aritméticas.","Resolución de problemas con distintos significados de las operaciones básicas y evaluación de la razonabilidad del resultado.","Cuerpos geométricos: reconocimiento, descripción y comparación según la forma y el número de caras; juegos de sellos.","Sistema de medición sexagesimal: medición, reconocimiento, clasificación y construcción de ángulos con el ángulo recto como unidad.","Áreas y volúmenes: polígonos para formar dos figuras de igual área.","Estadística y probabilidad: variables cualitativas y cuantitativas e instrumentos sencillos (encuestas, cuestionarios y guías de observación)."]],["Noviembre y diciembre",["Afianzamiento."]]],extra:["Ejes del año",["Número y operaciones; geometría y medida; estadística y probabilidad."]],nota:"Fuente: Calendarización de saberes de 4.° grado, Matemática, año 2026. Los contenidos de las últimas filas del cuadro pueden estar desplazados de período; conviene revisarlos con la docente del grado."},
"5.°":{p:[["Marzo",["Diagnóstico y dos semanas de repaso."]],["Marzo, abril y mayo",["Números naturales, sistema de numeración posicional: series numéricas ascendentes y descendentes de 5.000, 10.000, 100.000, 500.000 y 1.000.000; lectura, escritura, comparación, composición y descomposición de números hasta 1.000.000.","Fracciones y expresiones decimales usuales: análisis de relaciones entre cantidades para describir regularidades, incluida la proporcionalidad.","Procedimientos de cálculo exacto y aproximado, mental, escrito y con calculadora de sumas, restas, multiplicaciones y divisiones hasta dos cifras.","Divisibilidad: relaciones numéricas vinculadas a la división y a la multiplicación (múltiplo, divisor, D = d × c + r).","Relaciones espaciales y sistemas de referencia para ubicar objetos en el espacio y en el plano.","Unidades de longitud, capacidad, masa y tiempo: el proceso de medir; el metro cuadrado con material concreto (papel, cartón, baldosas).","Estadística y probabilidad: identificación de variables cualitativas y cuantitativas."]],["Junio y julio",["Sistema de numeración: comparación de propiedades de distintos sistemas posicionales y no posicionales (decimal y romano).","Fracciones y expresiones decimales usuales: resultado de una medición, un reparto o una partición; interpretar, registrar, comunicar y comparar cantidades (pesos, precios, capacidades, longitudes, áreas).","Comparación de procedimientos para calcular valores que se corresponden o no proporcionalmente.","Divisibilidad: descomposición de un número en factores primos.","Unidades de medida: elegir el instrumento y la unidad adecuados según la precisión requerida.","Sistema sexagesimal: uso del transportador para medir ángulos de forma exacta y aproximada."]],["Agosto",["Sistema de numeración posicional: procedimientos para calcular valores que se corresponden proporcionalmente o no.","Fracciones y expresiones decimales: lectura e interpretación de enunciados y elaboración de enunciados con fracciones, expresiones decimales o porcentajes.","Figuras: reproducción y construcción de figuras (triángulos, cuadriláteros, círculos y figuras combinadas) a partir de informaciones, con regla, escuadra, compás y transportador.","Monedas y billetes: equivalencias entre la moneda nacional y las de otros países del MERCOSUR.","Sistema sexagesimal: reconocimiento, clasificación y construcción de ángulos.","Estadística y probabilidad: lectura, interpretación y comunicación de información en tablas y gráficos (pictograma, histograma, barras, circular)."]],["Septiembre y octubre",["Fracciones, expresiones decimales y porcentajes: equivalencias en forma oral, concreta, gráfica y simbólica; comparación entre sí y con números naturales.","Resolución de ecuaciones aditivas y multiplicativas verificando los resultados; procedimientos de cálculo mental para facilitar otros cálculos.","Problemas de área y perímetro de figuras usuales, con unidades convencionales o no.","Situaciones que implican estimar medidas de longitud, capacidad, masa y tiempo.","Problemas con monedas y billetes, incluidos cambios con monedas extranjeras.","Estadística y probabilidad: búsqueda y análisis de datos representativos en variables cuantitativas (media aritmética o promedio y moda)."]],["Noviembre y diciembre",["Afianzamiento."]]],extra:["Ejes del año",["Número y operaciones; geometría y medida; estadística y probabilidad."]],nota:"Fuente: Calendarización de saberes y alcances de 5.° grado, Matemática, año 2026. Leída desde el cuadro del documento; conviene revisarla con la docente del grado."},
"6.°":{p:[["Marzo",["Diagnóstico y dos semanas de repaso."]],["Marzo, abril y mayo",["Números naturales: propiedades (conjunto infinito y discreto; antecesor, sucesor y «comprendido entre»; el cero como primer elemento); valor relativo y valor absoluto de una cifra.","Fracciones y expresiones decimales: relaciones y propiedades que diferencian los números naturales de las fracciones y los decimales; relaciones entre cantidades para describir regularidades, incluida la proporcionalidad.","Procedimientos de cálculo exacto, aproximado, mental, escrito y con calculadora; situaciones con número primo, m.c.m. y d.c.m.","Relaciones espaciales: noción de lugar geométrico; croquis y planos explicitando relaciones de proporcionalidad (doble, mitad, cuarto, tercio).","Unidades de longitud, capacidad, masa y tiempo: el proceso de medir y las equivalencias, con las relaciones de proporcionalidad que organizan las unidades del SIMELA."]],["Junio y julio",["Números naturales: lectura, comparación y ubicación de series en la recta numérica; propiedades del sistema decimal para leer, escribir, comparar, componer y descomponer números de muchas cifras.","Fracciones y expresiones decimales: reconocimiento y uso analizando sus características; interpretación y comparación con distintos procedimientos, representación en la recta numérica e intercalación entre otros números.","Construcción de figuras (triángulos, cuadriláteros, círculos y figuras combinadas) con regla, escuadra, compás y transportador.","Estimación de cantidades evaluando la razonabilidad del resultado y la unidad elegida.","Estadística y probabilidad: lectura, análisis y comunicación de información en tablas y gráficos (barras y circular)."]],["Agosto",["Comparación de la organización del sistema decimal con otros sistemas (romano), atendiendo a la posición y a la función del cero; uso de la calculadora para investigar propiedades o regularidades de los números.","Fracciones y expresiones decimales: comparación (hasta tres cifras decimales), ordenamiento, representación en la recta numérica, encuadramiento y aproximación.","Problemas de área de figuras geométricas usuales, con unidades de medida convencionales o no.","Monedas y billetes: equivalencias entre la moneda nacional y otras (dólar, euro, entre otras).","Sistema sexagesimal: reconocimiento, clasificación y construcción de ángulos en situaciones problemáticas.","Estadística y probabilidad: construcción de tablas y gráficos estadísticos."]],["Septiembre y octubre",["Fracciones y expresiones decimales: descripción, completamiento y creación de patrones numéricos; procedimientos que incluyen la constante de proporcionalidad.","Propiedades de las operaciones para facilitar el cálculo en ejercicios complejos; ecuaciones y desigualdades sencillas.","Divisibilidad: propiedades de las relaciones «múltiplo de» y «divisor de», argumentando su validez.","Figuras: problemas que ponen en juego la relación entre área y perímetro; fórmulas para el área y el perímetro de triángulos, cuadriláteros y círculos.","Monedas y billetes: problemas con cambios con monedas extranjeras.","Estadística y probabilidad: media aritmética y moda en variables cuantitativas; organización y representación de datos en listas, series, tablas, pictogramas, diagramas de barras y de bastones, y circular."]],["Noviembre y diciembre",["Afianzamiento."]]],extra:["Ejes del año",["Número y operaciones; geometría y medida; estadística y probabilidad."]],nota:"Fuente: Calendarización de saberes y alcances de 6.° grado, Matemática, año 2026. Leída desde el cuadro del documento; conviene revisarla con la docente del grado."},
"2.°":{p:[["Marzo",["Diagnóstico."]],["Abril y mayo",["Uso y reconocimiento de los números naturales: identificación de regularidades en la serie numérica.","Resolución de problemas que permiten retomar lectura, escritura y orden de los números.","Uso de la calculadora para resolver cálculos de suma y resta."]],["Junio y julio",["Números naturales: análisis del valor posicional en contextos significativos, con números de una, dos, tres y más cifras.","Suma y resta de números naturales.","Construcción y uso de estrategias de cálculo mental para sumas y restas."]],["Agosto y septiembre",["Problemas de suma y resta con distintos sentidos: unir, agregar, ganar, quitar, perder y retroceder.","Uso progresivo de cálculos memorizados y de las propiedades de la adición.","Multiplicación y división: problemas con series proporcionales y organizaciones rectangulares."]],["Octubre",["Afianzamiento: elaboración de preguntas a partir de imágenes, enunciados incompletos o cálculos.","Comunicación oral y escrita de resultados y procedimientos.","Comparación de procedimientos de cálculo exacto, aproximado y mental."]],["Noviembre y diciembre",["Mes de repaso."]]],extra:["Geometría y medida (durante el año)",["Figuras geométricas: descripción según sus características (lados, vértices, bordes curvos y rectos), reproducción y construcción con distintos materiales (cuadrados, rectángulos y triángulos).","Cuerpos geométricos: reconocimiento y descripción (aristas, vértices, caras, bordes curvos y rectos).","Relaciones espaciales: interpretación y descripción oral y gráfica de trayectos y posiciones de objetos y personas, contextualizados al barrio.","Unidades de longitud, capacidad y peso: unidades convencionales y no convencionales, medición efectiva y problemas para medir y comparar."]],nota:"Fuente: Calendarización de saberes y alcances de 2.° grado, año 2026. La distribución por período puede requerir revisión, porque el archivo original perdió el formato de tabla al leerlo."}}};
