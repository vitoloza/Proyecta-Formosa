<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F1">
<title>ProyectaFormosa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FAF6F1;--card:#FFFDFA;--ink:#3A322D;--mute:#85786F;--line:#ECE3D9;--accent:#8F6B5B;--on:#FFFFFF;--focus:#B07D68;
--sage:#DCE6D8;--blush:#F4DDD6;--sand:#F0E4D2;--lav:#E6E0EC;--sky:#DAE6EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A17;--card:#27221F;--ink:#F0E8E1;--mute:#B5A79C;--line:#3A322D;--accent:#D0A592;--on:#2A1F1A;--focus:#D0A592;--sage:#2F3A2E;--blush:#42302B;--sand:#3A3128;--lav:#35303F;--sky:#2B3840}}
:root[data-theme="dark"]{--bg:#1E1A17;--card:#27221F;--ink:#F0E8E1;--mute:#B5A79C;--line:#3A322D;--accent:#D0A592;--on:#2A1F1A;--focus:#D0A592;--sage:#2F3A2E;--blush:#42302B;--sand:#3A3128;--lav:#35303F;--sky:#2B3840}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
header{display:flex;gap:10px;align-items:center;max-width:980px;margin:0 auto;padding:16px 18px 4px}
header a{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}
header img{width:36px;height:36px;flex:none;border-radius:10px}
header h1{margin:0;font-size:1.05rem;line-height:1.1}
header p{margin:0;font-size:.78rem;color:var(--mute)}
main{max-width:980px;margin:0 auto;padding:12px 18px 40px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--sand);color:var(--ink);font:500 .95rem ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;margin:0 8px 8px 0;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
.btn.s{min-height:38px;padding:0 16px;font-size:.88rem}
.btn.alt{background:transparent}
.btn.primary,.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;margin:0 0 6px}
.home{display:flex;flex-direction:column;max-width:420px;margin:7vh auto 0;text-align:center}
.btn.big{min-height:68px;font-size:1.12rem;margin:0}
.hint{color:var(--mute);font-size:.85rem;margin:22px 0 12px}
.menu{display:flex;flex-direction:column;gap:10px}
.btn.tile{width:100%;min-height:62px;margin:0;flex-direction:column;gap:0;line-height:1.25}
.btn.tile small{font-weight:400;font-size:.78rem;color:var(--mute)}
.btn.sage{background:var(--sage)}.btn.blush{background:var(--blush)}.btn.sand{background:var(--sand)}.btn.lav{background:var(--lav)}.btn.sky{background:var(--sky)}
.vt{margin:6px 0 4px;font-size:1.5rem}
.lead,.note{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px rgba(80,60,45,.10)}
.card h3{margin:8px 0 4px;font-size:1.02rem}
.card p{margin:0;color:var(--mute);font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:999px;background:var(--sage);margin:0 4px 2px 0;color:var(--ink)}
.tag:nth-child(2){background:var(--blush)}.tag:nth-child(3){background:var(--lav)}.tag:nth-child(4){background:var(--sky)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;max-width:720px}
.doc h2{margin:.3em 0 .3em}.doc h3{margin:1.2em 0 .2em;color:var(--accent);font-size:1rem}
ul{margin:.2em 0;padding-left:1.2em}
.acc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 10px;max-width:720px}
.acc summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:18px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1.3rem;color:var(--accent);line-height:1}
.acc[open] summary::after{content:"–"}
.acc summary small{display:block;font-weight:400;color:var(--mute)}
.accb{padding:0 18px 16px}
.accb h3{margin:1em 0 .2em;color:var(--accent);font-size:.95rem}
.empty{color:var(--mute);padding:26px 0;text-align:center}
form label{display:block;margin:14px 0 5px;font-size:.88rem;color:var(--mute)}
form{max-width:720px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mute);font-size:.78rem;padding:10px 18px 24px}
@media print{header,.noprint,footer{display:none}body{background:#fff;color:#000}.doc{border:0}}
.opt{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.93rem;color:var(--ink)!important}.opt input{width:auto;margin-top:5px;flex:none}
</style>
