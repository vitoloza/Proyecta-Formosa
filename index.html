"Matemática":{"Primer Ciclo":mk([["Número y operaciones","Uso y exploración de los números naturales: leer, escribir, comparar cantidades, comprender las relaciones en un cálculo y la organización del sistema de numeración decimal en situaciones problemáticas.",{
"1.°":["Explorar contextos y funciones de los números en el uso social.","Reconocer los números naturales y la organización del sistema decimal; nombrar y escribir números de una, dos y más cifras; resolver situaciones de conteo.","Analizar el valor posicional y las regularidades de la serie numérica al leer y comparar números.","Suma y resta: resolver problemas de unir, agregar, ganar, avanzar, quitar, perder y retroceder con dibujos, marcas, números y cálculos; pasar del conteo y el sobreconteo a estrategias más avanzadas; usar cálculos memorizados (dobles, iguales, complementos a 10).","Multiplicación y división: resolver problemas con algunos sentidos de la multiplicación y problemas de reparto con dibujos, marcas, números y sumas."],
"2.°":["Reconocer los naturales y el sistema decimal; nombrar y escribir números de una, dos, tres y más cifras.","Comunicar por escrito y oralmente resultados y procedimientos; elaborar preguntas a partir de imágenes, enunciados incompletos y cálculos.","Analizar el valor posicional y las regularidades de la serie al leer y comparar números de una, dos, tres y más cifras.","Suma y resta con distintos sentidos; uso progresivo de cálculos memorizados y de las propiedades de la adición; explorar problemas con otros significados.","Cálculo mental, comparación de procedimientos exactos, aproximados y mentales, uso de la calculadora y selección de estrategias según los números.","Multiplicación y división: series proporcionales y organizaciones rectangulares; problemas de reparto y partición; estrategias de cálculo mental y calculadora."],
"3.°":["Nombrar y escribir números de una, dos, tres, cuatro y más cifras; elaborar preguntas y enunciados de problemas; registrar y organizar datos en tablas y gráficos sencillos.","Analizar el valor posicional con números de hasta cuatro y más cifras y explorar relaciones numéricas.","Suma y resta con distintos sentidos; articular procedimientos personales con los algoritmos usuales; problemas con datos necesarios e innecesarios y con varias soluciones.","Cálculo mental, calculadora y comparación de procedimientos exactos, aproximados y mentales.","Multiplicación y división: series proporcionales, organizaciones rectangulares y combinación de elementos de dos colecciones; productos básicos y propiedades; multiplicar y dividir por la unidad seguida de ceros; algoritmos de multiplicación y división por una cifra."]}],
["Números racionales positivos (grado por confirmar)","",{"1.° a 3.°":["Reconocer y usar fracciones usuales (1/2, 1/4 y 3/4) en situaciones contextualizadas; nombrarlas y escribirlas.","Resolver problemas de reparto que implican partir el entero en partes iguales (mitades y cuartos).","Resolver situaciones con fracciones usuales y calcular lo que falta para llegar a la mitad y a la unidad."]}],
["Geometría y medida","Comunicar ubicaciones y desplazamientos, reconocer figuras y cuerpos geométricos por sus propiedades, y estimar y medir longitudes, superficies, capacidades y pesos con instrumentos no convencionales y convencionales.",{
"1.°":["Reconocer relaciones espaciales en espacios explorables; interpretar trayectos y posiciones de objetos y personas en la escuela y en la casa.","Figuras: describirlas según el número de lados o vértices y los bordes curvos o rectos; reproducir figuras con cuadrados y rectángulos.","Cuerpos: reconocerlos y describirlos según aristas, vértices y caras; construir modelos de paralelepípedos.","Medida: unidades no convencionales de uso frecuente; problemas de medir y comparar longitudes.","Tiempo: calendario, días de la semana y meses del año."],
"2.°":["Interpretar y describir trayectos y posiciones de objetos y personas contextualizados al barrio.","Figuras: cuadrados, rectángulos y triángulos; relaciones entre figuras (incluidos los círculos); construir y copiar modelos con distintos materiales.","Cuerpos: cubos, prismas y pirámides; construir modelos de paralelepípedos y pirámides.","Medida: unidades convencionales y no convencionales; medición efectiva de longitudes, capacidades y pesos.","Tiempo: calendario para determinar duraciones (meses, semanas y días)."],
"3.°":["Comunicar y analizar instrucciones orales y escritas para ubicar objetos y personas; identificar puntos de vista; elaborar preguntas referidas a relaciones espaciales.","Figuras: explorar afirmaciones sobre sus características; reproducir figuras; elaborar enunciados de problemas.","Cuerpos: interpretar reproducciones y armado de cuerpos; construir paralelepípedos, pirámides y cilindros.","Medida: metro, centímetro y milímetro; medios y cuartos de kilo y de litro; regla y cinta métrica y equivalencia entre metro y centímetros.","Tiempo: lectura de la hora en distintos relojes, cálculo de duraciones y equivalencias entre horas y minutos (1/2, 1/4 y 3/4 de hora)."]}]]),
"Segundo Ciclo":mk([["Número y operaciones","Reconocimiento y uso de números naturales, de las operaciones y sus propiedades, y explicitación de la organización del sistema decimal, con énfasis en argumentar la validez de los procedimientos.",{

"6.°":["Relación entre la base de un sistema de numeración y la cantidad de símbolos y de dígitos de un número.","Comparar números naturales, fracciones y expresiones decimales; equivalencias entre escrituras fraccionarias, decimales y porcentuales.","Resolver ecuaciones y desigualdades sencillas con fracciones y decimales; usar las propiedades de las operaciones para facilitar el cálculo."],
"4.° a 6.°":["Resolver problemas con los distintos significados de las operaciones básicas y evaluar la razonabilidad del resultado.","Analizar relaciones entre cantidades para describir regularidades, incluida la proporcionalidad.","Cálculo exacto, aproximado, mental, escrito y con calculadora de sumas, restas, multiplicaciones y divisiones.","Explicitar procedimientos de cálculo mental y argumentar sobre la validez de los resultados."]}],
["Geometría y medida","El reconocimiento de las propiedades de figuras y cuerpos geométricos y de los sistemas de medidas para distintas magnitudes en la resolución de problemas.",{"4.° a 6.°":["Relaciones espaciales: usar referencias para ubicar objetos en el espacio y en el plano; elaborar maquetas, croquis y representaciones; ubicar puntos en una línea y en el plano.","Figuras: describir, reconocer y comparar triángulos, cuadriláteros y otras figuras; construirlas con regla, escuadra y compás; composición y descomposición; calcular perímetros.","Cuerpos: reconocer, describir y comparar según la forma y el número de caras.","Longitud y capacidad: equivalencias entre km, m, dm, cm y mm, y entre l, dl, cl y ml; estimar medidas; elegir el instrumento adecuado.","Tiempo: día, hora, minuto y segundo; cronómetro; siglo, lustro, década, año y mes; equivalencias entre unidades.","Ángulos: reconocer, clasificar y construir usando el ángulo recto como unidad.","Áreas y volúmenes: figuras de igual área, cuerpos con bloques iguales, el metro cuadrado y el cálculo del área de figuras usuales."]}],
["Estadística y probabilidad","Nociones básicas de estadística y probabilidad: interpretar, organizar, registrar y representar datos de distintos medios y comunicar los resultados.",{"4.° a 6.°":["Elaborar instrumentos sencillos (encuestas, cuestionarios, guías de observación) para recopilar datos.","Recopilar y registrar datos del entorno en listas, tablas y diagramas de barras y de bastones.","Interpretar y completar gráficos de barras, cuadros y tablas; analizar datos de los medios de comunicación.","Explorar regularidades en situaciones de azar con juegos (dados, cartas).","Comunicar resultados con vocabulario apropiado y argumentar decisiones a partir de los datos."]}]])},
"Ciencias Naturales":{"Primer Ciclo":mk([
["Seres vivos: diversidad, unidad, interrelaciones y cambios","Criterios de observación, identificación y caracterización de seres vivos y sus ambientes, con énfasis en el rol del ser humano en su preservación; incluye el cuerpo humano, los hábitos saludables y el lenguaje científico inicial.",{"1.° a 3.°":["Reconocer la gran diversidad de seres vivos, sus características, estructuras, funciones y comportamientos comunes y diferentes, y su relación con el ambiente (adaptación).","Diferenciar lo vivo de lo no vivo a partir de experiencias cotidianas.","Observar y caracterizar ambientes naturales y artificiales cercanos.","Conocer y describir animales y plantas de la zona y de la región mediante observación y dibujos (patas, alas, aletas; raíz, tallo, hoja).","Cuerpo humano: características externas, ubicación de los principales órganos, y reconocimiento como totalidad con necesidades de afecto, cuidado y valoración (en articulación con ESI).","Alimentación adecuada y equilibrada; reconocimiento de las comidas típicas de Formosa y la región.","Hábitos saludables, higiene personal y prevención de enfermedades comunes en la provincia, como la importancia de las vacunas.","Registrar observaciones, ordenar datos y hacer gráficos sencillos."]}],
["Materiales y sus cambios","Características de diferentes materiales, sus interacciones y transformaciones según el uso, su comportamiento frente a la luz y nociones básicas de seguridad.",{"1.° a 3.°":["Observar la diversidad de materiales de los objetos y sus propiedades (dureza, rugosidad, color, flexibilidad) y relacionarlas con sus usos.","Distinguir materiales naturales y elaborados.","Reconocer cambios en los materiales por una interacción y su comportamiento ante cambios de temperatura.","Identificar objetos transparentes, translúcidos y opacos y comprender el comportamiento de algunos materiales frente a la luz.","Observar los materiales usados en objetos artesanales producidos en Formosa (madera, cuero de animales, fibras textiles naturales y otros).","Reconocer que algunos materiales pueden ser fuente de riesgo y conocer precauciones básicas para su manipulación."]}],
["Fenómenos del mundo físico","Primer acercamiento a fuerza, movimiento, luz, temperatura y sonido, y a los efectos de acciones mecánicas como estirar, comprimir o torcer.",{"1.° a 3.°":["Observar los efectos de acciones mecánicas (estirar, comprimir, torcer, aplastar, abrir, partir) y cómo resisten distintos materiales.","Reconocer la noción de fuerza por contacto en la vida diaria.","Reconocer distintos tipos de movimiento según la trayectoria y la rapidez.","Luz: fuentes de luz, trayectoria de la luz, formación de sombras, reflexión y refracción en situaciones cotidianas.","Sonido: la vibración como origen; sonidos débiles y fuertes, agudos y graves; sentido de la audición.","Comunicar conclusiones en informes orales o escritos sencillos."]}],
["La Tierra, el Universo y sus cambios","Paisaje, fenómenos atmosféricos, la Luna y los puntos cardinales como método de orientación espacial.",{"1.° a 3.°":["Describir y clasificar paisajes locales (diurno y nocturno, urbano y rural, natural y artificial) y reconocer los componentes del paisaje terrestre y celeste.","Identificar cambios de los paisajes por la actividad humana y recursos naturales que hay que preservar en Formosa.","Diferenciar ambientes urbanos y rurales de la provincia.","Aproximarse al estado del tiempo atmosférico (niebla, lluvia, viento, nubes).","Geoformas: observar y describir formas del relieve cercanas y representarlas con figuras y maquetas."]}]]),
"Segundo Ciclo":mk([
["Seres vivos: diversidad, unidad, interrelaciones y cambios","Criterios para observar, identificar, caracterizar y clasificar seres vivos (animales, plantas, hongos y microorganismos) en ambientes aeroterrestres (4.°) y acuáticos (5.°) y sus relaciones adaptativas; el cuerpo humano como sistema integrado: sostén y movimiento (4.°), nutrición (5.°) y reproducción y sistema nervioso (6.°); cuidado de la salud y del ambiente.",{
"4.°":["Ambientes aeroterrestres cercanos, comparados con otros lejanos y de otras épocas; ambientes acuáticos y de transición.","Características que diferencian a plantas, animales, hongos y microorganismos.","Flora y fauna autóctona de Formosa.","Adaptaciones morfo-fisiológicas (absorción, sostén, locomoción, cubiertas corporales, comportamiento social, reproducción).","Funciones de sostén y locomoción en el hombre: huesos, músculos y articulaciones; cuidado del sistema osteo-artro-muscular."],
"5.°":["Ambientes acuáticos: fluviales, lacustres y oceánicos, y características adaptativas de los organismos acuáticos.","El hombre como agente modificador del ambiente y la importancia de su preservación.","Funciones de nutrición en el hombre: digestión, respiración, circulación y excreción; la nutrición como función común a todos los seres vivos."],
"6.°":["Crecimiento, desarrollo y maduración humanos, y procreación desde las dimensiones biológica, afectiva, social y psicológica (en articulación con ESI).","Emociones, derecho y respeto a la intimidad, prevención de enfermedades y de prejuicios sobre las capacidades de niños y niñas (en articulación con ESI)."]}],
["Materiales y sus cambios","Diversidad de estructuras materiales, sus usos y transformaciones; mezclas y soluciones, métodos de separación y una primera aproximación al modelo de partículas de la materia.",{
"4.°":["Materiales naturales (minerales) y producidos por el hombre (cerámicos, plásticos).","Estados sólido, líquido y gaseoso: características macroscópicas.","Materiales conductores y aislantes del calor mediante experimentos sencillos.","Uso correcto del material de laboratorio y normas de seguridad; materiales renovables, reciclables y biodegradables y acciones de cuidado del ambiente en la localidad."],
"5.°":["Tipos de mezclas según homogeneidad y transparencia; métodos para separar sus componentes.","Factores que influyen en la disolución; el agua como solvente universal.","Soluciones: tipos según sus componentes y la destilación como método de separación; noción de soluto y solvente."],
"6.°":["Transformaciones de los materiales: combustión y corrosión.","Comparación de las características de los materiales."]}],
["Fenómenos del mundo físico","Fuerzas por contacto y a distancia (imanes, gravedad), fenómenos magnéticos y electrostáticos; la luz, el sonido, el peso como fuerza, la energía y el calor.",{
"4.° a 6.°":["Fuerzas que actúan a distancia: atracción y repulsión magnética, interacción electrostática y fuerza gravitatoria, con experimentos sencillos.","Materiales conductores y aislantes del calor y de la corriente eléctrica; propiedades de los metales (ductilidad, maleabilidad, conductividad).","Imanes: polos, atracción y repulsión; campo magnético de la Tierra.","Fuerza de empuje y flotación (densidad y volumen) en experimentos sencillos.","Producción de energía eléctrica a partir de la energía eólica y su aplicación en la provincia; funcionamiento de la red eléctrica."]}],
["La Tierra, el Universo y sus cambios","Avance desde lo trabajado en Primer Ciclo: la Tierra como cuerpo cósmico, el Sistema Solar y los subsistemas terrestres (hidrósfera, atmósfera, geósfera y biósfera); registro de cambios en el cielo.",{
"4.° a 6.°":["La Tierra como cuerpo cósmico: forma, rotación, movimiento aparente del Sol y horarios en distintos lugares del planeta.","Subsistemas terrestres (hidrósfera, atmósfera, geósfera, biósfera) y capas de la Tierra que posibilitan la vida; terremotos y erupciones volcánicas.","Ciclo del agua; importancia del agua potable para la salud; procesos de potabilización en Formosa y visitas guiadas a instalaciones locales.","Fenómenos de la atmósfera de la provincia (lluvia, viento, tornados) y fenómenos característicos de la región (desbordes, sequías, inundaciones).","Componentes del Sistema Solar mediante modelización."]}]])},
"Ciencias Sociales":{"Primer Ciclo":mk([
["Sociedades y espacios geográficos","Relaciones sencillas entre elementos naturales y construidos por las personas, y entre las personas y la naturaleza a través del trabajo y la producción de bienes primarios.",{
"1.°":["Conocer el espacio inmediato: casa, aula y escuela.","Conocer elementos naturales y construidos por la sociedad en espacios seleccionados y establecer relaciones entre ellos.","Observar paisajes cercanos y lejanos y reconocer las principales problemáticas ambientales.","Observar formas de representación cartográfica (croquis, planos y mapas) e iniciarse en las prácticas de orientación."],
"2.°":["Conocer el barrio y la ciudad.","Reconocer elementos naturales y construidos y su relación con los recursos naturales.","Observar y comparar paisajes urbanos y rurales.","Relacionar las problemáticas ambientales con los modos de vida de la sociedad.","Conocer las condiciones de vida de distintos grupos sociales en espacios cercanos y lejanos; iniciarse en las prácticas de localización."],
"3.°":["Conocer las etapas de un circuito productivo y la relación entre áreas urbanas y rurales.","Identificar los actores sociales y la tecnología empleada (herramientas, máquinas e instrumentos de medición).","Conocer las características de un sistema de transporte como relación entre espacios urbanos y rurales.","Comprender problemáticas ambientales locales; conocer cómo se presta un servicio público en el espacio urbano."]}],
["Sociedades a través del tiempo","De la vida cotidiana de los niños a las sociedades lejanas en el tiempo: organización familiar en el pasado y en el presente, y procesos sociales de los grupos de Formosa y de la Argentina.",{
"1.° a 3.°":["Comprender la historia personal y familiar para desarrollar la temporalidad.","Identificar huellas materiales del pasado en el presente (objetos, construcciones, mobiliario) y bienes patrimoniales.","Reconocer cambios y continuidades en la vida cotidiana en contextos urbanos y rurales.","Conocer y valorar las costumbres familiares aborígenes y criollas, e identificar familias aborígenes del contexto cercano.","Reconocer transformaciones en las formas de vida a través del tiempo, como las familias ensambladas.","Participar en celebraciones y conmemoraciones históricas; iniciarse en prácticas de indagación (preguntas y respuestas)."]}],
["Actividades humanas y organización social","Grupos sociales, organizaciones e instituciones con sus conflictos y relaciones de poder; instituciones sociales primarias y relación entre el Estado y la sociedad.",{
"1.° a 3.°":["Reconocer los grupos sociales inmediatos (familia y pares) y de la comunidad.","Identificar oficios y profesiones y las herramientas e instrumentos que usan.","Conocer instituciones que dan respuesta a las necesidades de la vida en común.","Practicar el diálogo como forma de conocimiento y de vínculo con otros.","Reconocer las normas que regulan la vida cotidiana (familia, escuela, barrio, tránsito y seguridad) y algunos derechos y obligaciones de la ciudadanía.","Estudiar un caso de actividad laboral de la provincia, con sus roles y funciones."]}]]),
"Segundo Ciclo":mk([
["Sociedades y espacios geográficos","El espacio como construcción social, los procesos históricos que explican las configuraciones del presente y las escalas de análisis (local, regional, nacional).",{
"4.°":["Localizar y representar en mapas la provincia de Formosa en el contexto nacional; conocer la división política de la Argentina.","Identificar clima, relieve, hidrografía y ecorregiones de Formosa y sus formas de aprovechamiento y conservación.","Reconocer los problemas ambientales a escala local y provincial y valorar las áreas protegidas como patrimonio de la provincia.","Conocer espacios rurales y urbanos de Formosa: recursos naturales, actividades económicas, actores sociales, condiciones de vida y de trabajo, y la relación con el turismo.","Leer y construir croquis y mapas con simbología convencional y escala."],
"5.°":["Conocer la organización y delimitación política del territorio argentino (municipio, provincia y país).","Localizar y representar el país en el contexto americano.","Conocer espacios urbanos y rurales de la Argentina y sus funciones.","Leer y construir mapas de distintos tipos y escalas."],
"6.°":["Conocer espacios urbanos de la Argentina y de Latinoamérica.","Interpretar representaciones cartográficas del espacio latinoamericano y construir mapas con simbología convencional.","Planificar, escribir y revisar textos continuos y discontinuos para comunicar los saberes trabajados."]}],
["Sociedades a través del tiempo","La organización del territorio según las condiciones naturales, las actividades, las decisiones político-administrativas y las pautas culturales; los actores individuales y colectivos del pasado y del presente.",{
"4.° a 6.°":["Relación con la naturaleza de las sociedades cazadoras, recolectoras y agricultoras; formas de autoridad, distribución de los bienes y sistemas de creencias de las sociedades anteriores a la llegada de los españoles.","Motivaciones de los europeos desde el siglo XV para explotar y conquistar América, y el impacto de la dominación.","Organización colonial (espacial, política, productiva y comercial) y los actores de la época, con énfasis en las sociedades del actual territorio de Formosa.","Políticas de la segunda mitad del siglo XIX y comienzos del XX: economía agraria para la exportación, apropiación territorial e inmigración.","Motivaciones de la fundación y la provincialización de Formosa.","Nociones temporales, huellas materiales del pasado en la provincia y bienes patrimoniales materiales y simbólicos.","Búsqueda y registro de información en fuentes primarias y secundarias."]}],
["Actividades humanas y organización social","Formas de organización política, manifestaciones culturales del pasado y del presente, y procesos de integración regional entre Estados.",{
"4.°":["Reconocer la organización política de Formosa y sus niveles político-administrativos (departamento, municipio, comisión de fomento, junta vecinal).","Conocer la división de poderes en la provincia, sus funciones y atribuciones.","Conocer la Convención Internacional de los Derechos del Niño y organizaciones solidarias (comedores comunitarios, casas de la solidaridad).","Conocer costumbres, creencias, valores y tradiciones de la propia comunidad y de otras para favorecer el respeto."],
"5.° y 6.°":["Conocer las instituciones sociales y políticas locales, provinciales y nacionales y sus relaciones.","Analizar situaciones de acceso desigual a los bienes materiales, simbólicos y culturales en la Argentina.","Conocer organizaciones que promueven la solidaridad y la ayuda mutua (centros culturales, mutuales, cooperativas).","Conocer los derechos de las minorías y las garantías constitucionales, y su vigencia en el pasado y en el presente.","Valorar el diálogo para resolver conflictos y reflexionar sobre la participación de mujeres y varones en la sociedad (en articulación con ESI)."]}]])},
"Formación Ética y Ciudadana":{"Primer Ciclo":mk([
["Reflexión ética","Reflexión sobre situaciones conflictivas de la vida escolar y cotidiana para construir nociones de justicia, solidaridad, libertad y responsabilidad mediante el diálogo.",{"1.° a 3.°":["Participar en reflexiones sobre situaciones conflictivas de la vida escolar y cotidiana, reales o factibles (fotografías, relatos, narraciones, historietas) para construir nociones de justicia, solidaridad, libertad y responsabilidad.","Ejercitar el diálogo como instrumento para resolver conflictos y construir acuerdos en el ámbito familiar y en el aula.","Explorar y reconocer diferentes modos de resolución de conflictos en la familia y en la escuela."]}],
["Construcción histórica de las identidades","Las identidades personales y grupales como procesos que se construyen desde la historia personal, familiar, local, provincial y nacional; sentidos y valores de los símbolos y conmemoraciones; respeto por las diferencias y rechazo del prejuicio, el maltrato y la discriminación.",{"1.° a 3.°":["Reconocer las diferencias personales y respetarlas en la interacción con los otros.","Observar los roles de los integrantes de la familia, respetando la diversidad de conformaciones familiares actuales.","Conocer símbolos, festividades y celebraciones del ámbito cercano (Bandera Nacional, Escarapela, cantos patrios) y las conmemoraciones relevantes para la provincia.","Manifestar emociones y sentimientos con respeto y escucha atenta.","Producir carteleras y murales y describir símbolos, en articulación con Lengua y Ciencias Sociales."]}],
["Ciudadanía, derechos y participación","Conocer los derechos y participar activamente en su ejercicio, asumiendo responsabilidades y compromisos compartidos para la convivencia; experiencias democráticas y deliberativas sobre las normas de convivencia.",{"1.° a 3.°":["Diferenciar acciones personales que facilitan la convivencia a partir de relatos de experiencia y de relatos ficcionales.","Escribir murales y afiches con listas de acuerdos asumidos por el grupo.","Participar en la elaboración de los acuerdos de convivencia del aula y de la comunidad escolar: saber escuchar, tratarse con cortesía, evitar la violencia física y los sobrenombres peyorativos.","Conocer los derechos del niño a partir de experiencias personales y escolares, y valorar los Derechos Humanos y del Niño, su cumplimiento y su vulneración."]}]]),
"Segundo Ciclo":mk([
["Reflexión ética","Analizar críticamente y fundamentar conductas propias y ajenas, reflexionar sobre el sentido de las normas, argumentar posturas valorativas diversas y construir nociones de libertad, paz, solidaridad, igualdad, justicia, responsabilidad, bien común y respeto a la diversidad.",{"4.° a 6.°":["Reflexionar sobre situaciones conflictivas de la vida escolar y cotidiana (relatos, cuentos, leyendas, historietas) y problematizar nociones como justicia, solidaridad, libertad y responsabilidad, considerando la diversidad de opiniones.","Identificar conflictos en el contexto escolar y en otros ámbitos públicos, distinguiendo deberes, valores e intereses.","Reconocer los efectos de la acción humana en historias de vida personales y de figuras públicas del contexto local, regional y nacional (deportistas, músicos, escultores, artistas), identificando valores, estereotipos y formas de vida.","Registrar por escrito opiniones y sentimientos sobre los problemas éticos abordados.","Analizar críticamente los aspectos morales de los discursos de los medios y las TIC (televisión, noticieros, documentales)."]}],
["Construcción histórica de las identidades","Relacionar los saberes del Primer Ciclo para construir las identidades personales y los proyectos de vida; valorar las diversas formas de vinculación familiar y el respeto por esas diferencias en el marco de la Convención de los Derechos del Niño.",{"4.° a 6.°":["Conocerse a sí mismo y a los otros mediante la expresión de sentimientos, ideas y valoraciones y la escucha respetuosa.","Reconocer y respetar las expresiones culturales, cosmovisiones y sistemas de valores de los pueblos originarios de Formosa.","Analizar situaciones de maltrato, prejuicio y discriminación mediante el diálogo y el debate grupal.","Comprender la construcción histórica de los símbolos y conmemoraciones (Escudo y Bandera Nacional y Provincial, canciones patrias) y crear símbolos que representen al grupo.","Reconocer y respetar las diversas familias y las perspectivas de género en la construcción de identidades (en articulación con ESI).","Reconocer la influencia del discurso publicitario consumista y de los modelos corporales de los medios en la construcción de las identidades infantiles y juveniles."]}],
["Ciudadanía, derechos y participación","La importancia de la vida en democracia y sus dimensiones ética, jurídica, política y cultural; educación ambiental, vial, sexual, intercultural y cooperativa, entre otras.",{"4.° a 6.°":["Participar en experiencias democráticas escolares: búsqueda de consenso en decisiones colectivas, periódico escolar, buzones de propuestas para mejorar la convivencia y jornadas de integración.","Participar en proyectos mutuales, cooperativos y solidarios orientados a resolver necesidades grupales y comunitarias, y reflexionar sobre la solidaridad y la ayuda mutua.","Reconocerse a sí mismo y a los otros como sujetos de derecho, conocer los procedimientos para exigir los derechos y participar en su promoción y defensa.","Ser escuchados y consultados en los temas que les competen.","Circular de manera autónoma y segura por la vía pública como peatones y usuarios de medios de transporte (educación vial)."]}]])},
"Educación Tecnológica":{"Primer Ciclo":mk([
["Procesos tecnológicos","Operaciones organizadas sobre la materia, la energía o la información que realizan las personas con el cuerpo y con la ayuda de artefactos (herramientas, instrumentos, máquinas), con sus procedimientos y roles, y sus modos de representación y comunicación.",{"1.° a 3.°":["Indagar los procesos tecnológicos que realizan las personas con el cuerpo y con medios técnicos: dar forma a materiales para elaborar productos artesanales (modelado, estampado, embutido, corte).","Explorar maneras de transformar materias extraídas de la naturaleza (doblar, romper, deformar, mezclar, filtrar, mojar, secar).","Reconocer cómo se organizan los procesos: observar procesos para elaborar productos e identificar las operaciones técnicas y su orden.","Reconocer las tareas de las personas en los procesos y la información que se usa en cada etapa.","Participar en experiencias grupales de elaboración, cumpliendo roles y tareas.","Reconstruir la experiencia vivida en clase describiendo el proceso con lenguaje verbal y no verbal, dibujos, textos, fotos o videos.","Identificar y reproducir la secuencia para usar máquinas, entre ellas el equipamiento multimedial e informático."]}],
["Medios técnicos","Las herramientas y los artefactos: sus partes, sus formas y las funciones que cumplen, y la construcción de herramientas simples para resolver problemas.",{"1.° a 3.°":["Analizar y reproducir tareas de base manual y reconocer la necesidad de medios técnicos que ayuden a realizarlas.","Describir con gestos y palabras cómo se realiza una tarea con y sin herramientas.","Experimentar el uso adecuado y seguro de distintos medios técnicos sobre diferentes materiales.","Describir las características y partes de las herramientas con textos orales, escritos y dibujos, y relacionarlas con las tareas que realizan.","Resolver problemas imaginando y construyendo herramientas simples (sin partes móviles, y luego con uniones móviles)."]}],
["La tecnología como proceso sociocultural: diversidad, cambios y continuidad","Los procesos tecnológicos como parte de la producción y transformación cultural de las sociedades; comparación entre las tecnologías de ayer y de hoy.",{"1.° a 3.°":["Indagar la continuidad y los cambios de las tecnologías a través del tiempo y los distintos modos de hacer las cosas en diferentes épocas y oficios.","Reconocer que un mismo proceso puede realizarse con tecnologías distintas según el contexto y los medios disponibles (elaborar pan en casa, en la panadería o en la fábrica; comunicarse con cartas, teléfonos o Internet).","Reconocer familias de herramientas de un medio sociocultural y la relación entre sus características y la tarea.","Identificar problemas que se originan en el uso de ciertas tecnologías y reflexionar sobre cómo la información se transmite por distintos medios técnicos."]}]]),
"Segundo Ciclo":mk([
["Procesos tecnológicos","Operaciones organizadas sobre la materia, la energía o la información para lograr una finalidad (diseño y producción de objetos tecnológicos); planificación y control de sistemas de elaboración de bienes y servicios; representación y comunicación de la información técnica, con uso seguro de las TIC.",{"4.° a 6.°":["Experimentar maneras de dar forma a los materiales: los materiales con propiedades similares se conforman con técnicas semejantes (duros, blandos, flexibles).","Explorar propiedades mecánicas de los materiales (dureza, plasticidad, flexibilidad) y cómo cambiar la resistencia por plegado o agregado de material.","Analizar procesos de fabricación de varios pasos sucesivos y reconstruir secuencias para fabricar artefactos (por ejemplo, piezas de ajedrez de madera: aserrado, tallado, torneado y lijado).","Construir artefactos sencillos anticipando y organizando las tareas y compartiendo la asignación de roles.","Analizar procesos en contextos reales de producción (visitas, videos, fotos, relatos) e identificar el rol de las personas.","Analizar, usar y producir textos instructivos que indiquen insumos, cantidades, pasos y medios técnicos."]}],
["Medios técnicos","Los procedimientos necesarios para producir las transformaciones buscadas, con personas, instrumentos, herramientas y máquinas integrados como un sistema; descripción de los medios técnicos según sus funciones y construcción de artefactos para resolver problemas.",{"4.° a 6.°":["Reproducir y comparar actividades con herramientas simples y con mecanismos (por ejemplo, batidor o rallador manual y con manivela).","Diferenciar acciones de ejecución (empujar, tirar, apretar) y de control (regular la fuerza, mantener la dirección, determinar la duración).","Analizar artefactos describiendo sus partes: las que los accionan (palancas, manivelas, sogas), los mecanismos que transmiten el movimiento (poleas, engranajes) y las que actúan sobre insumos y entornos (cuchillas, ruedas).","Identificar y reproducir la secuencia para usar máquinas, entre ellas el equipamiento multimedial e informático.","Buscar y evaluar alternativas de solución a problemas de diseño; explorar cómo modificar mecanismos (tamaño de poleas, posición del punto de apoyo de una palanca) para cambiar el funcionamiento.","Planificar y construir artefactos y comparar los modelos terminados mediante dibujos de sus partes principales."]}],
["Reflexión sobre la tecnología como proceso sociocultural: diversidad, cambios y continuidades","Los procesos tecnológicos integrados a la compleja producción cultural de las sociedades; análisis comparativo de las tecnologías de ayer y de hoy para reconocer continuidades e innovaciones.",{"4.° a 6.°":["Reconocer y valorar la importancia del dominio de los materiales en las culturas tradicionales y en la actualidad, y las implicancias de la innovación de materiales en objetos de uso cotidiano.","Indagar la coexistencia de tecnologías diferentes en una misma sociedad o cultura y analizar los criterios para elegir distintos materiales (construcción, vestimenta, utensilios).","Reconocer que un mismo proceso puede realizarse con tecnologías diferentes según el contexto (producir en la casa, en el campo o en la fábrica; comunicarse por cartas, teléfonos o Internet).","Reconocer que los procesos y las tecnologías forman conjuntos, redes y sistemas."]}]])},
"Educación Física":{"Primer Ciclo":mk([
["Prácticas corporales ludomotrices: conocimiento, expresión, dominio y cuidado del cuerpo","Las prácticas corporales y motrices son el objeto de enseñanza: los niños construyen su corporeidad al apropiarse de ellas y recrearlas.",{"1.° a 3.°":["Identificar las partes del cuerpo y reconocer posturas convenientes e inconvenientes en tareas motrices y de la vida cotidiana.","Explorar las posibilidades de movimiento de los segmentos corporales (subir, bajar, acercar, separar, girar, doblar, estirar).","Reconocer las formas respiratorias, el ritmo cardíaco en reposo y en actividad, y los cambios corporales durante el esfuerzo (temperatura, sudoración, fatiga).","Integrar nociones de ubicación, direccionalidad, lateralidad, velocidad y trayectoria; agrupación y dispersión en el espacio de juego.","Explorar contrastes rítmico-temporales (rápido, lento, antes, después) y reproducir e inventar estructuras rítmicas con y sin elementos.","Habilidades motrices básicas: locomotrices (desplazamientos, saltos, giros, trepas, suspensiones, balanceos), no locomotrices (equilibrios) y manipulativas (lanzamientos, pases, recepciones, malabares).","Reflexionar sobre pautas de higiene personal y normas de seguridad."]}],
["Prácticas ludomotrices en interacción con otros","Juegos y prácticas expresivas con otros: socialización, apropiación de los espacios de acción y respeto de las reglas básicas, con inclusión de todos.",{"1.° a 3.°":["Participar en juegos en parejas y en pequeños grupos, compartiendo espacios y materiales, de cooperación y de oposición.","Participar en juegos cooperativos cuidándose a sí mismo, a los otros y al ambiente, y en juegos de bando y reglados.","Reflexionar sobre la regla de juego, acordar y practicar reglas que favorezcan la participación y la inclusión.","Explorar roles y actitudes básicas en los juegos y formas de ayuda y cooperación.","Reconocer y usar juegos tradicionales de la cultura propia, de otras culturas de la región y de otros lugares.","Participar en jornadas recreativas dentro y fuera de la escuela, compartiendo con otras instituciones.","Reflexionar sobre los conflictos del juego, aceptar los resultados y resolver conflictos de manera compartida."]}],
["Prácticas ludomotrices en el ambiente natural y otros","Exploración, disfrute y cuidado del ambiente natural, con normas básicas de interacción y seguridad.",{"1.° a 3.°":["Explorar y disfrutar del ambiente natural y otros asumiendo actitudes de cuidado.","Reconocer y respetar a los seres vivos de los espacios naturales y los riesgos que estos espacios puedan presentar.","Reflexionar sobre pautas y normas de seguridad personal.","Practicar acciones simples que contribuyan a la preservación del medio natural."]}]]),
"Segundo Ciclo":mk([
["Prácticas corporales, motrices y ludomotrices: disponibilidad de sí mismo","Participación en prácticas corporales y ludomotrices saludables, con disfrute, inclusión y cuidado de sí mismo y de los otros; desarrollo de la percepción de sí mismo y de las capacidades coordinativas y condicionales.",{"4.° a 6.°":["Registrar la disociación segmentaria en acciones motrices simultáneas.","Explorar las partes del cuerpo que intervienen en la respiración y reconocer el ritmo cardíaco y respiratorio en reposo y en actividad.","Aplicar posturas convenientes en las tareas motrices y de la vida cotidiana.","Usar en forma discriminada el lado no dominante en habilidades motrices básicas y combinadas.","Resolver situaciones lúdicas problemáticas de ubicación respecto de un objeto o de los demás, de interceptación de trayectorias y de relación entre distancia y tiempo.","Identificar y emplear las capacidades condicionales (fuerza, resistencia, flexibilidad, velocidad) y controlar posiciones de equilibrio en situaciones complejas.","Percibir avances en la coordinación dinámica, estática y visomotora y desarrollar confianza y perseverancia ante situaciones motrices problemáticas."]}],
["Prácticas ludomotrices en interacción con otros","Cooperación, comunicación y reglas en juegos colectivos, tradicionales y autóctonos.",{"4.° a 6.°":["Usar de manera cooperativa las habilidades motrices básicas y combinadas para resolver situaciones de juego.","Explorar acciones comunicativas y códigos de comunicación compartidos; elaborar y aplicar códigos propios.","Valorar prácticas de integración en juegos colectivos, tradicionales, autóctonos y de otras culturas.","Reconocer al oponente y a los otros como compañeros de juego y reflexionar sobre la satisfacción de integrar el trabajo propio dentro del grupo.","Analizar la posibilidad de usar estas actividades en el tiempo libre y como actividad recreativa entre amigos."]}],
["Prácticas ludomotrices en el ambiente natural y otros"]])},
"Educación Artística: Música":{"Primer Ciclo":mk([
["Construcción de la identidad y la cultura","Conocimiento y valoración del patrimonio musical y audición de música en vivo de artistas locales, regionales y nacionales.",{"1.° a 3.°":["Participar y disfrutar de la audición de obras musicales de diversos tipos y procedencias del ámbito local y regional, en forma directa o mediatizada por recursos tecnológicos.","Experimentar audiciones de música en vivo de artistas formoseños y regionales.","Valorar manifestaciones musicales de diversos géneros y estilos, expresando percepciones y opiniones con la palabra y otros medios de expresión."]}],
["Elementos del lenguaje musical","Audición reflexiva de los elementos del lenguaje musical usando el cuerpo y el movimiento; escucha atenta y percepción musical.",{"1.° a 3.°":["Imitar, explorar y ejecutar movimientos libres y pautados en relación con la música que se escucha.","Traducir en movimientos corporales las relaciones musicales temporales y espaciales con fines expresivos.","Participar en juegos grupales con percusión corporal, desplazamientos, mímicas y gestos a partir de una música determinada.","Participar en juegos de manos, canciones, rimas, trabalenguas y otros textos orales coordinando el propio movimiento con el de los demás."]}],
["Práctica del lenguaje musical","Proyectos musicales individuales, grupales y colectivos de ejecución instrumental y vocal; imaginación, creatividad y sensibilidad estético-musical.",{"1.° a 3.°":["Manipular y explorar instrumentos y materiales sonoros diversos (convencionales y no convencionales) con fines expresivos.","Ejecutar ritmos de baja densidad cronométrica a tempo moderado.","Interpretar canciones acordes a su tesitura vocal, de estilos y géneros variados, partiendo del repertorio familiar.","Explorar las posibilidades vocales (voz hablada y cantada: susurros, glissandos, imitación de sonidos del entorno) y usarlas en arreglos vocales y sonorizaciones.","Transformar las producciones con distintos toques y modos de acción sobre fuentes sonoras, e improvisar motivos rítmicos y melódicos con la voz, la percusión corporal y otras fuentes."]}]]),
"Segundo Ciclo":mk([
["Contextualización sociocultural","Contextos culturales, históricos, políticos, económicos y sociales, y estilos y géneros musicales del entorno próximo; respeto por la diversidad cultural.",{"4.° a 6.°":["Reconocer el contexto multicultural de las producciones sonoras: el entorno sonoro local y regional, en particular el de los pueblos originarios de Formosa (wichí, qom y pilagá).","Atender al cruzamiento entre la producción musical local y regional y la de otras culturas, y a la relación entre las fuentes sonoras y su contexto geográfico e histórico (instrumentos, danzas típicas, lugares donde circula la música).","Aproximarse a los profesionales de la música: instrumentistas, compositores, musicalizadores y sonidistas.","Diferenciar géneros (vocal e instrumental) y aproximarse a los estilos (cancionero tradicional, folklore, tango, rock y pop, música académica).","Indagar las propuestas musicales de la comunidad (centros culturales, peñas, festivales, clubes, recitales al aire libre, plazas).","Reflexionar sobre la función de la música en las TIC (jingles, cortinas, programas musicales, producciones audiovisuales)."]}],
["Prácticas del lenguaje musical","Audición y producción musical, pensamiento divergente, apropiación de un lenguaje técnico y posibilidades de las TIC.",{"4.° a 6.°":["Participar en propuestas de producción musical individuales, grupales o colectivas, revalorizando el entorno musical local y de la región y ampliándolo a otros contextos estéticos.","Desarrollar el pensamiento divergente mediante la ruptura, el cambio y la búsqueda de lo novedoso como modos de aproximación a la creatividad.","Usar el propio cuerpo (voz hablada y cantada, sonidos corporales), instrumentos musicales y materiales no convencionales como fuentes sonoras.","Improvisar (aleatoria y pautada), elaborar y desarrollar recursos técnico-vocales para un repertorio diverso de canciones.","Escuchar e identificar las características sonoras de fuentes convencionales y no convencionales (familias de instrumentos, materiales, elemento vibrante, modos de acción).","Identificar los instrumentos de las músicas populares del contexto cercano (acústicos, eléctricos y con tecnologías digitales) y sus posibilidades sonoras.","Identificar rasgos musicales que definen la pertenencia de una obra a una estética, yendo de lo próximo a lo lejano."]}]])},
"Educación Artística: Artes del movimiento":{"Primer Ciclo":mk([
["Construcción de identidad y cultura","Valoración y participación en manifestaciones danzadas y espectáculos de artes del movimiento locales, regionales y nacionales.",{"1.° a 3.°":["Participar en situaciones corporales danzadas: encuentros, espectáculos, juegos tradicionales y de la cultura escolar y familiar, y actos escolares.","Conversar y reflexionar para poner en palabras emociones, gustos y preferencias sobre las manifestaciones observadas o realizadas.","Valorar las manifestaciones danzadas en el contexto escolar y extraescolar."]}],
["Elementos de las artes del movimiento","Formas, exploración y experimentación del movimiento: cuerpo, espacio, tiempo y ritmo.",{"1.° a 3.°":["Reconocer la imagen global y segmentada del propio cuerpo y del de los pares.","Explorar formas de movimiento individuales, en parejas y grupales.","Experimentar cambios en la dinámica del movimiento: rápido y lento, fuerte y suave.","Improvisar y crear desplazamientos que den la vivencia de las primeras coreografías.","Conectar con distintos ritmos corporales, sentimientos o la comprensión de un texto."]}],
["Práctica de las artes del movimiento","Memoria corporal para coreografías simples y producciones contextualizadas; participación en actos escolares y concursos infantiles.",{"1.° a 3.°":["Participar en proyectos de movimiento corporal individuales, en parejas y grupales para explorar las posibilidades del cuerpo.","Desarrollar la atención, la observación y la percepción.","Incorporar prácticas como las rondas infantiles, coordinando movimientos a partir de esquemas, figuras y estímulos sonoros.","Trabajar en parejas, en espejo, en grupos, con movimientos enfrentados y en canon."]}]]),
"Segundo Ciclo":mk([
["Contextualización sociocultural","Relaciones entre el contexto y la producción de manifestaciones con el lenguaje de la danza, desde lo local hacia las producciones regionales, nacionales y universales como patrimonio cultural.",{"4.° a 6.°":["Comprender y valorar las danzas del patrimonio cultural local y regional, con énfasis en las cosmovisiones de las danzas de los pueblos originarios (wichí, qom y pilagá).","Observar y analizar el entorno como factor condicionante del movimiento en la vida cotidiana.","Observar coreografías locales, regionales, nacionales e internacionales y reconocer a sus artistas, en vivo o mediante las TIC."]}],
["Práctica de la danza","Análisis, observación e interpretación de producciones danzadas; elementos del lenguaje del movimiento: cuerpo, espacio, tiempo, peso, calidades de movimiento y comunicación.",{"4.° a 6.°":["Explorar las posibilidades de movimiento del propio cuerpo y del de otros: alineación, apoyos, descarga del peso, tono muscular y formas simples de locomoción.","Experimentar el ajuste del movimiento a parámetros temporales y su vinculación con la música.","Interactuar en grupo buscando respuestas corporales diversas (dúos, tríos, cuartetos) y experimentar códigos de comunicación corporal: imitación, oposición y conducción.","Explorar, improvisar, reproducir, interpretar e inventar secuencias sencillas de movimiento.","Interpretar pasos, secuencias y coreografías de diferentes danzas folklóricas."]}]])},
"Educación Artística: Teatro":{"Primer Ciclo":mk([
["Elementos del lenguaje teatral","Reconocimiento de los elementos que componen el lenguaje teatral (acción, personajes, conflictos, entorno, argumento) para el autoconocimiento, el conocimiento del otro y el desarrollo de la sensibilidad estética.",{"1.° a 3.°":["Reconocer los elementos del lenguaje teatral (acción, personaje, entorno) en el juego dramático propuesto por el docente.","Diferenciar el espacio y tiempo ficcional y real a partir de la exploración del «como si»."]}],
["Práctica del lenguaje teatral","Posibilidades expresivas y comunicativas del cuerpo y la voz en proyectos teatrales grupales, inclusivos y cooperativos.",{"1.° a 3.°":["Reconocer y expresar emociones y sentimientos con el cuerpo y la voz; explorar las posibilidades del movimiento, el ritmo, el gesto, los sonidos y la voz propia y de los demás.","Practicar juegos de comunicación no verbal para superar estereotipias.","Participar en proyectos teatrales colectivos, con y sin objetos, y ejercitar la atención, la observación, la imaginación y la percepción.","Explorar la forma dialogada entre personajes reales o imaginarios.","Disfrutar las producciones del grupo como espectador y reconstruir y valorar el trayecto recorrido, con la orientación del docente.","Construir vínculos de solidaridad y respeto en actividades lúdico-dramáticas."]}],
["Construcción de identidad y cultura","Participación, conocimiento y valoración de manifestaciones teatrales locales y nacionales; proyectos grupales para fortalecer la autoestima.",{"1.° a 3.°":["Participar y valorar manifestaciones teatrales locales y lejanas como espectadores y como protagonistas, en forma directa o mediante soportes tecnológicos.","Reflexionar y expresar la opinión personal sobre los espectáculos con distintos medios expresivos."]}]]),
"Segundo Ciclo":mk([
["Elementos y práctica del lenguaje teatral","Participación activa en manifestaciones teatrales para explorar, experimentar y usar los elementos del lenguaje teatral y disfrutar de la capacidad de representación simbólica.",{"4.° a 6.°":["Elaborar paulatinamente el esquema corporal propio y su relación con el de los demás; experimentar calidades de movimiento (tiempo, espacio, energía) mediante juegos corporales.","Improvisar situaciones de ficción con distintos roles, conflictos, entornos y secuencias de acción.","Identificar la acción como generadora y transformadora del espacio, el tiempo, los personajes y las situaciones teatrales.","Explorar los elementos de la construcción escénica (sonoros, coreográficos, lumínicos, escenográficos, de vestuario y maquillaje) y sus posibilidades simbólicas.","Crear situaciones dramáticas a partir de sus experiencias, de temáticas de su interés y de distintos tipos de textos."]}],
["Contextualización de las manifestaciones teatrales en la construcción de identidad y cultura","Disfrute de manifestaciones teatrales locales, regionales y nacionales como expresión del patrimonio cultural, y formación de criterios éticos y estéticos para valorar el espectáculo.",{"4.° a 6.°":["Disfrutar y apreciar manifestaciones teatrales locales y regionales, dentro y fuera de la escuela.","Registrar títulos, autores y actores de las obras vistas.","Localizar la producción artística en su contexto sociocultural."]}]])},
"Educación Artística: Artes visuales":{"Primer Ciclo":mk([
["Práctica del lenguaje visual","Proyectos de producción personales o grupales con color, textura, forma, espacio y dimensiones, en contacto directo con producciones o mediante las TIC.",{"1.° a 3.°":["Desarrollar representaciones a partir de la exploración sensorial de lo cotidiano para cultivar la sensibilidad estética.","Crear imágenes personales y grupales con procedimientos y técnicas bidimensionales (dibujo y pintura) y tridimensionales (modelado y móviles).","Iniciarse en el uso de las TIC como herramienta para crear imágenes."]}],
["Construcción de identidad y cultura","Reconocimiento de las artes visuales en las manifestaciones que representan el patrimonio visual local y regional para establecer relaciones con lo universal.",{"1.° a 3.°":["Reconocer las artes visuales y el lenguaje visual en las producciones próximas a la escuela o al barrio.","Iniciarse en el descubrimiento del color, la forma, la textura y el volumen y atribuirles significados.","Leer producciones artísticas regionales e intercambiar opiniones sobre las producciones propias y de los otros."]}]]),
"Segundo Ciclo":mk([
["Práctica del lenguaje visual","Conocimiento y apropiación de los elementos, materiales, soportes, técnicas y procedimientos del lenguaje visual, bi y tridimensional, a partir de la producción y de la lectura de producciones visuales.",{"4.° a 6.°":["Realizar producciones visuales (pinturas, impresos, objetos, instalaciones, dibujos, construcciones) con conocimiento de los elementos, materiales, soportes y técnicas.","Participar en producciones artísticas grupales que potencien el diálogo, la argumentación, el respeto por el otro y la resolución de conflictos.","Reflexionar sobre que las decisiones del proceso de producción responden a la intención comunicativa y al sentido estético.","Interpretar producciones visuales propias y ajenas (de pares y de artistas de la región, del país y del mundo), de variadas épocas, espacios, géneros y estilos.","Incorporar vocabulario técnico del lenguaje visual y distinguir la interpretación literal de la metafórica."]}],
["Contextualización de la imagen visual","Análisis y valoración de producciones artísticas propias, de pares y de otros artistas, en exposiciones, salones y museos.",{"4.° a 6.°":["Reconocer a los artistas visuales de la comunidad y la región (pintores, tejedores, escultores, diseñadores, grabadores).","Analizar la imagen visual en su contexto de producción y circulación."]}]])},

["Capacidades básicas (Primer y Segundo Ciclo)","Capacidades que se desarrollan en Lengua y Cultura Originaria durante toda la Educación Primaria.",{"1.° a 3.°":["Producción oral y escrita: elaborar información escolar genuina sobre las prácticas y saberes de las culturas originarias de Formosa; participar de forma asidua en situaciones de oralidad, lectura y escritura; producir narraciones orales y escritas sencillas en lengua originaria.","Escucha atenta: reconocer la espiritualidad y los valores propios de la tradición oral y de las expresiones artísticas; integrar prácticas lingüísticas y metalingüísticas para entender cómo funciona la lengua.","Ubicación temporo-espacial: valorar las características del contexto comunitario y su transformación a través del tiempo; comprender el proceso histórico de las organizaciones comunitarias.","Comprensión lectora: reconocer los roles y funciones que hacen a la buena convivencia de los integrantes de la familia y de la comunidad."]}],

"Educación Artística":["Producción plástica (collage, pintura o dibujo) inspirada en {T}.","Canción o ritmo con percusión corporal relacionados con {T}.","Dramatización de una escena breve sobre {T}.","Danza o coreografía sencilla creada por el grupo a partir de {T}."],
"Formación Ética y Ciudadana":["Lectura de un relato con un dilema sobre {T} y conversación: ¿qué haría cada uno?","Asamblea de aula para acordar normas y compromisos relacionados con {T}.","Juego de roles para representar una situación de {T} y buscar soluciones dialogadas.","«Caja de dudas»: los alumnos escriben preguntas sobre {T} y las responden entre todos."]};
function actOpts(d){
 const T=(N.txt||"").trim()||(d.o.split("\n")[0]||d.t).slice(0,60);
 const fill=s=>s.replace(/\{T\}/g,T);
 const lib=LIB.filter(p=>p.a===d.a&&(p.g===d.g||(p.gs&&p.gs.includes(d.g)))).flatMap(p=>p.ac.slice(0,3).map(x=>x)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,8);
 const grp=[["Para empezar",BANK.ini.map(fill)],["Para desarrollar el tema ("+d.a+")",(BANK[d.a]||[]).map(fill)],["Para cerrar",BANK.cie.map(fill)]];
 if(lib.length)grp.push(["De la biblioteca (mismo área y grado)",lib]);
 return grp.map(([t,l])=>`<h3>${esc(t)}</h3>`+l.map(x=>`<label class="opt"><input type="checkbox" class="aopt" value="${esc(x)}"><span>${esc(x)}</span></label>`).join("")).join("")}
function go(t){tab=t;open=null;render();window.scrollTo(0,0)}
function render(){
 const m=$("#app");
 if(open){const all=LIB.concat(mine),p=all.find(x=>x.id===open);m.innerHTML=detail(p,p.id[0]==="m");
  $("#back").onclick=()=>{open=null;render()};
  $("#print").onclick=()=>{try{window.print()}catch(e){$("#msg").textContent=" No se pudo abrir la impresión."}};
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(toText(p));$("#msg").textContent=" Texto copiado."}catch(e){$("#msg").textContent=" No se pudo copiar."}};
  if($("#del"))$("#del").onclick=()=>{mine=mine.filter(x=>x.id!==p.id);save();open=null;tab="mine";render()};
  return}
 if(tab==="home"){
  const mi=[["ped","Planificación en Word","Lengua o Matemática, esquema de la escuela","sage"],["lib","Biblioteca","Proyectos por área y grado","sand"],["mine","Mis proyectos",mine.length?mine.length+(mine.length===1?" guardado":" guardados"):"Los que vos creás","blush"],["cal","Calendario","Saberes mes a mes","lav"],["dc","Diseño Curricular","Saberes por área y ciclo","sky"],["int","Intensificación","Armá tu propio plan","sage"]];
  m.innerHTML=`<section class="home"><button class="btn primary big" data-go="new" type="button">Crear proyecto</button><p class="hint">o explorá</p><div class="menu">${mi.map(([k,t,s,c])=>`<button class="btn tile ${c}" data-go="${k}" type="button"><span>${t}</span><small>${s}</small></button>`).join("")}</div></section>`;
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));return}
 if(tab==="lib"){
  const show=F.a||F.q||F.i;
  const L=LIB.filter(p=>(!F.a||p.a===F.a)&&(!F.g||p.g===F.g||(p.gs&&p.gs.includes(F.g)))&&(!F.i||p.int)&&(!F.q||(p.t+p.f).toLowerCase().includes(F.q.toLowerCase())));
  m.innerHTML=vhead("Biblioteca")+`<div style="margin:6px 0 12px"><input id="q" type="search" placeholder="Buscar un tema" value="${esc(F.q)}" aria-label="Buscar"></div>`+chips("fa",AREAS,F.a)+(F.a?chips("fg",GRADOS,F.g,"Todos los grados"):"")+`<div class="chips"><button class="btn s${F.i?" on":" alt"}" id="fi" type="button">Solo intensificación</button></div>`+(show?cards(L,"No hay proyectos con esos filtros. Probá con otra área o grado."):`<p class="empty">Elegí un área o buscá un tema para ver los proyectos.</p>`);
  $("#q").oninput=e=>{F.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)};
  bind("fa",v=>{F.a=F.a===v?"":v;F.g="";render()});bind("fg",v=>{F.g=v;render()});$("#fi").onclick=()=>{F.i=F.i?"":"1";render()};
 }else if(tab==="int"){
  const A=DCA[IS.a],sab=[];
  Object.values(A).forEach(C=>C.e.forEach(E=>Object.entries(E.g).forEach(([k,l])=>{if(gm(k,IS.g))l.forEach(x=>sab.push({t:x,e:E.n}))})));
  const prs=LIB.concat(mine).filter(p=>p.g===IS.g||(p.gs&&p.gs.includes(IS.g)));
  const ck=(nm,i,t,sub)=>`<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);margin:8px 0;font-size:.95rem"><input type="checkbox" name="${nm}" value="${i}" style="width:auto;margin-top:5px"><span>${esc(t)}${sub?`<br><small style="color:var(--mute)">${esc(sub)}</small>`:""}</span></label>`;
  m.innerHTML=vhead("Intensificación")+`<p class="lead">Armá tu propio plan: elegí área y grado, marcá los saberes o proyectos que quieras y sumá tus temas. Se guarda en «Mis proyectos».</p>`+chips("ia",Object.keys(DCA),IS.a)+chips("ig",GRADOS,IS.g)+`<form id="fint"><label>Nombre del plan<input name="t" placeholder="Período de intensificación"></label><label>Semanas<input name="w" type="number" min="1" max="20" value="2"></label><div style="height:10px"></div>${acc(`Saberes del Diseño Curricular (${IS.g} grado)`,sab.length?sab.map((x,i)=>ck("s",i,x.t,x.e)).join(""):`<p class="empty">No hay saberes cargados para este grado y área. Escribí tus propios temas más abajo.</p>`)}${prs.length?acc(`Proyectos de la biblioteca (${IS.g} grado)`,prs.map((x,i)=>ck("pr",i,x.t,x.a)).join("")):""}<label>Tus propios temas (uno por línea)<textarea name="cu" rows="3"></textarea></label>${acc("Más detalles (opcional)",`<label>Fundamentación o nota<textarea name="f" rows="2"></textarea></label><label>Recursos<input name="r"></label><label>Evaluación<input name="e"></label><label>Producto final<input name="p"></label>`)}<p id="imsg" role="status" style="color:var(--accent)"></p><p><button class="btn primary" type="submit">Guardar plan</button></p></form>`;
  bind("ia",v=>{IS.a=v;render()});bind("ig",v=>{IS.g=v;render()});
  $("#fint").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);
   const o=d.getAll("s").map(i=>sab[+i].t).concat(String(d.get("cu")).split("\n").map(x=>x.trim()).filter(Boolean));
   const ac=d.getAll("pr").map(i=>"Proyecto de la biblioteca: "+prs[+i].t);
   if(!o.length&&!ac.length){$("#imsg").textContent="Elegí al menos un saber o proyecto, o escribí un tema propio.";return}
   const q={id:"m"+Date.now(),t:d.get("t")||"Período de intensificación",a:IS.a,g:IS.g,w:+d.get("w")||1,int:true,f:d.get("f")||"Plan de intensificación armado por la o el docente según las necesidades de su grupo.",o:o.length?o:["Temas a definir por la o el docente."],ac:ac.length?ac:["Actividades a definir por la o el docente."],r:d.get("r")||"A definir por la o el docente.",e:d.get("e")||"A definir por la o el docente.",p:d.get("p")||"A definir por la o el docente."};
   mine.unshift(q);save();go("mine")};
 }else if(tab==="cal"){
  const D=CS.a&&CS.g?(CAL[CS.a]||{})[CS.g]:null;
  let body;
  if(!CS.a||!CS.g)body=`<p class="empty">Elegí un área y un grado.</p>`;
  else if(!D)body=`<p class="empty">La calendarización de esta área y grado todavía no está cargada.</p>`;
  else body=D.p.map(x=>acc(x[0],ul(x[1]))).join("")+acc(D.extra[0],ul(D.extra[1]))+(D.more||[]).map(x=>acc(x[0],ul(x[1]))).join("")+`<p class="note">${esc(D.nota)}</p>`;
  m.innerHTML=vhead("Calendario")+`<p class="lead">Saberes por mes, año 2026.</p>`+chips("ca",AREAS,CS.a)+chips("cg",GRADOS,CS.g)+`<div style="height:8px"></div>`+body+acc("¿Qué calendarios hay cargados?",`<p>${AREAS_NOTE}</p>`);
  bind("ca",v=>{CS.a=v;render()});bind("cg",v=>{CS.g=v;render()});
 }else if(tab==="dc"){
  const A=DS.a?DCA[DS.a]:null,cs=A?Object.keys(A):[],C=A&&A[DS.c]?A[DS.c]:null;
  let body="";
  if(!A)body=`<p class="empty">Elegí un área.</p>`;
  else if(C)body=C.e.map((E,i)=>{const has=Object.keys(E.g).length>0;return acc(E.n,(E.s?`<p>${esc(E.s)}</p>`:"")+(has?Object.entries(E.g).map(([g,l])=>`<h3>${esc(g)} grado</h3>`+(l.length?ul(l):"<p>Sin saberes cargados todavía.</p>")).join("")+`<button class="btn s dcuse" data-e="${i}" type="button" style="margin-top:12px">Crear proyecto con estos saberes</button>`:`<p class="empty">El detalle por grado de este eje está en proceso de carga.</p>`))}).join("");
  m.innerHTML=vhead("Diseño Curricular")+`<p class="lead">Resumen propio de los saberes priorizados del Diseño Curricular de Educación Primaria de Formosa. Validar con el documento oficial.</p>`+chips("d0",Object.keys(DCA),DS.a)+(A?chips("d1",cs,DS.c):"")+`<div style="height:8px"></div>`+body;
  bind("d0",v=>{DS.a=v;DS.c=Object.keys(DCA[v])[0];render()});bind("d1",v=>{DS.c=v;render()});
  m.querySelectorAll(".dcuse").forEach(b=>b.onclick=()=>{const E=C.e[+b.dataset.e];PRE=Object.entries(E.g).filter(([g,l])=>l.length).map(([g,l])=>g+": "+l[0]).join("\n");go("new")});
 }else if(tab==="ped"){
  const fld=(id,l,k,ph)=>`<label>${l}<input id="${id}" value="${esc(R[k])}" placeholder="${ph||""}"></label>`;
  m.innerHTML=vhead("Planificación en Word")+`<p class="lead">Escribí qué necesitás y elegí área y grado. La app arma la planificación con el esquema de la escuela (Lengua o Matemática, cada área por separado) para que la completes y la descargues en Word.</p>`+chips("pa",["Lengua","Matemática"],R.a)+chips("pg",GRADOS,R.g)+`<form id="fp" class="noprint"><label>¿Qué necesitás? Escribí tu pedido<textarea id="ptx" rows="4" placeholder="Ej.: Leyenda del yasyyateré, con escritura de palabras y oraciones">${esc(R.txt)}</textarea></label><div style="height:10px"></div>${acc("Datos de la propuesta (opcional)",fld("pdo","Docente/s","doc")+fld("pse","Secciones","sec","A, B, C")+fld("pan","Año","anio")+fld("pdu",R.a==="Lengua"?"Duración (ej.: bimestral)":"Duración (días aproximados)","dur")+fld("pn","Cantidad de clases","n"))}<p><button class="btn primary" type="submit">Armar planificación</button></p></form>`+(R.out?`<div class="noprint"><button class="btn" id="pdl" type="button">Descargar en Word</button><button class="btn alt" id="ppr" type="button">Imprimir o guardar PDF</button><button class="btn alt" id="pcp" type="button">Copiar texto</button><span id="msg" role="status"></span></div><p class="note noprint">Es un borrador con el esquema de la escuela: completá las líneas de puntos y ajustá las actividades a tu grupo.</p><article class="doc" id="pout" style="overflow-x:auto;max-width:900px">${R.out}</article>`:"");
  const sync=()=>{const v=id=>{const e=$("#"+id);return e?e.value:null},set=(k,id)=>{const x=v(id);if(x!==null)R[k]=x};set("txt","ptx");set("doc","pdo");set("sec","pse");set("anio","pan");set("dur","pdu");set("n","pn")};
  bind("pa",v=>{sync();R.a=v;R.out="";render()});bind("pg",v=>{sync();R.g=v;R.out="";render()});
  $("#fp").onsubmit=e=>{e.preventDefault();sync();R.out=planHTML();render();const o=$("#pout");if(o)o.scrollIntoView({behavior:"smooth"})};
  if($("#pdl")){$("#pdl").onclick=()=>{try{dlWord()}catch(e){$("#msg").textContent=" No se pudo descargar."}};
   $("#ppr").onclick=()=>{try{window.print()}catch(e){$("#msg").textContent=" No se pudo abrir la impresión."}};
   $("#pcp").onclick=async()=>{try{await navigator.clipboard.writeText($("#pout").innerText);$("#msg").textContent=" Texto copiado."}catch(e){$("#msg").textContent=" No se pudo copiar."}}}
 }else if(tab==="mine"){
  m.innerHTML=vhead("Mis proyectos")+cards(mine,"Todavía no creaste proyectos. Empezá con «Crear proyecto».")
 }else{
  const d=N.d;
  if(N.st===0){
   m.innerHTML=vhead("Crear proyecto")+`<p class="lead">Contá qué proyecto necesitás y la app lo arma por vos con los saberes del Diseño Curricular. Después podés ajustarlo y guardarlo.</p>`+chips("na",AREAS,N.a)+chips("ng",GRADOS,N.g)+`<form id="fn"><label>¿Qué proyecto necesitás? Escribí tu pedido<textarea id="ntx" rows="4" placeholder="Ej.: Las leyendas de los pueblos originarios de Formosa, con lectura, escritura de un relato y una muestra final">${esc(N.txt)}</textarea></label><label>Duración (semanas)<input id="nw" type="number" min="1" max="20" value="${esc(N.w)}"></label>${PRE?`<p class="note">Se usarán los saberes que elegiste en el Diseño Curricular.</p>`:""}<p style="margin-top:16px"><button class="btn primary" type="submit">Armar proyecto</button></p></form>`;
   const sync=()=>{const t=$("#ntx"),w=$("#nw");if(t)N.txt=t.value;if(w)N.w=w.value};
   bind("na",v=>{sync();N.a=v;render()});bind("ng",v=>{sync();N.g=v;render()});
   $("#fn").onsubmit=e=>{e.preventDefault();sync();N.d=genProject();N.st=1;render();window.scrollTo(0,0)};
  }else{
   m.innerHTML=vhead("Tu proyecto")+`<p class="note">Armé este borrador${d.base?` con ideas de «${esc(d.base)}» de la biblioteca`:""}. Revisalo, cambiá lo que quieras y guardalo.</p><div class="noprint"><button class="btn s alt" id="nback" type="button">Cambiar el pedido</button></div><form id="f"><label>Título<input name="t" required value="${esc(d.t)}"></label><div class="row"><div><label>Área<select name="a">${opts(AREAS,d.a)}</select></label></div><div><label>Grado<select name="g">${opts(GRADOS,d.g)}</select></label></div><div><label>Semanas<input name="w" type="number" min="1" max="20" value="${esc(d.w)}"></label></div></div>
   <label>Fundamentación<textarea name="f" rows="5" required>${esc(d.f)}</textarea></label><label>Objetivos (uno por línea)<textarea name="o" rows="5">${esc(d.o)}</textarea></label><label>Actividades (una por línea)<textarea name="ac" rows="9">${esc(d.ac)}</textarea></label><div style="height:10px"></div>${acc("Opciones de actividades para tu tema (tocá las que quieras sumar)",actOpts(d))}${acc("Recursos, evaluación y producto final",`<label>Recursos<input name="r" value="${esc(d.r)}"></label><label>Evaluación<input name="e" value="${esc(d.e)}"></label><label>Producto final<input name="p" value="${esc(d.p)}"></label><label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" name="int" style="width:auto"> Proyecto para el período de intensificación</label>`)}<p><button class="btn primary" type="submit">Guardar proyecto</button></p></form>`;
   $("#nback").onclick=()=>{N.st=0;render()};
   document.querySelectorAll(".aopt").forEach(c=>c.onchange=()=>{const ta=document.querySelector("[name=ac]");let ls=ta.value.split("\n").filter(x=>x.trim());if(c.checked){if(!ls.includes(c.value))ls.push(c.value)}else ls=ls.filter(x=>x!==c.value);ta.value=ls.join("\n");ta.rows=Math.min(16,Math.max(9,ls.length+1))});
   $("#f").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),ln=k=>String(d.get(k)).split("\n").map(s=>s.trim()).filter(Boolean);
    const p={id:"m"+Date.now(),t:d.get("t"),a:d.get("a"),g:d.get("g"),w:+d.get("w")||1,int:d.get("int")==="on",f:d.get("f"),o:ln("o"),ac:ln("ac"),r:d.get("r"),e:d.get("e"),p:d.get("p")};
    mine.unshift(p);save();PRE="";N.st=0;N.d=null;N.txt="";go("mine")};
  }
 }
 const hb=$("#home");if(hb)hb.onclick=()=>go("home");
 m.querySelectorAll(".card").forEach(c=>c.onclick=()=>{open=c.dataset.id;render();window.scrollTo(0,0)});
}
$("#hd").onclick=e=>{e.preventDefault();go("home")};
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
